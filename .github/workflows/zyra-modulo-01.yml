name: zyra-w17-final-five-engines

"on":
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

concurrency:
  group: zyra-w17-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "cryptography>=42,<45" "flake8>=7,<8" "mypy>=1.10,<2" "pytest>=8,<9"

      - name: Clean engine inits (W391)
        run: |
          set -euo pipefail
          for f in compliance integrations export interoperability ai; do
            p="shared_engines/$f/__init__.py"
            [ -f "$p" ] && printf '"""ZYRA Network engine package."""\n' > "$p"
          done
          echo "inits cleaned"

      - name: Engine compliance
        run: |
          set -euo pipefail
          cat > shared_engines/compliance/engine.py <<'PYEOF'
          """Compliance engine: jurisdiction policies and
          audited decisions (multi-jurisdiction by design)."""
          from __future__ import annotations

          import hashlib
          import sqlite3
          from dataclasses import dataclass

          from shared_engines.audit.chain import AuditTrail
          from shared_engines.common.clocks import Clock
          from shared_engines.common.errors import (
              NotFoundError,
          )
          from shared_engines.common.identifiers import (
              new_id,
          )
          from shared_engines.common.serialization import (
              canonical_json_dumps,
          )
          from shared_engines.common.validation import (
              require_int_range,
              require_non_empty_str,
          )
          from shared_engines.events.outbox import Outbox
          from shared_engines.storage.database import (
              Database,
          )
          from shared_engines.storage.migrations import (
              Migration,
              MigrationRunner,
          )

          EVENT_DECISION = (
              "compliance.decision.recorded"
          )

          _MIGRATIONS = (
              Migration(
                  1,
                  "compliance",
                  (
                      "CREATE TABLE"
                      " compliance_policies ("
                      " policy_id TEXT PRIMARY KEY,"
                      " jurisdiction TEXT NOT NULL,"
                      " requirement TEXT NOT NULL,"
                      " mandatory INTEGER NOT NULL,"
                      " version INTEGER NOT NULL,"
                      " active INTEGER NOT NULL,"
                      " created_at REAL NOT NULL)",
                      "CREATE INDEX comp_lookup"
                      " ON compliance_policies"
                      " (jurisdiction,"
                      " requirement, active)",
                      "CREATE TABLE"
                      " compliance_decisions ("
                      " decision_id TEXT PRIMARY"
                      " KEY,"
                      " subject_zid TEXT NOT NULL,"
                      " policy_id TEXT NOT NULL,"
                      " compliant INTEGER NOT NULL,"
                      " reason TEXT NOT NULL,"
                      " decided_at REAL NOT NULL)",
                  ),
              ),
          )


          class PolicyNotFoundError(NotFoundError):
              """No active policy for that jurisdiction
              and requirement."""


          @dataclass(frozen=True)
          class PolicyRecord:
              policy_id: str
              jurisdiction: str
              requirement: str
              mandatory: bool
              version: int
              active: bool


          @dataclass(frozen=True)
          class ComplianceDecision:
              decision_id: str
              subject_zid: str
              jurisdiction: str
              requirement: str
              compliant: bool
              policy_id: str
              reason: str


          class ComplianceEngine:
              """Jurisdiction policies -> audited
              decisions."""

              def __init__(
                  self,
                  db: Database,
                  clock: Clock,
                  *,
                  audit: AuditTrail,
                  outbox: Outbox,
              ) -> None:
                  self._db = db
                  self._clock = clock
                  self._audit = audit
                  self._outbox = outbox
                  MigrationRunner(
                      db, "compliance", _MIGRATIONS
                  ).run(clock)

              def _emit(
                  self,
                  cursor: sqlite3.Cursor,
                  *,
                  aggregate: str,
                  payload: dict[str, object],
              ) -> None:
                  uid = hashlib.sha256(
                      canonical_json_dumps(
                          {
                              "a": aggregate,
                              "u": new_id(),
                          }
                      ).encode("utf-8")
                  ).hexdigest()[:32]
                  fp = hashlib.sha256(
                      canonical_json_dumps(
                          {
                              "id": uid,
                              "ty": EVENT_DECISION,
                          }
                      ).encode("utf-8")
                  ).hexdigest()
                  cursor.execute(
                      "INSERT INTO events_outbox"
                      " (event_id, event_type,"
                      " aggregate_id, schema_version,"
                      " envelope_version, created_at,"
                      " payload, fingerprint,"
                      " published_at)"
                      " VALUES (?, ?, ?, 1, 1, ?, ?,"
                      " ?, NULL)",
                      (
                          uid,
                          EVENT_DECISION,
                          aggregate,
                          self._clock.now(),
                          canonical_json_dumps(
                              payload
                          ),
                          fp,
                      ),
                  )

              def register_policy(
                  self,
                  *,
                  jurisdiction: str,
                  requirement: str,
                  mandatory: bool,
                  version: int = 1,
              ) -> PolicyRecord:
                  require_non_empty_str(
                      jurisdiction, "jurisdiction"
                  )
                  require_non_empty_str(
                      requirement, "requirement"
                  )
                  require_int_range(
                      version, "version", 1, 10**6
                  )
                  policy_id = (
                      f"POL-{new_id()[:12]}"
                  )
                  now = self._clock.now()
                  with (
                      self._db.transaction()
                      as cursor
                  ):
                      cursor.execute(
                          "INSERT INTO"
                          " compliance_policies"
                          " (policy_id, jurisdiction,"
                          "  requirement, mandatory,"
                          "  version, active,"
                          "  created_at)"
                          " VALUES (?, ?, ?, ?, ?, 1,"
                          " ?)",
                          (
                              policy_id,
                              jurisdiction,
                              requirement,
                              int(mandatory),
                              version,
                              now,
                          ),
                      )
                  return PolicyRecord(
                      policy_id=policy_id,
                      jurisdiction=jurisdiction,
                      requirement=requirement,
                      mandatory=mandatory,
                      version=version,
                      active=True,
                  )

              def _active_policy(
                  self,
                  jurisdiction: str,
                  requirement: str,
              ) -> PolicyRecord:
                  row = self._db.query_one(
                      "SELECT * FROM"
                      " compliance_policies"
                      " WHERE jurisdiction = ?"
                      " AND requirement = ?"
                      " AND active = 1"
                      " ORDER BY version DESC"
                      " LIMIT 1",
                      (jurisdiction, requirement),
                  )
                  if row is None:
                      raise PolicyNotFoundError(
                          "no active policy for"
                          f" '{jurisdiction}' /"
                          f" '{requirement}'"
                      )
                  return PolicyRecord(
                      policy_id=str(
                          row["policy_id"]
                      ),
                      jurisdiction=str(
                          row["jurisdiction"]
                      ),
                      requirement=str(
                          row["requirement"]
                      ),
                      mandatory=bool(
                          int(row["mandatory"])
                      ),
                      version=int(row["version"]),
                      active=True,
                  )

              def evaluate(
                  self,
                  *,
                  subject_zid: str,
                  jurisdiction: str,
                  requirement: str,
                  satisfied: bool,
              ) -> ComplianceDecision:
                  require_non_empty_str(
                      subject_zid, "subject_zid"
                  )
                  policy = self._active_policy(
                      jurisdiction, requirement
                  )
                  compliant = (
                      satisfied
                      or not policy.mandatory
                  )
                  if satisfied:
                      reason = (
                          "requirement satisfied"
                      )
                  elif compliant:
                      reason = (
                          "optional requirement"
                      )
                  else:
                      reason = (
                          "mandatory"
                          " requirement unmet"
                      )
                  decision_id = (
                      f"DEC-{new_id()[:12]}"
                  )
                  now = self._clock.now()
                  with (
                      self._db.transaction()
                      as cursor
                  ):
                      cursor.execute(
                          "INSERT INTO"
                          " compliance_decisions"
                          " (decision_id,"
                          " subject_zid, policy_id,"
                          " compliant, reason,"
                          " decided_at)"
                          " VALUES (?, ?, ?, ?, ?, ?)",
                          (
                              decision_id,
                              subject_zid,
                              policy.policy_id,
                              int(compliant),
                              reason,
                              now,
                          ),
                      )
                      self._emit(
                          cursor,
                          aggregate=decision_id,
                          payload={
                              "jurisdiction": (
                                  jurisdiction
                              ),
                              "requirement": (
                                  requirement
                              ),
                              "compliant": (
                                  compliant
                              ),
                          },
                      )
                  self._audit.append(
                      event_type=EVENT_DECISION,
                      actor="compliance-engine",
                      subject=decision_id,
                      payload={
                          "compliant": compliant
                      },
                  )
                  return ComplianceDecision(
                      decision_id=decision_id,
                      subject_zid=subject_zid,
                      jurisdiction=jurisdiction,
                      requirement=requirement,
                      compliant=compliant,
                      policy_id=policy.policy_id,
                      reason=reason,
                  )

              def list_policies(
                  self, *, jurisdiction: str
              ) -> tuple[PolicyRecord, ...]:
                  rows = self._db.query_all(
                      "SELECT * FROM"
                      " compliance_policies"
                      " WHERE jurisdiction = ?"
                      " AND active = 1"
                      " ORDER BY requirement,"
                      " version DESC",
                      (jurisdiction,),
                  )
                  return tuple(
                      PolicyRecord(
                          policy_id=str(
                              r["policy_id"]
                          ),
                          jurisdiction=str(
                              r["jurisdiction"]
                          ),
                          requirement=str(
                              r["requirement"]
                          ),
                          mandatory=bool(
                              int(r["mandatory"])
                          ),
                          version=int(
                              r["version"]
                          ),
                          active=True,
                      )
                      for r in rows
                  )
          PYEOF
          echo "=== COMPLIANCE READY ==="

      - name: Engine integrations
        run: |
          set -euo pipefail
          cat > shared_engines/integrations/engine.py <<'PYEOF'
          """Integrations engine: external adapters with
          retry, health and durable stats. Real providers
          are wired as handler callables at the composition
          root; the engine governs invocation: bounded
          retries on transient failures, durable counters,
          health. No fake providers live here."""
          from __future__ import annotations

          import hashlib
          from collections.abc import Callable
          from dataclasses import dataclass

          from shared_engines.common.clocks import Clock
          from shared_engines.common.errors import (
              ConfigurationError,
              IntegrityError,
              NotFoundError,
              ProviderPermanentError,
              ProviderTransientError,
          )
          from shared_engines.common.validation import (
              require_int_range,
              require_non_empty_str,
          )
          from shared_engines.storage.database import (
              Database,
          )
          from shared_engines.storage.migrations import (
              Migration,
              MigrationRunner,
          )

          _MIGRATIONS = (
              Migration(
                  1,
                  "integrations",
                  (
                      "CREATE TABLE"
                      " integration_adapters ("
                      " adapter_id TEXT PRIMARY"
                      " KEY,"
                      " kind TEXT NOT NULL,"
                      " endpoint TEXT NOT NULL,"
                      " max_retries INTEGER NOT"
                      " NULL,"
                      " calls INTEGER NOT NULL"
                      " DEFAULT 0,"
                      " failures INTEGER NOT NULL"
                      " DEFAULT 0,"
                      " created_at REAL NOT NULL)",
                  ),
              ),
          )


          class UnknownAdapterError(NotFoundError):
              """Adapter not registered."""


          @dataclass(frozen=True)
          class AdapterRecord:
              adapter_id: str
              kind: str
              endpoint: str
              max_retries: int
              calls: int
              failures: int


          @dataclass(frozen=True)
          class InvokeResult:
              adapter_id: str
              attempts: int
              response_sha256: str


          class IntegrationsEngine:
              """Governed invocation of external
              adapters."""

              def __init__(
                  self, db: Database, clock: Clock
              ) -> None:
                  self._db = db
                  self._clock = clock
                  self._handlers: dict[
                      str,
                      Callable[[bytes], bytes],
                  ] = {}
                  MigrationRunner(
                      db,
                      "integrations",
                      _MIGRATIONS,
                  ).run(clock)

              def register_adapter(
                  self,
                  *,
                  adapter_id: str,
                  kind: str,
                  endpoint: str,
                  max_retries: int = 3,
              ) -> AdapterRecord:
                  require_non_empty_str(
                      adapter_id, "adapter_id"
                  )
                  require_non_empty_str(
                      kind, "kind"
                  )
                  require_non_empty_str(
                      endpoint, "endpoint"
                  )
                  require_int_range(
                      max_retries,
                      "max_retries",
                      1,
                      10,
                  )
                  with (
                      self._db.transaction()
                      as cursor
                  ):
                      cursor.execute(
                          "INSERT INTO"
                          " integration_adapters"
                          " (adapter_id, kind,"
                          "  endpoint, max_retries,"
                          "  calls, failures,"
                          "  created_at)"
                          " VALUES (?, ?, ?, ?, 0, 0,"
                          " ?)"
                          " ON CONFLICT(adapter_id)"
                          " DO UPDATE SET kind ="
                          " excluded.kind, endpoint"
                          " = excluded.endpoint,"
                          " max_retries ="
                          " excluded.max_retries",
                          (
                              adapter_id,
                              kind,
                              endpoint,
                              max_retries,
                              self._clock.now(),
                          ),
                      )
                  return self.health(
                      adapter_id=adapter_id
                  )

              def register_handler(
                  self,
                  *,
                  adapter_id: str,
                  handler: Callable[[bytes], bytes],
              ) -> None:
                  require_non_empty_str(
                      adapter_id, "adapter_id"
                  )
                  self._row(adapter_id)
                  self._handlers[adapter_id] = (
                      handler
                  )

              def _row(
                  self, adapter_id: str
              ) -> AdapterRecord:
                  row = self._db.query_one(
                      "SELECT * FROM"
                      " integration_adapters"
                      " WHERE adapter_id = ?",
                      (adapter_id,),
                  )
                  if row is None:
                      raise UnknownAdapterError(
                          "unknown adapter:"
                          f" {adapter_id}"
                      )
                  return AdapterRecord(
                      adapter_id=str(
                          row["adapter_id"]
                      ),
                      kind=str(row["kind"]),
                      endpoint=str(
                          row["endpoint"]
                      ),
                      max_retries=int(
                          row["max_retries"]
                      ),
                      calls=int(row["calls"]),
                      failures=int(
                          row["failures"]
                      ),
                  )

              def invoke(
                  self,
                  *,
                  adapter_id: str,
                  payload: bytes,
              ) -> InvokeResult:
                  require_non_empty_str(
                      adapter_id, "adapter_id"
                  )
                  if not payload:
                      raise IntegrityError(
                          "payload required"
                      )
                  record = self._row(adapter_id)
                  handler = self._handlers.get(
                      adapter_id
                  )
                  if handler is None:
                      raise ConfigurationError(
                          "no handler wired for"
                          f" '{adapter_id}'"
                      )
                  attempts = 0
                  last_exc: Exception | None = (
                      None
                  )
                  while attempts < (
                      record.max_retries
                  ):
                      attempts += 1
                      try:
                          response = handler(
                              payload
                          )
                          self._bump(
                              adapter_id,
                              failure=False,
                          )
                          return InvokeResult(
                              adapter_id=(
                                  adapter_id
                              ),
                              attempts=attempts,
                              response_sha256=hashlib.sha256(
                                  response
                              ).hexdigest(),
                          )
                      except (
                          ProviderTransientError
                      ) as exc:
                          last_exc = exc
                      except (
                          ProviderPermanentError
                      ) as exc:
                          self._bump(
                              adapter_id,
                              failure=True,
                          )
                          raise
                  self._bump(
                      adapter_id, failure=True
                  )
                  raise ProviderPermanentError(
                      "adapter"
                      f" '{adapter_id}' failed"
                      f" after {attempts}"
                      f" attempts: {last_exc}"
                  ) from last_exc

              def _bump(
                  self,
                  adapter_id: str,
                  *,
                  failure: bool,
              ) -> None:
                  delta_fail = 1 if failure else 0
                  with (
                      self._db.transaction()
                      as cursor
                  ):
                      cursor.execute(
                          "UPDATE"
                          " integration_adapters"
                          " SET calls = calls + 1,"
                          " failures = failures"
                          " + ?"
                          " WHERE adapter_id = ?",
                          (delta_fail, adapter_id),
                      )

              def health(
                  self, *, adapter_id: str
              ) -> AdapterRecord:
                  return self._row(adapter_id)
          PYEOF
          echo "=== INTEGRATIONS READY ==="

      - name: Engine export
        run: |
          set -euo pipefail
          cat > shared_engines/export/engine.py <<'PYEOF'
          """Export engine: portable, signed evidence
          bundles. Third parties verify offline with the
          bundle + public key - no database, no trust.
          Domain-separated payload
          "EXPORT:<bundle_id>:<manifest_sha>"."""
          from __future__ import annotations

          import hashlib
          from dataclasses import dataclass

          from shared_engines.audit.chain import AuditTrail
          from shared_engines.common.clocks import Clock
          from shared_engines.common.errors import (
              EngineError,
              NotFoundError,
          )
          from shared_engines.common.identifiers import (
              new_id,
          )
          from shared_engines.common.serialization import (
              canonical_json_dumps,
          )
          from shared_engines.common.validation import (
              require_non_empty_str,
          )
          from shared_engines.storage.database import (
              Database,
          )
          from shared_engines.storage.migrations import (
              Migration,
              MigrationRunner,
          )
          from shared_engines.verification.signatures import (
              Ed25519Signer,
              Ed25519Verifier,
          )

          EVENT_EXPORTED = "export.bundle.created"

          _MIGRATIONS = (
              Migration(
                  1,
                  "export",
                  (
                      "CREATE TABLE"
                      " export_bundles ("
                      " bundle_id TEXT PRIMARY KEY,"
                      " subject_zid TEXT NOT NULL,"
                      " entries_json BLOB NOT NULL,"
                      " manifest_sha256 TEXT NOT"
                      " NULL,"
                      " signature BLOB NOT NULL,"
                      " public_pem BLOB NOT NULL,"
                      " created_at REAL NOT NULL)",
                  ),
              ),
          )


          class EmptyExportError(EngineError):
              """An export needs at least one entry."""


          @dataclass(frozen=True)
          class ExportBundle:
              bundle_id: str
              subject_zid: str
              entries_json: bytes
              manifest_sha256: str
              signature: bytes
              public_pem: bytes
              created_at: float


          def _manifest_sha(
              entries_json: bytes,
          ) -> str:
              return hashlib.sha256(
                  entries_json
              ).hexdigest()


          def _payload(
              bundle_id: str,
              manifest_sha: str,
          ) -> bytes:
              return (
                  f"EXPORT:{bundle_id}:"
                  f"{manifest_sha}"
              ).encode("utf-8")


          class ExportEngine:
              """Signed portable bundles."""

              def __init__(
                  self,
                  db: Database,
                  clock: Clock,
                  *,
                  signer: Ed25519Signer,
                  audit: AuditTrail,
              ) -> None:
                  self._db = db
                  self._clock = clock
                  self._signer = signer
                  self._audit = audit
                  self._public_pem = (
                      signer.public_pem
                  )
                  MigrationRunner(
                      db, "export", _MIGRATIONS
                  ).run(clock)

              def export_bundle(
                  self,
                  *,
                  subject_zid: str,
                  entries: tuple[
                      tuple[str, str, str], ...
                  ],
                  actor_app: str,
              ) -> ExportBundle:
                  require_non_empty_str(
                      subject_zid, "subject_zid"
                  )
                  require_non_empty_str(
                      actor_app, "actor_app"
                  )
                  row = self._db.query_one(
                      "SELECT 1 FROM app_registry"
                      " WHERE app_id = ?",
                      (actor_app,),
                  )
                  if row is None:
                      raise PermissionError(
                          "app not registered:"
                          f" {actor_app}"
                      )
                  if not entries:
                      raise EmptyExportError(
                          "at least one entry"
                          " required"
                      )
                  entry_docs = [
                      {
                          "kind": str(kind),
                          "ref_id": str(ref),
                          "content": str(
                              content
                          ),
                      }
                      for kind, ref, content in (
                          entries
                      )
                  ]
                  entries_json = canonical_json_dumps(
                      entry_docs
                  ).encode("utf-8")
                  manifest = _manifest_sha(
                      entries_json
                  )
                  bundle_id = (
                      f"EXP-{new_id()[:12]}"
                  )
                  signature = self._signer.sign(
                      _payload(bundle_id, manifest)
                  )
                  now = self._clock.now()
                  with (
                      self._db.transaction()
                      as cursor
                  ):
                      cursor.execute(
                          "INSERT INTO"
                          " export_bundles"
                          " (bundle_id, subject_zid,"
                          "  entries_json,"
                          "  manifest_sha256,"
                          "  signature, public_pem,"
                          "  created_at)"
                          " VALUES (?, ?, ?, ?, ?, ?,"
                          "  ?)",
                          (
                              bundle_id,
                              subject_zid,
                              entries_json,
                              manifest,
                              signature,
                              self._public_pem,
                              now,
                          ),
                      )
                  self._audit.append(
                      event_type=EVENT_EXPORTED,
                      actor=actor_app,
                      subject=bundle_id,
                      payload={
                          "subject": subject_zid,
                          "entries": len(
                              entry_docs
                          ),
                      },
                  )
                  return ExportBundle(
                      bundle_id=bundle_id,
                      subject_zid=subject_zid,
                      entries_json=entries_json,
                      manifest_sha256=manifest,
                      signature=signature,
                      public_pem=(
                          self._public_pem
                      ),
                      created_at=now,
                  )

              def get_bundle(
                  self, *, bundle_id: str
              ) -> ExportBundle:
                  row = self._db.query_one(
                      "SELECT * FROM"
                      " export_bundles"
                      " WHERE bundle_id = ?",
                      (bundle_id,),
                  )
                  if row is None:
                      raise NotFoundError(
                          "unknown bundle:"
                          f" {bundle_id}"
                      )
                  return ExportBundle(
                      bundle_id=str(
                          row["bundle_id"]
                      ),
                      subject_zid=str(
                          row["subject_zid"]
                      ),
                      entries_json=bytes(
                          row["entries_json"]
                      ),
                      manifest_sha256=str(
                          row["manifest_sha256"]
                      ),
                      signature=bytes(
                          row["signature"]
                      ),
                      public_pem=bytes(
                          row["public_pem"]
                      ),
                      created_at=float(
                          row["created_at"]
                      ),
                  )

              def verify_stored(
                  self, *, bundle_id: str
              ) -> bool:
                  bundle = self.get_bundle(
                      bundle_id=bundle_id
                  )
                  recomputed = _manifest_sha(
                      bundle.entries_json
                  )
                  if (
                      recomputed
                      != bundle.manifest_sha256
                  ):
                      return False
                  verifier = Ed25519Verifier(
                      bundle.public_pem
                  )
                  return verifier.verify(
                      _payload(
                          bundle_id,
                          bundle.manifest_sha256,
                      ),
                      bundle.signature,
                  )

              @staticmethod
              def verify_offline(
                  *,
                  bundle_id: str,
                  entries_json: bytes,
                  signature: bytes,
                  public_pem: bytes,
              ) -> bool:
                  manifest = _manifest_sha(
                      entries_json
                  )
                  verifier = Ed25519Verifier(
                      public_pem
                  )
                  return verifier.verify(
                      _payload(
                          bundle_id, manifest
                      ),
                      signature,
                  )
          PYEOF
          echo "=== EXPORT READY ==="

      - name: Engine interoperability
        run: |
          set -euo pipefail
          cat > shared_engines/interoperability/engine.py <<'PYEOF'
          """Interoperability engine: versioned schemas and
          mutual-version negotiation. Unknown schemas and
          no-mutual-version refuse with typed errors."""
          from __future__ import annotations

          from dataclasses import dataclass

          from shared_engines.common.clocks import Clock
          from shared_engines.common.errors import (
              NotFoundError,
              UnsupportedVersionError,
          )
          from shared_engines.common.validation import (
              require_int_range,
              require_non_empty_str,
          )
          from shared_engines.storage.database import (
              Database,
          )
          from shared_engines.storage.migrations import (
              Migration,
              MigrationRunner,
          )

          _MIGRATIONS = (
              Migration(
                  1,
                  "interoperability",
                  (
                      "CREATE TABLE interop_schemas ("
                      " schema_id TEXT NOT NULL,"
                      " version INTEGER NOT NULL,"
                      " definition TEXT NOT NULL,"
                      " registered_at REAL NOT"
                      " NULL,"
                      " PRIMARY KEY (schema_id,"
                      " version))",
                  ),
              ),
          )


          class SchemaNotFoundError(NotFoundError):
              """Schema not registered."""


          @dataclass(frozen=True)
          class SchemaVersion:
              schema_id: str
              version: int
              definition: str
              registered_at: float


          @dataclass(frozen=True)
          class NegotiationResult:
              schema_id: str
              agreed_version: int


          class InteroperabilityEngine:
              """Versioned schemas with negotiation."""

              def __init__(
                  self, db: Database, clock: Clock
              ) -> None:
                  self._db = db
                  self._clock = clock
                  MigrationRunner(
                      db,
                      "interoperability",
                      _MIGRATIONS,
                  ).run(clock)

              def register_schema(
                  self,
                  *,
                  schema_id: str,
                  version: int,
                  definition: str,
              ) -> SchemaVersion:
                  require_non_empty_str(
                      schema_id, "schema_id"
                  )
                  require_int_range(
                      version, "version", 1, 10**6
                  )
                  require_non_empty_str(
                      definition, "definition"
                  )
                  now = self._clock.now()
                  with (
                      self._db.transaction()
                      as cursor
                  ):
                      cursor.execute(
                          "INSERT INTO interop_schemas"
                          " (schema_id, version,"
                          "  definition,"
                          "  registered_at)"
                          " VALUES (?, ?, ?, ?)"
                          " ON CONFLICT(schema_id,"
                          " version) DO UPDATE SET"
                          " definition ="
                          " excluded.definition",
                          (
                              schema_id,
                              version,
                              definition,
                              now,
                          ),
                      )
                  return SchemaVersion(
                      schema_id=schema_id,
                      version=version,
                      definition=definition,
                      registered_at=now,
                  )

              def get_schema(
                  self,
                  *,
                  schema_id: str,
                  version: int,
              ) -> SchemaVersion:
                  require_non_empty_str(
                      schema_id, "schema_id"
                  )
                  row = self._db.query_one(
                      "SELECT * FROM interop_schemas"
                      " WHERE schema_id = ?"
                      " AND version = ?",
                      (schema_id, version),
                  )
                  if row is None:
                      raise SchemaNotFoundError(
                          "unknown schema version:"
                          f" {schema_id} v{version}"
                      )
                  return SchemaVersion(
                      schema_id=str(
                          row["schema_id"]
                      ),
                      version=int(row["version"]),
                      definition=str(
                          row["definition"]
                      ),
                      registered_at=float(
                          row["registered_at"]
                      ),
                  )

              def list_versions(
                  self, *, schema_id: str
              ) -> tuple[int, ...]:
                  require_non_empty_str(
                      schema_id, "schema_id"
                  )
                  rows = self._db.query_all(
                      "SELECT version FROM"
                      " interop_schemas"
                      " WHERE schema_id = ?"
                      " ORDER BY version",
                      (schema_id,),
                  )
                  return tuple(
                      int(r["version"])
                      for r in rows
                  )

              def negotiate(
                  self,
                  *,
                  schema_id: str,
                  client_versions: tuple[int, ...],
              ) -> NegotiationResult:
                  require_non_empty_str(
                      schema_id, "schema_id"
                  )
                  if not client_versions:
                      raise UnsupportedVersionError(
                          "client offered no"
                          " versions"
                      )
                  ours = set(
                      self.list_versions(
                          schema_id=schema_id
                      )
                  )
                  if not ours:
                      raise SchemaNotFoundError(
                          "unknown schema:"
                          f" {schema_id}"
                      )
                  common = ours & set(
                      client_versions
                  )
                  if not common:
                      ours_sorted = sorted(ours)
                      client_sorted = sorted(
                          set(client_versions)
                      )
                      raise (
                          UnsupportedVersionError(
                              "no mutual version:"
                              f" ours"
                              f" {ours_sorted} vs"
                              " client"
                              f" {client_sorted}"
                          )
                      )
                  return NegotiationResult(
                      schema_id=schema_id,
                      agreed_version=max(common),
                  )
          PYEOF
          echo "=== INTEROPERABILITY READY ==="

      - name: Engine ai
        run: |
          set -euo pipefail
          cat > shared_engines/ai/engine.py <<'PYEOF'
          """AI engine: model registry + analysis
          provenance. Honest by design: real models are
          registered at the composition root; the engine
          durably records WHAT model (id, version)
          analyzed WHAT content (sha256) with WHAT result
          (verdict + confidence). No fake detection."""
          from __future__ import annotations

          import hashlib
          import sqlite3
          from dataclasses import dataclass

          from shared_engines.audit.chain import AuditTrail
          from shared_engines.common.clocks import Clock
          from shared_engines.common.errors import (
              NotFoundError,
          )
          from shared_engines.common.identifiers import (
              new_id,
          )
          from shared_engines.common.serialization import (
              canonical_json_dumps,
          )
          from shared_engines.common.validation import (
              require_non_empty_str,
          )
          from shared_engines.events.outbox import Outbox
          from shared_engines.storage.database import (
              Database,
          )
          from shared_engines.storage.migrations import (
              Migration,
              MigrationRunner,
          )

          EVENT_ANALYSIS = "ai.analysis.recorded"

          _MIGRATIONS = (
              Migration(
                  1,
                  "ai",
                  (
                      "CREATE TABLE ai_models ("
                      " model_id TEXT PRIMARY KEY,"
                      " provider TEXT NOT NULL,"
                      " model_version TEXT NOT"
                      " NULL,"
                      " capabilities TEXT NOT"
                      " NULL,"
                      " active INTEGER NOT NULL,"
                      " registered_at REAL NOT"
                      " NULL)",
                      "CREATE TABLE ai_analyses ("
                      " analysis_id TEXT PRIMARY"
                      " KEY,"
                      " model_id TEXT NOT NULL,"
                      " model_version TEXT NOT"
                      " NULL,"
                      " content_sha256 TEXT NOT"
                      " NULL,"
                      " verdict TEXT NOT NULL,"
                      " confidence REAL NOT NULL,"
                      " analyzed_at REAL NOT"
                      " NULL)",
                      "CREATE INDEX ai_content"
                      " ON ai_analyses"
                      " (content_sha256)",
                  ),
              ),
          )


          class UnknownModelError(NotFoundError):
              """Model not registered or inactive."""


          @dataclass(frozen=True)
          class ModelRecord:
              model_id: str
              provider: str
              model_version: str
              capabilities: tuple[str, ...]
              active: bool


          @dataclass(frozen=True)
          class AnalysisRecord:
              analysis_id: str
              model_id: str
              model_version: str
              content_sha256: str
              verdict: str
              confidence: float
              analyzed_at: float


          class AIEngine:
              """Traceable AI analysis provenance."""

              def __init__(
                  self,
                  db: Database,
                  clock: Clock,
                  *,
                  audit: AuditTrail,
                  outbox: Outbox,
              ) -> None:
                  self._db = db
                  self._clock = clock
                  self._audit = audit
                  self._outbox = outbox
                  MigrationRunner(
                      db, "ai", _MIGRATIONS
                  ).run(clock)

              def _emit(
                  self,
                  cursor: sqlite3.Cursor,
                  *,
                  aggregate: str,
                  payload: dict[str, object],
              ) -> None:
                  uid = hashlib.sha256(
                      canonical_json_dumps(
                          {
                              "a": aggregate,
                              "u": new_id(),
                          }
                      ).encode("utf-8")
                  ).hexdigest()[:32]
                  fp = hashlib.sha256(
                      canonical_json_dumps(
                          {
                              "id": uid,
                              "ty": EVENT_ANALYSIS,
                          }
                      ).encode("utf-8")
                  ).hexdigest()
                  cursor.execute(
                      "INSERT INTO events_outbox"
                      " (event_id, event_type,"
                      " aggregate_id, schema_version,"
                      " envelope_version, created_at,"
                      " payload, fingerprint,"
                      " published_at)"
                      " VALUES (?, ?, ?, 1, 1, ?, ?,"
                      " ?, NULL)",
                      (
                          uid,
                          EVENT_ANALYSIS,
                          aggregate,
                          self._clock.now(),
                          canonical_json_dumps(
                              payload
                          ),
                          fp,
                      ),
                  )

              def register_model(
                  self,
                  *,
                  model_id: str,
                  provider: str,
                  model_version: str,
                  capabilities: tuple[str, ...],
              ) -> ModelRecord:
                  require_non_empty_str(
                      model_id, "model_id"
                  )
                  require_non_empty_str(
                      provider, "provider"
                  )
                  require_non_empty_str(
                      model_version,
                      "model_version",
                  )
                  clean: list[str] = []
                  for cap in capabilities:
                      require_non_empty_str(
                          cap, "capability"
                      )
                      if cap not in clean:
                          clean.append(cap)
                  with (
                      self._db.transaction()
                      as cursor
                  ):
                      cursor.execute(
                          "INSERT INTO ai_models"
                          " (model_id, provider,"
                          "  model_version,"
                          "  capabilities,"
                          "  active, registered_at)"
                          " VALUES (?, ?, ?, ?, 1, ?)"
                          " ON CONFLICT(model_id)"
                          " DO UPDATE SET provider"
                          " = excluded.provider,"
                          " model_version ="
                          " excluded"
                          ".model_version,"
                          " capabilities ="
                          " excluded.capabilities,"
                          " active = 1",
                          (
                              model_id,
                              provider,
                              model_version,
                              ",".join(clean),
                              self._clock.now(),
                          ),
                      )
                  return ModelRecord(
                      model_id=model_id,
                      provider=provider,
                      model_version=(
                          model_version
                      ),
                      capabilities=tuple(clean),
                      active=True,
                  )

              def _model_version(
                  self, model_id: str
              ) -> str:
                  row = self._db.query_one(
                      "SELECT model_version,"
                      " active FROM ai_models"
                      " WHERE model_id = ?",
                      (model_id,),
                  )
                  if row is None:
                      raise UnknownModelError(
                          "unknown model:"
                          f" {model_id}"
                      )
                  if int(row["active"]) != 1:
                      raise UnknownModelError(
                          "model deactivated:"
                          f" {model_id}"
                      )
                  return str(
                      row["model_version"]
                  )

              def record_analysis(
                  self,
                  *,
                  model_id: str,
                  content_sha256: str,
                  verdict: str,
                  confidence: float,
              ) -> AnalysisRecord:
                  model_version = (
                      self._model_version(model_id)
                  )
                  require_non_empty_str(
                      content_sha256,
                      "content_sha256",
                  )
                  require_non_empty_str(
                      verdict, "verdict"
                  )
                  if not (
                      0.0 <= confidence <= 1.0
                  ):
                      raise ValueError(
                          "confidence must be"
                          " within [0, 1]"
                      )
                  analysis_id = (
                      f"AI-{new_id()[:12]}"
                  )
                  now = self._clock.now()
                  with (
                      self._db.transaction()
                      as cursor
                  ):
                      cursor.execute(
                          "INSERT INTO ai_analyses"
                          " (analysis_id, model_id,"
                          "  model_version,"
                          "  content_sha256, verdict,"
                          "  confidence, analyzed_at)"
                          " VALUES (?, ?, ?, ?, ?, ?,"
                          "  ?)",
                          (
                              analysis_id,
                              model_id,
                              model_version,
                              content_sha256,
                              verdict,
                              confidence,
                              now,
                          ),
                      )
                      self._emit(
                          cursor,
                          aggregate=analysis_id,
                          payload={
                              "model": model_id,
                              "verdict": verdict,
                          },
                      )
                  self._audit.append(
                      event_type=EVENT_ANALYSIS,
                      actor=model_id,
                      subject=analysis_id,
                      payload={
                          "verdict": verdict
                      },
                  )
                  return AnalysisRecord(
                      analysis_id=analysis_id,
                      model_id=model_id,
                      model_version=(
                          model_version
                      ),
                      content_sha256=(
                          content_sha256
                      ),
                      verdict=verdict,
                      confidence=confidence,
                      analyzed_at=now,
                  )

              def analysis_history(
                  self, *, content_sha256: str
              ) -> tuple[AnalysisRecord, ...]:
                  require_non_empty_str(
                      content_sha256,
                      "content_sha256",
                  )
                  rows = self._db.query_all(
                      "SELECT * FROM ai_analyses"
                      " WHERE content_sha256 = ?"
                      " ORDER BY analyzed_at",
                      (content_sha256,),
                  )
                  return tuple(
                      AnalysisRecord(
                          analysis_id=str(
                              r["analysis_id"]
                          ),
                          model_id=str(
                              r["model_id"]
                          ),
                          model_version=str(
                              r["model_version"]
                          ),
                          content_sha256=str(
                              r["content_sha256"]
                          ),
                          verdict=str(
                              r["verdict"]
                          ),
                          confidence=float(
                              r["confidence"]
                          ),
                          analyzed_at=float(
                              r["analyzed_at"]
                          ),
                      )
                      for r in rows
                  )
          PYEOF
          echo "=== AI READY ==="

