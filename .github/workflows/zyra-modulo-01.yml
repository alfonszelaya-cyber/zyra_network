      - name: Write ciclo e2e tests v6 (real network ZIDs for seal, deterministic offline flows)
        run: |
          set -euo pipefail
          cat > apps/ciclo_digital/tests/test_ciclo_archaeology_e2e.py <<'PYEOF'
          """CICLO e2e ADD-ONLY v6 - network test registers a
          REAL ZID (identity+trust, the proven MPE/SEMILLA
          pattern) before sealing; offline HTTP flows are
          deterministic; original tests untouched."""
          from __future__ import annotations

          import json
          import socket
          import threading
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          socket.setdefaulttimeout(20)

          from shared_engines.common.clocks import FrozenClock
          from shared_engines.runtime.capabilities import ZyraCapabilities
          from shared_engines.runtime.combined_api import serve_combined
          from shared_engines.runtime.config import RuntimeConfig
          from shared_engines.runtime.kernel import ZyraKernel
          from shared_engines.storage.database import SQLiteAdapter
          from shared_engines.verification.signatures import Ed25519Signer

          from apps.ciclo_digital.infrastructure.network.network_client import NetworkClient
          from apps.ciclo_digital.infrastructure.persistence.ciclo_store import CicloStore
          from apps.ciclo_digital.server import serve_ciclo
          from apps.ciclo_digital.services.ciclo_link_ext import CicloLinkExt


          class _Offline:
              def __init__(self, tmp_path: Path) -> None:
                  self.db = SQLiteAdapter(tmp_path / "ciclo.db")
                  self.store = CicloStore(self.db, FrozenClock())
                  dead_client = NetworkClient(
                      "http://127.0.0.1:1",
                      timeout_seconds=1.0,
                      max_retries=0,
                  )
                  self.server = serve_ciclo(self.store, dead_client)
                  self.thread = threading.Thread(
                      target=self.server.serve_forever, daemon=True
                  )
                  self.thread.start()
                  self.base = (
                      "http://127.0.0.1:"
                      f"{self.server.bound_port}"
                  )

              def close(self) -> None:
                  self.server.shutdown()
                  self.server.server_close()
                  self.thread.join(timeout=5)
                  self.db.close()


          class _Networked:
              def __init__(self, tmp_path: Path) -> None:
                  self.net_db = SQLiteAdapter(tmp_path / "network.db")
                  signer, _ = Ed25519Signer.generate()
                  self.kernel = ZyraKernel(
                      db=self.net_db,
                      clock=FrozenClock(),
                      signer=signer,
                      config=RuntimeConfig(
                          host="127.0.0.1", port=0, api_token=None
                      ),
                  )
                  self.kernel.bootstrap_root()
                  self.caps = ZyraCapabilities(
                      self.net_db,
                      FrozenClock(),
                      identity=self.kernel.identity,
                      signer=signer,
                  )
                  self.net_server = serve_combined(
                      self.kernel, self.caps, host="127.0.0.1", port=0
                  )
                  threading.Thread(
                      target=self.net_server.serve_forever, daemon=True
                  ).start()
                  self.net_base = (
                      "http://127.0.0.1:"
                      f"{self.net_server.server_address[1]}"
                  )
                  self.client = NetworkClient(
                      self.net_base, max_retries=1
                  )
                  self.ext = CicloLinkExt(self.client)

              def close(self) -> None:
                  self.net_server.shutdown()
                  self.net_server.server_close()
                  self.net_db.close()


          def _pf(url: str, doc: dict) -> str:
              request = Request(
                  url,
                  data=(
                      "&".join(
                          str(k) + "=" + str(v)
                          for k, v in doc.items()
                      )
                  ).encode("utf-8"),
                  method="POST",
              )
              try:
                  with urlopen(request, timeout=15) as r:
                      return r.read().decode("utf-8")
              except HTTPError as exc:
                  body = exc.read().decode("utf-8", "replace")
                  raise AssertionError(
                      "POST " + url + " -> HTTP " + str(exc.code)
                      + " body: " + body[:600]
                  )


          def _pj(url: str, doc: dict) -> dict:
              request = Request(
                  url,
                  data=json.dumps(doc).encode("utf-8"),
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              try:
                  with urlopen(request, timeout=15) as r:
                      body = json.loads(r.read().decode("utf-8"))
              except HTTPError as exc:
                  body = exc.read().decode("utf-8", "replace")
                  raise AssertionError(
                      "POST " + url + " -> HTTP " + str(exc.code)
                      + " body: " + body[:600]
                  )
              assert isinstance(body, dict)
              return body


          def _h(url: str) -> str:
              try:
                  with urlopen(url, timeout=15) as r:
                      return r.read().decode("utf-8")
              except HTTPError as exc:
                  body = exc.read().decode("utf-8", "replace")
                  raise AssertionError(
                      "GET " + url + " -> HTTP " + str(exc.code)
                      + " body: " + body[:600]
                  )


          def test_1_global_recycling_http_offline(
              tmp_path: Path,
          ) -> None:
              app = _Offline(tmp_path)
              try:
                  event = _pj(
                      app.base
                      + "/ciclo/api/recycling/global",
                      {
                          "source_app": "nexo",
                          "owner_zid": "ZID-a",
                          "description": (
                              "factura vieja borrada"
                          ),
                          "category": "documento",
                          "condition": "bueno",
                      },
                  )["data"]
                  assert event["source_app"] == "nexo"
                  assert event["reward_tokens"] == 2
                  assert event["network_tokens"] is False
                  event2 = _pj(
                      app.base
                      + "/ciclo/api/recycling/global",
                      {
                          "source_app": "semilla",
                          "owner_zid": "ZID-b",
                          "description": (
                              "video de clase antiguo"
                          ),
                          "category": "video",
                          "condition": "regular",
                      },
                  )["data"]
                  assert event2["reward_tokens"] == 2
                  event3 = _pj(
                      app.base
                      + "/ciclo/api/recycling/global",
                      {
                          "source_app": "agro",
                          "owner_zid": "ZID-c",
                          "description": (
                              "foto de cosecha vieja"
                          ),
                          "category": "foto",
                          "condition": "bueno",
                      },
                  )["data"]
                  assert event3["reward_tokens"] == 1
                  rejected = False
                  try:
                      _pj(
                          app.base
                          + "/ciclo/api/recycling/global",
                          {
                              "source_app": "twitter",
                              "owner_zid": "ZID-x",
                              "description": "x",
                              "category": "foto",
                              "condition": "bueno",
                          },
                      )
                  except AssertionError as exc:
                      rejected = "400" in str(exc)
                  assert rejected is True
                  stats = _h(app.base + "/ciclo/global")
                  assert "nexo" in stats
                  assert "semilla" in stats
                  assert "agro" in stats
              finally:
                  app.close()


          def test_2_archaeology_http_offline(
              tmp_path: Path,
          ) -> None:
              app = _Offline(tmp_path)
              try:
                  case = _pj(
