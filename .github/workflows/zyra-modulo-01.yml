name: zyra-modulo-05-identity

"on":
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

concurrency:
  group: zyra-modulo-05-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "cryptography>=42,<45" "flake8>=7,<8" "mypy>=1.10,<2" "pytest>=8,<9"

      - name: Check modules 01-04 present
        run: |
          set -euo pipefail
          test -f shared_engines/common/errors.py
          test -f shared_engines/storage/database.py
          test -f shared_engines/events/outbox.py
          test -f shared_engines/audit/chain.py
          echo "modules 01-04 present: OK"

      - name: Build shared_engines/identity
        run: |
          set -euo pipefail
          mkdir -p shared_engines/identity/tests

          cat > shared_engines/identity/__init__.py <<'PYEOF'
          """Zyra identity engine: unique ids, permanent registry, history."""
          from __future__ import annotations

          from shared_engines.identity.contracts import (
              IDENTITY_CONTRACT_VERSION,
              Identity,
              IdentityKind,
              IdentityStatus,
              VALID_TRANSITIONS,
          )
          from shared_engines.identity.engine import IdentityEngine
          from shared_engines.identity.errors import (
              IdentityAlreadyExistsError,
              IdentityError,
              IdentityNotFoundError,
              InvalidTransitionError,
          )
          from shared_engines.identity.registry import IdentityRegistry

          __all__ = [
              "IDENTITY_CONTRACT_VERSION", "Identity", "IdentityEngine",
              "IdentityAlreadyExistsError", "IdentityError",
              "IdentityKind", "IdentityNotFoundError", "IdentityRegistry",
              "IdentityStatus", "InvalidTransitionError", "VALID_TRANSITIONS",
          ]
          PYEOF

          cat > shared_engines/identity/contracts.py <<'PYEOF'
          """Versioned identity contracts (contract v1).

          A ZID is opaque, unique and immutable. Lifecycle: REGISTERED
          -> PENDING_VERIFICATION -> VERIFIED -> ACTIVE; ACTIVE ->
          SUSPENDED -> ACTIVE; terminal REVOKED from any non-revoked
          state. Every transition is validated before it is applied.
          """
          from __future__ import annotations

          from dataclasses import dataclass
          from enum import Enum

          from shared_engines.common.errors import ValidationError
          from shared_engines.common.validation import (
              require_int_range,
              require_non_empty_str,
          )

          IDENTITY_CONTRACT_VERSION = 1


          class IdentityKind(Enum):
              PERSON = "person"
              ORGANIZATION = "organization"
              DEVICE = "device"
              INSTITUTION = "institution"


          class IdentityStatus(Enum):
              REGISTERED = "REGISTERED"
              PENDING_VERIFICATION = "PENDING_VERIFICATION"
              VERIFIED = "VERIFIED"
              ACTIVE = "ACTIVE"
              SUSPENDED = "SUSPENDED"
              REVOKED = "REVOKED"


          VALID_TRANSITIONS: dict[IdentityStatus, frozenset[IdentityStatus]] = {
              IdentityStatus.REGISTERED: frozenset(
                  {
                      IdentityStatus.PENDING_VERIFICATION,
                      IdentityStatus.ACTIVE,
                      IdentityStatus.REVOKED,
                  }
              ),
              IdentityStatus.PENDING_VERIFICATION: frozenset(
                  {IdentityStatus.VERIFIED, IdentityStatus.REVOKED}
              ),
              IdentityStatus.VERIFIED: frozenset(
                  {IdentityStatus.ACTIVE, IdentityStatus.REVOKED}
              ),
              IdentityStatus.ACTIVE: frozenset(
                  {IdentityStatus.SUSPENDED, IdentityStatus.REVOKED}
              ),
              IdentityStatus.SUSPENDED: frozenset(
                  {IdentityStatus.ACTIVE, IdentityStatus.REVOKED}
              ),
              IdentityStatus.REVOKED: frozenset(),
          }


          @dataclass(frozen=True)
          class Identity:
              zid: str
              kind: IdentityKind
              status: IdentityStatus
              display_name: str
              created_at: float
              updated_at: float
              contract_version: int = IDENTITY_CONTRACT_VERSION

              def __post_init__(self) -> None:
                  require_non_empty_str(self.zid, "zid")
                  require_non_empty_str(self.display_name, "display_name")
                  require_int_range(
                      self.contract_version, "contract_version", 1, 100
                  )
                  if not isinstance(self.kind, IdentityKind):
                      raise ValidationError("kind must be IdentityKind")
                  if not isinstance(self.status, IdentityStatus):
                      raise ValidationError("status must be IdentityStatus")
          PYEOF

          cat > shared_engines/identity/errors.py <<'PYEOF'
          """Typed identity errors."""
          from __future__ import annotations

          from shared_engines.common.errors import (
              ConcurrencyError,
              EngineError,
              NotFoundError,
              ValidationError,
          )


          class IdentityError(EngineError):
              """Base for identity engine failures."""


          class IdentityAlreadyExistsError(IdentityError, ConcurrencyError):
              """A ZID collision was detected during registration."""


          class InvalidTransitionError(IdentityError, ValidationError):
              """The lifecycle transition is not allowed."""


          class IdentityNotFoundError(IdentityError, NotFoundError):
              """No identity exists for the given ZID."""
          PYEOF

          cat > shared_engines/identity/registry.py <<'PYEOF'
          """Durable identity registry: CRUD + lifecycle transitions.

          Every transition runs inside one transaction, is validated
          against the allowed transitions table, writes the outbox
          event atomically with the state change, and leaves an audit
          record through the tamper-evident chain.
          """
          from __future__ import annotations

          import sqlite3
          from dataclasses import dataclass

          from shared_engines.audit.chain import AuditTrail
          from shared_engines.common.clocks import Clock
          from shared_engines.common.errors import IntegrityError
          from shared_engines.common.identifiers import new_id
          from shared_engines.common.validation import require_non_empty_str
          from shared_engines.events.contracts import EventCatalog
          from shared_engines.events.outbox import Outbox
          from shared_engines.identity.contracts import (
              Identity,
              IdentityKind,
              IdentityStatus,
              VALID_TRANSITIONS,
          )
          from shared_engines.identity.errors import (
              IdentityAlreadyExistsError,
              IdentityNotFoundError,
              InvalidTransitionError,
          )
          from shared_engines.storage.database import Database
          from shared_engines.storage.migrations import Migration, MigrationRunner

          EVENT_IDENTITY_REGISTERED = "identity.registered"
          EVENT_IDENTITY_STATUS_CHANGED = "identity.status_changed"

          IDENTITY_MIGRATIONS = (
              Migration(
                  1,
                  "identities",
                  (
                      "CREATE TABLE identities ("
                      " zid TEXT PRIMARY KEY,"
                      " kind TEXT NOT NULL,"
                      " status TEXT NOT NULL,"
                      " display_name TEXT NOT NULL,"
                      " created_at REAL NOT NULL,"
                      " updated_at REAL NOT NULL,"
                      " contract_version INTEGER NOT NULL)",
                      "CREATE INDEX identities_status ON identities (status)",
                      "CREATE INDEX identities_kind ON identities (kind)",
                  ),
              ),
          )


          @dataclass(frozen=True)
          class RegistryPage:
              items: tuple[Identity, ...]
              offset: int
              limit: int
              total: int

              @property
              def has_more(self) -> bool:
                  return self.offset + len(self.items) < self.total


          class IdentityRegistry:
              """Durable store and lifecycle authority for identities."""

              def __init__(
                  self,
                  db: Database,
                  clock: Clock,
                  audit: AuditTrail,
                  outbox: Outbox,
                  catalog: EventCatalog,
              ) -> None:
                  self._db = db
                  self._clock = clock
                  self._audit = audit
                  self._outbox = outbox
                  self._catalog = catalog
                  MigrationRunner(db, "identity", IDENTITY_MIGRATIONS).run(clock)

              def create(
                  self,
                  *,
                  kind: IdentityKind,
                  display_name: str,
                  actor: str,
              ) -> Identity:
                  require_non_empty_str(display_name, "display_name")
                  require_non_empty_str(actor, "actor")
                  zid = f"ZID-{new_id()}"
                  now = self._clock.now()
                  try:
                      with self._db.transaction() as cursor:
                          cursor.execute(
                              "INSERT INTO identities"
                              " (zid, kind, status, display_name,"
                              "  created_at, updated_at, contract_version)"
                              " VALUES (?, ?, ?, ?, ?, ?, ?)",
                              (
                                  zid,
                                  kind.value,
                                  IdentityStatus.REGISTERED.value,
                                  display_name,
                                  now,
                                  now,
                                  1,
                              ),
                          )
                          self._emit_transition(
                              cursor,
                              zid=zid,
                              from_status=None,
                              to_status=IdentityStatus.REGISTERED,
                              actor=actor,
                              reason="registration",
                          )
                  except sqlite3.IntegrityError as exc:
                      raise IdentityAlreadyExistsError(
                          f"zid collision: {zid}"
                      ) from exc
                  self._audit.append(
                      event_type=EVENT_IDENTITY_REGISTERED,
                      actor=actor,
                      subject=zid,
                      payload={
                          "kind": kind.value,
                          "display_name": display_name,
                      },
                  )
                  created = self.get(zid)
                  if created is None:
                      raise IntegrityError("identity vanished after insert")
                  return created

              def get(self, zid: str) -> Identity | None:
                  row = self._db.query_one(
                      "SELECT * FROM identities WHERE zid = ?", (zid,)
                  )
                  if row is None:
                      return None
                  return self._identity_from_row(row)

              def require(self, zid: str) -> Identity:
                  identity = self.get(zid)
                  if identity is None:
                      raise IdentityNotFoundError(f"unknown zid: {zid}")
                  return identity

              def transition(
                  self,
                  zid: str,
                  to_status: IdentityStatus,
                  *,
                  actor: str,
                  reason: str,
              ) -> Identity:
                  require_non_empty_str(actor, "actor")
                  require_non_empty_str(reason, "reason")
                  with self._db.transaction() as cursor:
                      row = cursor.execute(
                          "SELECT * FROM identities WHERE zid = ?", (zid,)
                      ).fetchone()
                      if row is None:
                          raise IdentityNotFoundError(f"unknown zid: {zid}")
                      current = IdentityStatus(str(row["status"]))
                      allowed = VALID_TRANSITIONS.get(current, frozenset())
                      if to_status not in allowed:
                          raise InvalidTransitionError(
                              f"{current.value} -> {to_status.value}"
                              " is not a valid transition"
                          )
                      now = self._clock.now()
                      cursor.execute(
                          "UPDATE identities SET status = ?, updated_at = ?"
                          " WHERE zid = ?",
                          (to_status.value, now, zid),
                      )
                      self._emit_transition(
                          cursor,
                          zid=zid,
                          from_status=current,
                          to_status=to_status,
                          actor=actor,
                          reason=reason,
                      )
                  self._audit.append(
                      event_type=EVENT_IDENTITY_STATUS_CHANGED,
                      actor=actor,
                      subject=zid,
                      payload={
                          "from": current.value,
                          "to": to_status.value,
                          "reason": reason,
                      },
                  )
                  return self.require(zid)

              def list_by_status(
                  self,
                  status: IdentityStatus,
                  *,
                  offset: int = 0,
                  limit: int = 50,
              ) -> RegistryPage:
                  total_row = self._db.query_one(
                      "SELECT COUNT(*) AS n FROM identities WHERE status = ?",
                      (status.value,),
                  )
                  total = int(total_row["n"]) if total_row is not None else 0
                  rows = self._db.query_all(
                      "SELECT * FROM identities WHERE status = ?"
                      " ORDER BY created_at, zid LIMIT ? OFFSET ?",
                      (status.value, limit, offset),
                  )
                  items = tuple(self._identity_from_row(row) for row in rows)
                  return RegistryPage(
                      items=items, offset=offset, limit=limit, total=total
                  )

              def _emit_transition(
                  self,
                  cursor: sqlite3.Cursor,
                  *,
                  zid: str,
                  from_status: IdentityStatus | None,
                  to_status: IdentityStatus,
                  actor: str,
                  reason: str,
              ) -> None:
                  event_type = (
                      EVENT_IDENTITY_REGISTERED
                      if from_status is None
                      else EVENT_IDENTITY_STATUS_CHANGED
                  )
                  payload: dict[str, object] = {
                      "zid": zid,
                      "to": to_status.value,
                      "actor": actor,
                      "reason": reason,
                  }
                  if from_status is not None:
                      payload["from"] = from_status.value
                  event = self._catalog.build(
                      event_type,
                      aggregate_id=zid,
                      payload=payload,
                      clock=self._clock,
                  )
                  self._outbox.enqueue_in_transaction(cursor, event)

              @staticmethod
              def _identity_from_row(row: sqlite3.Row) -> Identity:
                  return Identity(
                      zid=str(row["zid"]),
                      kind=IdentityKind(str(row["kind"])),
                      status=IdentityStatus(str(row["status"])),
                      display_name=str(row["display_name"]),
                      created_at=float(row["created_at"]),
                      updated_at=float(row["updated_at"]),
                      contract_version=int(row["contract_version"]),
                  )
          PYEOF

          cat > shared_engines/identity/engine.py <<'PYEOF'
          """Identity engine: the public facade of the capability.

          Apps and other engines talk to this object only; storage,
          events and audit stay behind it.
          """
          from __future__ import annotations

          from shared_engines.audit.chain import AuditTrail
          from shared_engines.common.clocks import Clock
          from shared_engines.events.contracts import EventCatalog
          from shared_engines.events.outbox import Outbox
          from shared_engines.identity.contracts import (
              Identity,
              IdentityKind,
              IdentityStatus,
          )
          from shared_engines.identity.registry import (
              IdentityRegistry,
              RegistryPage,
          )
          from shared_engines.observability.backend import (
              MetricsBackend,
              NoopMetrics,
              engine_logger,
          )
          from shared_engines.observability.health import (
              ComponentHealth,
              HealthStatus,
          )
          from shared_engines.storage.database import Database


          class IdentityEngine:
              def __init__(
                  self,
                  *,
                  db: Database,
                  clock: Clock,
                  audit: AuditTrail,
                  outbox: Outbox,
                  catalog: EventCatalog,
                  metrics: MetricsBackend | None = None,
              ) -> None:
                  self._registry = IdentityRegistry(
                      db=db,
                      clock=clock,
                      audit=audit,
                      outbox=outbox,
                      catalog=catalog,
                  )
                  self._db = db
                  self._metrics = metrics if metrics is not None else NoopMetrics()
                  self._log = engine_logger("identity")

              def register_identity(
                  self, *, kind: IdentityKind, display_name: str, actor: str
              ) -> Identity:
                  identity = self._registry.create(
                      kind=kind, display_name=display_name, actor=actor
                  )
                  self._metrics.increment(
                      "identity.registered", tags={"kind": kind.value}
                  )
                  self._log.info(
                      "registered zid=%s kind=%s", identity.zid, kind.value
                  )
                  return identity

              def get_identity(self, zid: str) -> Identity | None:
                  return self._registry.get(zid)

              def require_identity(self, zid: str) -> Identity:
                  return self._registry.require(zid)

              def transition_identity(
                  self,
                  zid: str,
                  to_status: IdentityStatus,
                  *,
                  actor: str,
                  reason: str,
              ) -> Identity:
                  identity = self._registry.transition(
                      zid, to_status, actor=actor, reason=reason
                  )
                  self._metrics.increment(
                      "identity.transition", tags={"to": to_status.value}
                  )
                  self._log.info(
                      "transition zid=%s to=%s", zid, to_status.value
                  )
                  return identity

              def list_by_status(
                  self,
                  status: IdentityStatus,
                  *,
                  offset: int = 0,
                  limit: int = 50,
              ) -> RegistryPage:
                  return self._registry.list_by_status(
                      status, offset=offset, limit=limit
                  )

              def check_health(self) -> ComponentHealth:
                  if not self._db.ping():
                      return ComponentHealth(
                          "identity",
                          HealthStatus.UNHEALTHY,
                          "storage unavailable",
                      )
                  return ComponentHealth(
                      "identity", HealthStatus.HEALTHY, "storage ok"
                  )
          PYEOF

          cat > shared_engines/identity/tests/test_identity.py <<'PYEOF'
          from __future__ import annotations

          from pathlib import Path

          import pytest

          from shared_engines.audit.chain import AuditTrail
          from shared_engines.common.clocks import FrozenClock
          from shared_engines.events.contracts import Event, EventCatalog
          from shared_engines.events.outbox import Outbox
          from shared_engines.identity.contracts import (
              Identity,
              IdentityKind,
              IdentityStatus,
              VALID_TRANSITIONS,
          )
          from shared_engines.identity.engine import IdentityEngine
          from shared_engines.identity.errors import (
              IdentityAlreadyExistsError,
              IdentityNotFoundError,
              InvalidTransitionError,
          )
          from shared_engines.observability.health import HealthStatus
          from shared_engines.storage.database import SQLiteAdapter


          class _Harness:
              def __init__(self, tmp_path: Path) -> None:
                  self.db = SQLiteAdapter(tmp_path / "identity.db")
                  self.clock = FrozenClock()
                  self.audit = AuditTrail(self.db, self.clock)
                  self.outbox = Outbox(self.db, self.clock)
                  self.outbox.ensure_schema()
                  self.catalog = EventCatalog()
                  self.catalog.register("identity.registered")
                  self.catalog.register("identity.status_changed")
                  self.engine = IdentityEngine(
                      db=self.db,
                      clock=self.clock,
                      audit=self.audit,
                      outbox=self.outbox,
                      catalog=self.catalog,
                  )

              def close(self) -> None:
                  self.db.close()


          def _register(harness: _Harness, name: str = "Ada") -> Identity:
              return harness.engine.register_identity(
                  kind=IdentityKind.PERSON,
                  display_name=name,
                  actor="registrar-1",
              )


          def test_register_creates_unique_zid_in_registered_state(
              tmp_path: Path,
          ) -> None:
              harness = _Harness(tmp_path)
              identity = _register(harness)
              assert identity.zid.startswith("ZID-")
              assert identity.status is IdentityStatus.REGISTERED
              assert identity.kind is IdentityKind.PERSON
              assert identity.display_name == "Ada"
              second = _register(harness, "Bob")
              assert second.zid != identity.zid
              harness.close()


          def test_register_is_audited_and_emits_event(tmp_path: Path) -> None:
              harness = _Harness(tmp_path)
              identity = _register(harness)
              assert harness.audit.verify() == 1
              events = harness.outbox.pending()
              assert len(events) == 1
              assert events[0].event_type == "identity.registered"
              assert events[0].aggregate_id == identity.zid
              harness.close()


          def test_happy_lifecycle_path(tmp_path: Path) -> None:
              harness = _Harness(tmp_path)
              identity = _register(harness)
              moved = harness.engine.transition_identity(
                  identity.zid,
                  IdentityStatus.ACTIVE,
                  actor="admin",
                  reason="verified offline",
              )
              assert moved.status is IdentityStatus.ACTIVE
              moved = harness.engine.transition_identity(
                  moved.zid,
                  IdentityStatus.SUSPENDED,
                  actor="admin",
                  reason="under review",
              )
              assert moved.status is IdentityStatus.SUSPENDED
              moved = harness.engine.transition_identity(
                  moved.zid,
                  IdentityStatus.ACTIVE,
                  actor="admin",
                  reason="cleared",
              )
              assert moved.status is IdentityStatus.ACTIVE
              assert harness.audit.verify() == 4
              harness.close()


          def test_invalid_transitions_are_blocked(tmp_path: Path) -> None:
              harness = _Harness(tmp_path)
              identity = _register(harness)
              with pytest.raises(InvalidTransitionError):
                  harness.engine.transition_identity(
                      identity.zid,
                      IdentityStatus.VERIFIED,
                      actor="admin",
                      reason="skip verification",
                  )
              with pytest.raises(InvalidTransitionError):
                  harness.engine.transition_identity(
                      identity.zid,
                      IdentityStatus.SUSPENDED,
                      actor="admin",
                      reason="not active yet",
                  )
              entry = harness.engine.require_identity(identity.zid)
              assert entry.status is IdentityStatus.REGISTERED
              harness.close()


          def test_revocation_is_terminal(tmp_path: Path) -> None:
              harness = _Harness(tmp_path)
              identity = _register(harness)
              revoked = harness.engine.transition_identity(
                  identity.zid,
                  IdentityStatus.REVOKED,
                  actor="admin",
                  reason="fraud",
              )
              assert revoked.status is IdentityStatus.REVOKED
              with pytest.raises(InvalidTransitionError):
                  harness.engine.transition_identity(
                      revoked.zid,
                      IdentityStatus.ACTIVE,
                      actor="admin",
                      reason="resurrect",
                  )
              harness.close()


          def test_unknown_zid_raises_typed_error(tmp_path: Path) -> None:
              harness = _Harness(tmp_path)
              with pytest.raises(IdentityNotFoundError):
                  harness.engine.require_identity("ZID-missing")
              with pytest.raises(IdentityNotFoundError):
                  harness.engine.transition_identity(
                      "ZID-missing",
                      IdentityStatus.ACTIVE,
                      actor="admin",
                      reason="ghost",
                  )
              harness.close()


          def test_list_by_status_pagination(tmp_path: Path) -> None:
              harness = _Harness(tmp_path)
              for index in range(5):
                  _register(harness, f"User{index}")
              page1 = harness.engine.list_by_status(
                  IdentityStatus.REGISTERED, offset=0, limit=3
              )
              assert page1.total == 5
              assert len(page1.items) == 3
              assert page1.has_more
              page2 = harness.engine.list_by_status(
                  IdentityStatus.REGISTERED, offset=3, limit=3
              )
              assert len(page2.items) == 2
              assert not page2.has_more
              harness.close()


          def test_duplicate_zid_maps_to_typed_error(tmp_path: Path) -> None:
              harness = _Harness(tmp_path)
              identity = _register(harness)
              with pytest.raises(sqlite3.IntegrityError):
                  with harness.db.transaction() as cursor:
                      cursor.execute(
                          "INSERT INTO identities"
                          " (zid, kind, status, display_name,"
                          "  created_at, updated_at, contract_version)"
                          " VALUES (?, ?, ?, ?, ?, ?, ?)",
                          (
                              identity.zid,
                              "person",
                              "REGISTERED",
                              "clone",
                              1.0,
                              1.0,
                              1,
                          ),
                      )
              harness.close()


          def test_transitions_table_covers_all_states() -> None:
              for status in IdentityStatus:
                  assert status in VALID_TRANSITIONS
              assert VALID_TRANSITIONS[IdentityStatus.REVOKED] == frozenset()
              assert IdentityStatus.ACTIVE in (
                  VALID_TRANSITIONS[IdentityStatus.REGISTERED]
              )


          def test_outbox_events_carry_transition_payloads(
              tmp_path: Path,
          ) -> None:
              harness = _Harness(tmp_path)
              identity = _register(harness)
              harness.engine.transition_identity(
                  identity.zid,
                  IdentityStatus.ACTIVE,
                  actor="admin",
                  reason="go live",
              )
              collected: list[Event] = []

              def collect(event: Event) -> None:
                  collected.append(event)

              harness.outbox.dispatch_pending(collect)
              assert len(collected) == 2
              registered = collected[0]
              changed = collected[1]
              assert registered.event_type == "identity.registered"
              assert changed.event_type == "identity.status_changed"
              assert changed.payload["from"] == "REGISTERED"
              assert changed.payload["to"] == "ACTIVE"
              assert changed.payload["reason"] == "go live"
              harness.close()


          def test_identity_health_reflects_storage(tmp_path: Path) -> None:
              harness = _Harness(tmp_path)
              assert harness.engine.check_health().status is HealthStatus.HEALTHY
              harness.db.close()
              assert (
                  harness.engine.check_health().status
                  is HealthStatus.UNHEALTHY
              )
          PYEOF

          echo "=== IDENTITY BUILD OK ==="

      - name: Quality gates (mypy first; full regression all modules)
        run: |
          set -euo pipefail
          M="shared_engines/common shared_engines/storage shared_engines/events shared_engines/observability shared_engines/audit shared_engines/security shared_engines/identity"
          python -m compileall -q $M
          echo "compile OK"
          find $M -name '__pycache__' -type d -prune -exec rm -rf {} +
          mypy --strict --cache-dir="${RUNNER_TEMP}/mypy-cache" $M
          echo "mypy OK"
          flake8 $M --max-line-length=100
          echo "flake8 OK"
          PYTHONPATH="$PWD" python -m pytest -q -p no:cacheprovider $M
          echo "pytest OK"
          find $M -name '__pycache__' -type d -prune -exec rm -rf {} +

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "zyra-engines-bot"
          git config user.email "zyra-engines-bot@users.noreply.github.com"
