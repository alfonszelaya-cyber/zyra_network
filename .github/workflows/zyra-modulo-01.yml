name: zyra-n2a-mpe-app-files

"on":
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

concurrency:
  group: zyra-n2a-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: MPE NetworkClient
        run: |
          set -euo pipefail
          mkdir -p apps/mi_primer_empleo/infrastructure/network
          cat > apps/mi_primer_empleo/infrastructure/network/network_client.py <<'PYEOF'
          """MPE HTTP client to ZYRA Network."""
          from __future__ import annotations

          import json
          import os
          import urllib.request


          class NetworkClient:
              def __init__(
                  self,
                  base_url: str | None = None,
                  *,
                  timeout_seconds: float = 5.0,
                  max_retries: int = 2,
              ) -> None:
                  self._base = (
                      base_url
                      or os.environ.get("ZYRA_URL", "")
                  ).rstrip("/")
                  self._timeout = timeout_seconds
                  self._retries = max(0, max_retries)

              def get(self, path: str) -> tuple[
                  bool, dict | None, str | None
              ]:
                  return self._call("GET", path)

              def post(
                  self, path: str, payload: dict
              ) -> tuple[bool, dict | None, str | None]:
                  return self._call("POST", path, payload)

              def _call(
                  self,
                  method: str,
                  path: str,
                  payload: dict | None = None,
              ) -> tuple[bool, dict | None, str | None]:
                  if not self._base:
                      return (
                          False,
                          None,
                          "ZYRA_URL not configured",
                      )
                  url = self._base + path
                  data = None
                  if payload is not None:
                      data = json.dumps(
                          payload
                      ).encode("utf-8")
                  last_error = "unknown"
                  for attempt in range(
                      self._retries + 1
                  ):
                      try:
                          request = urllib.request.Request(
                              url,
                              data=data,
                              method=method,
                              headers={
                                  "Content-Type":
                                  "application/json"
                              },
                          )
                          with urllib.request.urlopen(
                              request,
                              timeout=self._timeout,
                          ) as response:
                              body = json.loads(
                                  response.read()
                                  .decode("utf-8")
                              )
                          if body.get("ok") is True:
                              return (
                                  True,
                                  body.get("data"),
                                  None,
                              )
                          error = body.get(
                              "error", {}
                          )
                          return (
                              False,
                              None,
                              str(
                                  error.get(
                                      "message",
                                      "rejected",
                                  )
                              ),
                          )
                      except Exception as exc:
                          last_error = str(exc)
                  return False, None, last_error
          PYEOF

      - name: MpeLink
        run: |
          set -euo pipefail
          mkdir -p apps/mi_primer_empleo/services
          cat > apps/mi_primer_empleo/services/mpe_link.py <<'PYEOF'
          """MpeLink: MPE operations on the Network."""
          from __future__ import annotations

          import base64

          from apps.mi_primer_empleo.infrastructure.network.network_client import (
              NetworkClient,
          )


          class MpeLink:
              def __init__(
                  self, client: NetworkClient
              ) -> None:
                  self._client = client

              def register_app(self) -> tuple[
                  bool, dict | None, str | None
              ]:
                  return self._client.post(
                      "/apps/register",
                      {
                          "app_id": "mpe",
                          "display_name": (
                              "Mi Primer Empleo"
                          ),
                          "scopes": [
                              "display_name",
                              "contact",
                          ],
                      },
                  )

              def register_user(
                  self, display_name: str
              ) -> tuple[bool, dict | None, str | None]:
                  return self._client.post(
                      "/identity/register",
                      {
                          "kind": "person",
                          "display_name": display_name,
                          "actor": "mpe",
                      },
                  )

              def register_company(
                  self, display_name: str
              ) -> tuple[bool, dict | None, str | None]:
                  return self._client.post(
                      "/identity/register",
                      {
                          "kind": "organization",
                          "display_name": display_name,
                          "actor": "mpe",
                      },
                  )

              def complete_trust(
                  self, zid: str
              ) -> tuple[bool, dict | None, str | None]:
                  return self._client.post(
                      "/trust/complete",
                      {"zid": zid, "actor": "mpe"},
                  )

              def is_trusted(
                  self, zid: str
              ) -> tuple[bool, dict | None, str | None]:
                  return self._client.get(
                      f"/trust/{zid}"
                  )

              def record_work_event(
                  self,
                  zid: str,
                  event: str,
                  detail: str,
              ) -> tuple[bool, dict | None, str | None]:
                  return self._client.post(
                      "/history/append",
                      {
                          "zid": zid,
                          "entry_type": "employment",
                          "actor_app": "mpe",
                          "payload": {
                              "event": event,
                              "detail": detail,
                          },
                      },
                  )

              def give_reputation(
                  self,
                  subject_zid: str,
                  actor_zid: str,
                  kind: str,
                  evidence: str,
              ) -> tuple[bool, dict | None, str | None]:
                  evidence_b64 = base64.b64encode(
                      evidence.encode("utf-8")
                  ).decode("ascii")
                  return self._client.post(
                      "/reputation/record",
                      {
                          "subject_zid": subject_zid,
                          "actor_zid": actor_zid,
                          "kind": kind,
                          "evidence_b64": (
                              evidence_b64
                          ),
                      },
                  )

              def reputation_score(
                  self, zid: str
              ) -> tuple[bool, dict | None, str | None]:
                  return self._client.get(
                      f"/reputation/{zid}"
                  )
          PYEOF

      - name: MpeStore
        run: |
          set -euo pipefail
          mkdir -p apps/mi_primer_empleo/infrastructure/persistence
          cat > apps/mi_primer_empleo/infrastructure/persistence/mpe_store.py <<'PYEOF'
          """MPE durable store."""
          from __future__ import annotations

          from shared_engines.storage.database import (
              Database,
          )
          from shared_engines.storage.migrations import (
              Migration,
              MigrationRunner,
          )

          _MIGRATIONS = (
              Migration(
                  1,
                  "mpe",
                  (
                      "CREATE TABLE mpe_accounts ("
                      " account_id TEXT PRIMARY KEY,"
                      " zid TEXT,"
                      " name TEXT NOT NULL,"
                      " role TEXT NOT NULL,"
                      " profession TEXT,"
                      " verified INTEGER NOT NULL"
                      " DEFAULT 0,"
                      " created_at REAL NOT NULL)",
                      "CREATE TABLE mpe_jobs ("
                      " job_id TEXT PRIMARY KEY,"
                      " company_account TEXT NOT NULL,"
                      " title TEXT NOT NULL,"
                      " profession TEXT NOT NULL,"
                      " openings INTEGER NOT NULL,"
                      " status TEXT NOT NULL"
                      " DEFAULT 'open',"
                      " created_at REAL NOT NULL)",
                      "CREATE TABLE mpe_applications ("
                      " application_id TEXT PRIMARY"
                      " KEY,"
                      " job_id TEXT NOT NULL,"
                      " worker_account TEXT NOT NULL,"
                      " status TEXT NOT NULL"
                      " DEFAULT 'submitted',"
                      " created_at REAL NOT NULL)",
                  ),
              ),
          )


          class MpeStore:
              def __init__(
                  self, db: Database, clock
              ) -> None:
                  self._db = db
                  self._clock = clock
                  MigrationRunner(
                      db, "mpe", _MIGRATIONS
                  ).run(clock)

              def add_account(
                  self,
                  *,
                  account_id: str,
                  zid: str | None,
                  name: str,
                  role: str,
                  profession: str | None,
              ) -> dict[str, object]:
                  if role not in (
                      "trabajador",
                      "empresa",
                  ):
                      raise ValueError(
                          f"unknown role: {role}"
                      )
                  now = self._clock.now()
                  with self._db.transaction() as cursor:
                      cursor.execute(
                          "INSERT INTO mpe_accounts"
                          " (account_id, zid, name,"
                          "  role, profession, verified,"
                          "  created_at)"
                          " VALUES (?, ?, ?, ?, ?, 0, ?)",
                          (
                              account_id,
                              zid,
                              name,
                              role,
                              profession,
                              now,
                          ),
                      )
                  return self.get_account(account_id)

              def mark_verified(
                  self, *, account_id: str
              ) -> None:
                  with self._db.transaction() as cursor:
                      cursor.execute(
                          "UPDATE mpe_accounts SET"
                          " verified = 1"
                          " WHERE account_id = ?",
                          (account_id,),
                      )

              def get_account(
                  self, account_id: str
              ) -> dict[str, object]:
                  row = self._db.query_one(
                      "SELECT * FROM mpe_accounts"
                      " WHERE account_id = ?",
                      (account_id,),
                  )
                  if row is None:
                      raise LookupError(
                          "unknown account:"
                          f" {account_id}"
                      )
                  return self._account_row(row)

              def list_workers(
                  self, *, profession: str | None = None
              ) -> tuple[dict[str, object], ...]:
                  if profession is not None:
                      rows = self._db.query_all(
                          "SELECT * FROM mpe_accounts"
                          " WHERE role = 'trabajador'"
                          " AND profession = ?"
                          " ORDER BY created_at",
                          (profession,),
                      )
                  else:
                      rows = self._db.query_all(
                          "SELECT * FROM mpe_accounts"
                          " WHERE role = 'trabajador'"
                          " ORDER BY created_at"
                      )
                  return tuple(
                      self._account_row(r)
                      for r in rows
                  )

              def list_companies(
                  self,
              ) -> tuple[dict[str, object], ...]:
                  rows = self._db.query_all(
                      "SELECT * FROM mpe_accounts"
                      " WHERE role = 'empresa'"
                      " ORDER BY created_at"
                  )
                  return tuple(
                      self._account_row(r)
                      for r in rows
                  )

              def post_job(
                  self,
                  *,
                  job_id: str,
                  company_account: str,
                  title: str,
                  profession: str,
                  openings: int,
              ) -> dict[str, object]:
                  company = self.get_account(
                      company_account
                  )
                  if company.get("role") != "empresa":
                      raise ValueError(
                          "only companies can post"
                          " jobs"
                      )
                  now = self._clock.now()
                  with self._db.transaction() as cursor:
                      cursor.execute(
                          "INSERT INTO mpe_jobs"
                          " (job_id, company_account,"
                          "  title, profession,"
                          "  openings, status,"
                          "  created_at)"
                          " VALUES (?, ?, ?, ?, ?,"
                          "  'open', ?)",
                          (
                              job_id,
                              company_account,
                              title,
                              profession,
                              openings,
                              now,
                          ),
                      )
                  row = self._db.query_one(
                      "SELECT * FROM mpe_jobs"
                      " WHERE job_id = ?",
                      (job_id,),
                  )
                  assert row is not None
                  return self._job_row(row)

              def list_jobs(
                  self, *, profession: str | None = None
              ) -> tuple[dict[str, object], ...]:
                  if profession is not None:
                      rows = self._db.query_all(
                          "SELECT * FROM mpe_jobs"
                          " WHERE status = 'open'"
                          " AND profession = ?"
                          " ORDER BY created_at",
                          (profession,),
                      )
                  else:
                      rows = self._db.query_all(
                          "SELECT * FROM mpe_jobs"
                          " WHERE status = 'open'"
                          " ORDER BY created_at"
                      )
                  return tuple(
                      self._job_row(r)
                      for r in rows
                  )

              def apply(
                  self,
                  *,
                  application_id: str,
                  job_id: str,
                  worker_account: str,
              ) -> dict[str, object]:
                  worker = self.get_account(
                      worker_account
                  )
                  if (
                      worker.get("role")
                      != "trabajador"
                  ):
                      raise ValueError(
                          "only workers can apply"
                      )
                  row = self._db.query_one(
                      "SELECT * FROM mpe_jobs"
                      " WHERE job_id = ?"
                      " AND status = 'open'",
                      (job_id,),
                  )
                  if row is None:
                      raise LookupError(
                          "job not open:"
                          f" {job_id}"
                      )
                  dup = self._db.query_one(
                      "SELECT 1 FROM"
                      " mpe_applications WHERE"
                      " job_id = ? AND"
                      " worker_account = ?",
                      (job_id, worker_account),
                  )
                  if dup is not None:
                      raise ValueError(
                          "already applied"
                      )
                  now = self._clock.now()
                  with self._db.transaction() as cursor:
                      cursor.execute(
                          "INSERT INTO"
                          " mpe_applications"
                          " (application_id, job_id,"
                          "  worker_account, status,"
                          "  created_at)"
                          " VALUES (?, ?, ?,"
                          "  'submitted', ?)",
                          (
                              application_id,
                              job_id,
                              worker_account,
                              now,
                          ),
                      )
                  return {
                      "application_id": (
                          application_id
                      ),
                      "job_id": job_id,
                      "worker": worker_account,
                      "status": "submitted",
                  }

              def applications_for(
                  self, *, job_id: str
              ) -> tuple[dict[str, object], ...]:
                  rows = self._db.query_all(
                      "SELECT * FROM"
                      " mpe_applications"
                      " WHERE job_id = ?"
                      " ORDER BY created_at",
                      (job_id,),
                  )
                  return tuple(
                      {
                          "application_id": str(
                              r["application_id"]
                          ),
                          "job_id": str(
                              r["job_id"]
                          ),
                          "worker_account": str(
                              r["worker_account"]
                          ),
                          "status": str(
                              r["status"]
                          ),
                      }
                      for r in rows
                  )

              def summary(self) -> dict[str, object]:
                  accounts = self._db.query_one(
                      "SELECT COUNT(*) AS total,"
                      " SUM(verified) AS verified"
                      " FROM mpe_accounts"
                  )
                  roles = self._db.query_all(
                      "SELECT role, COUNT(*) AS n"
                      " FROM mpe_accounts"
                      " GROUP BY role"
                  )
                  jobs = self._db.query_one(
                      "SELECT COUNT(*) AS open_jobs"
                      " FROM mpe_jobs"
                      " WHERE status = 'open'"
                  )
                  apps = self._db.query_one(
                      "SELECT COUNT(*) AS total"
                      " FROM mpe_applications"
                  )
                  by_role = {
                      str(r["role"]): int(r["n"])
                      for r in roles
                  }
                  total = 0
                  verified = 0
                  if accounts is not None:
                      total = int(
                          accounts["total"]
                      )
                      if (
                          accounts["verified"]
                          is not None
                      ):
                          verified = int(
                              accounts["verified"]
                          )
                  return {
                      "accounts_total": total,
                      "accounts_verified": (
                          verified
                      ),
                      "by_role": by_role,
                      "open_jobs": int(
                          jobs["open_jobs"]
                      )
                      if jobs is not None
                      else 0,
                      "applications_total": int(
                          apps["total"]
                      )
                      if apps is not None
                      else 0,
                  }

              @staticmethod
              def _account_row(row) -> dict[str, object]:
                  return {
                      "account_id": str(
                          row["account_id"]
                      ),
                      "zid": (
                          str(row["zid"])
                          if row["zid"] is not None
                          else None
                      ),
                      "name": str(row["name"]),
                      "role": str(row["role"]),
                      "profession": (
                          str(row["profession"])
                          if row["profession"]
                          is not None
                          else None
                      ),
                      "verified": bool(
                          int(row["verified"])
                      ),
                      "created_at": float(
                          row["created_at"]
                      ),
                  }

              @staticmethod
              def _job_row(row) -> dict[str, object]:
                  return {
                      "job_id": str(row["job_id"]),
                      "company_account": str(
                          row["company_account"]
                      ),
                      "title": str(row["title"]),
                      "profession": str(
                          row["profession"]
                      ),
                      "openings": int(
                          row["openings"]
                      ),
                      "status": str(row["status"]),
                      "created_at": float(
                          row["created_at"]
                      ),
                  }
          PYEOF

      - name: MPE HTTP surface
        run: |
          set -euo pipefail
          cat > apps/mi_primer_empleo/server.py <<'PYEOF'
          """MPE HTTP surface: role-based screens."""
          from __future__ import annotations

          import json
          import uuid
          from http.server import (
              BaseHTTPRequestHandler,
              ThreadingHTTPServer,
          )
          from typing import Any, ClassVar
          from urllib.parse import urlparse

          from apps.mi_primer_empleo.infrastructure.persistence.mpe_store import (
              MpeStore,
          )
          from apps.mi_primer_empleo.infrastructure.network.network_client import (
              NetworkClient,
          )
          from apps.mi_primer_empleo.services.mpe_link import (
              MpeLink,
          )

          _CSS = (
              "body{font-family:system-ui,sans-serif;"
              "background:#0d1117;color:#e6edf3;"
              "display:flex;justify-content:center;"
              "padding:20px;margin:0}"
              ".wrap{max-width:680px;width:100%}"
              "h1{font-size:1.3rem}"
              "h2{font-size:1rem;margin-top:20px;"
              "color:#58a6ff}"
              ".card{background:#161b22;border:1px solid"
              " #30363d;border-radius:10px;padding:14px;"
              "margin-top:10px}"
              "button{background:#238636;color:#fff;"
              "border:none;padding:12px 18px;border-radius:8px;"
              "font-size:1rem;cursor:pointer;margin:6px 4px 0 0;"
              "width:100%;text-align:left}"
              "button.gray{background:#30363d}"
              "input,select{width:100%;box-sizing:border-box;"
              "background:#0d1117;color:#e6edf3;"
              "border:1px solid #30363d;border-radius:6px;"
              "padding:8px;margin:4px 0;font-size:0.95rem}"
          )


          def _page(title: str, body: str) -> str:
              return (
                  "<!DOCTYPE html><html lang='es'><head>"
                  "<meta charset='utf-8'>"
                  "<meta name='viewport' content='width="
                  "device-width, initial-scale=1'>"
                  f"<title>{title}</title>"
                  f"<style>{_CSS}</style></head><body>"
                  f"<div class='wrap'>{body}</div></body>"
                  "</html>"
              )


          class MpeApiHandler(
              BaseHTTPRequestHandler
          ):
              store: ClassVar[MpeStore]
              link: ClassVar[MpeLink]

              def log_message(
                  self, format: str, *args: object
              ) -> None:
                  return None

              def do_GET(self) -> None:
                  self._safe("GET")

              def do_POST(self) -> None:
                  self._safe("POST")

              def _safe(self, method: str) -> None:
                  try:
                      self._route(method)
                  except LookupError as exc:
                      self._html(
                          404,
                          _page(
                              "No encontrado",
                              "<h1>404</h1>"
                              f"<p>{exc}</p>",
                          ),
                      )
                  except ValueError as exc:
                      self._html(
                          400,
                          _page(
                              "Error",
                              "<h1>Dato invalido"
                              f"</h1><p>{exc}</p>",
                          ),
                      )
                  except Exception as exc:
                      self._html(
                          500,
                          _page(
                              "Error",
                              "<h1>Error interno"
                              f"</h1><p>{exc}</p>",
                          ),
                      )

              def _route(self, method: str) -> None:
                  path = urlparse(self.path).path
                  segments = [
                      s
                      for s in path.split("/")
                      if s
                  ]
                  if segments[:1] != ["mpe"]:
                      self._html(
                          404,
                          _page(
                              "404",
                              "<h1>Fuera de MPE"
                              "</h1>",
                          ),
                      )
                      return
                  tail = segments[1:]
                  if method == "GET":
                      self._get(tail)
                  else:
                      self._post(tail)

              def _get(self, s: list[str]) -> None:
                  if s[:1] == ["api"]:
                      self._api_get(s[1:])
                      return
                  store = type(self).store
                  if not s or s == ["home"]:
                      self._home()
                      return
                  if s[0] == "trabajador":
                      self._screen_worker(s)
                      return
                  if s[0] == "empresa":
                      self._screen_company(s)
                      return
                  if s == ["jobs"]:
                      jobs = store.list_jobs()
                      items = "".join(
                          "<li>• "
                          + j["title"]
                          + " ("
                          + j["profession"]
                          + ") - "
                          + str(j["openings"])
                          + " vacantes</li>"
                          for j in jobs
                      )
                      if not items:
                          items = (
                              "<li>Sin vacantes"
                              " abiertas</li>"
                          )
                      self._html(
                          200,
                          _page(
                              "MPE - Vacantes",
                              "<h1>Vacantes abiertas"
                              "</h1><ul>"
                              + items
                              + "</ul>"
                              "<a href='/mpe'>"
                              "<button class='gray'>"
                              "Inicio</button></a>",
                          ),
                      )
                      return
                  if s == ["government", "summary"]:
                      self._send(
                          200,
                          {
                              "ok": True,
                              "data": store.summary(),
                          },
                      )
                      return
                  self._html(
                      404,
                      _page("404", "<h1>No"
                      " encontrado</h1>"),
                  )

              def _post(self, s: list[str]) -> None:
                  if s[:1] == ["api"]:
                      self._api_post(s[1:])
                      return
                  store = type(self).store
                  link = type(self).link
                  doc = self._read_form()
                  if s == ["register"]:
                      name = self._req(doc, "name")
                      role = str(
                          doc.get("role", "trabajador")
                      )
                      profession = doc.get(
                          "profession"
                      )
                      profession = (
                          str(profession)
                          if profession is not None
                          else None
                      )
                      account_id = (
                          "MPE-"
                          + uuid.uuid4().hex[:12]
                      )
                      zid: str | None = None
                      if role == "trabajador":
                          ok, data, _error = (
                              link.register_user(name)
                          )
                      else:
                          ok, data, _error = (
                              link.register_company(
                                  name
                              )
                          )
                      if ok and data is not None:
                          zid = str(data.get("zid"))
                      store.add_account(
                          account_id=account_id,
                          zid=zid,
                          name=name,
                          role=role,
                          profession=profession,
                      )
                      zid_text = (
                          zid
                          if zid is not None
                          else "pendiente de conexion"
                      )
                      self._html(
                          200,
                          _page(
                              "Bienvenido a MPE",
                              "<h1>Cuenta creada"
                              "</h1>"
                              "<p>Tu ID:"
                              f" <b>{account_id}"
                              "</b></p>"
                              "<p>Tu ZID de red: "
                              f"<b>{zid_text}</b></p>"
                              "<a href='/mpe/"
                              f"{role}/{account_id}'>"
                              "<button>Ir a mi panel"
                              "</button></a>",
                          ),
                      )
                      return
                  if s == ["job"]:
                      company_account = self._req(
                          doc, "company_account"
                      )
                      row = store.post_job(
                          job_id=(
                              "JOB-"
                              + uuid.uuid4().hex[:10]
                          ),
                          company_account=(
                              company_account
                          ),
                          title=self._req(
                              doc, "title"
                          ),
                          profession=self._req(
                              doc, "profession"
                          ),
                          openings=int(
                              doc.get("openings", 1)
                          ),
                      )
                      self._html(
                          200,
                          _page(
                              "Vacante publicada",
                              "<h1>Vacante publicada"
                              "</h1>"
                              f"<p>{row['title']} -"
                              f" {row['openings']}"
                              " vacantes</p>"
                              "<a href='/mpe/empresa/"
                              f"{company_account}'>"
                              "<button>Volver</button>"
                              "</a>",
                          ),
                      )
                      return
                  if s == ["apply"]:
                      worker_account = self._req(
                          doc, "worker_account"
                      )
                      app_id = (
                          "APP-"
                          + uuid.uuid4().hex[:10]
                      )
                      store.apply(
                          application_id=app_id,
                          job_id=self._req(
                              doc, "job_id"
                          ),
                          worker_account=(
                              worker_account
                          ),
                      )
                      self._html(
                          200,
                          _page(
                              "Aplicacion enviada",
                              "<h1>Aplicacion"
                              " enviada</h1>"
                              "<a href='/mpe/trabajador/"
                              f"{worker_account}'>"
                              "<button>Volver</button>"
                              "</a>",
                          ),
                      )
                      return
                  self._html(
                      404,
                      _page("404", "<h1>Ruta"
                      " desconocida</h1>"),
                  )

              def _read_form(
                  self,
              ) -> dict[str, Any]:
                  length_header = self.headers.get(
                      "Content-Length"
                  )
                  if length_header is None:
                      raise ValueError(
                          "Content-Length required"
                      )
                  raw = self.rfile.read(
                      int(length_header)
                  ).decode("utf-8")
                  doc: dict[str, Any] = {}
                  for pair in raw.split("&"):
                      if "=" in pair:
                          key, value = pair.split(
                              "=", 1
                          )
                          doc[key] = value.replace(
                              "+", " "
                          )
                  return doc

              def _read_json(
                  self,
              ) -> dict[str, Any]:
                  length_header = self.headers.get(
                      "Content-Length"
                  )
                  if length_header is None:
                      raise ValueError(
                          "Content-Length required"
                      )
                  raw = self.rfile.read(
                      int(length_header)
                  )
                  parsed: Any = json.loads(
                      raw.decode("utf-8")
                  )
                  if not isinstance(parsed, dict):
                      raise ValueError(
                          "body must be a JSON"
                          " object"
                      )
                  return {
                      str(k): v
                      for k, v in parsed.items()
                  }

              @staticmethod
              def _req(
                  doc: dict[str, Any], key: str
              ) -> str:
                  value: Any = doc.get(key)
                  if isinstance(value, int) and not isinstance(
                      value, bool
                  ):
                      value = str(value)
                  if not isinstance(value, str):
                      raise ValueError(
                          f"missing field: {key}"
                      )
                  if not value.strip():
                      raise ValueError(
                          f"missing field: {key}"
                      )
                  return value

              def _api_get(self, s: list[str]) -> None:
                  store = type(self).store
                  if s == ["health"]:
                      self._send(
                          200,
                          {
                              "ok": True,
                              "data": {
                                  "app": "mpe",
                                  "status":
                                  "operational",
                              },
                          },
                      )
                      return
                  if s == ["jobs"]:
                      self._send(
                          200,
                          {
                              "ok": True,
                              "data": list(
                                  store.list_jobs()
                              ),
                          },
                      )
                      return
                  if s == ["summary"]:
                      self._send(
                          200,
                          {
                              "ok": True,
                              "data": store.summary(),
                          },
                      )
                      return
                  self._send(
                      404,
                      {
                          "ok": False,
                          "error": {
                              "type": "not_found",
                              "message":
                              "unknown api route",
                          },
                      },
                  )

              def _api_post(
                  self, s: list[str]
              ) -> None:
                  store = type(self).store
                  doc = self._read_json()
                  if s == ["accounts"]:
                      account_id = (
                          "MPE-"
                          + uuid.uuid4().hex[:12]
                      )
                      row = store.add_account(
                          account_id=account_id,
                          zid=doc.get("zid"),
                          name=self._req(doc, "name"),
                          role=self._req(doc, "role"),
                          profession=doc.get(
                              "profession"
                          ),
                      )
                      self._send(
                          201,
                          {
                              "ok": True,
                              "data": row,
                          },
                      )
                      return
                  if s == ["jobs"]:
                      row = store.post_job(
                          job_id=(
                              "JOB-"
                              + uuid.uuid4().hex[:10]
                          ),
                          company_account=self._req(
                              doc,
                              "company_account",
                          ),
                          title=self._req(
                              doc, "title"
                          ),
                          profession=self._req(
                              doc, "profession"
                          ),
                          openings=int(
                              doc.get("openings", 1)
                          ),
                      )
                      self._send(
                          201,
                          {
                              "ok": True,
                              "data": row,
                          },
                      )
                      return
                  self._send(
                      404,
                      {
                          "ok": False,
                          "error": {
                              "type": "not_found",
                              "message":
                              "unknown api route",
                          },
                      },
                  )

