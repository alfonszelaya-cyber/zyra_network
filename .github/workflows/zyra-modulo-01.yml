name: zyra-deploy-prep

"on":
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

concurrency:
  group: zyra-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cryptography (production dep)
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "cryptography>=42,<45"

      - name: Evidence (state before)
        run: |
          set -euo pipefail
          wc -c main.py render.yaml requirements.txt
          echo "=== old main.py server section ==="
          grep -n "ZyraServer\|serve_combined\|ZyraCapabilities" main.py || true

      - name: Write requirements.txt (real deps)
        run: |
          set -euo pipefail
          cat > requirements.txt <<'EOF'
          cryptography>=42,<45
          EOF
          wc -c requirements.txt
          cat requirements.txt

      - name: Write main.py v2 (core plus capabilities in one port)
        run: |
          set -euo pipefail
          cat > main.py <<'PYEOF'
          """Zyra Network production entrypoint (persistent
          authority + combined surface: core API and trust
          capabilities on a single port)."""
          from __future__ import annotations

          import logging
          import os
          from pathlib import Path

          from shared_engines.authority.root import PersistentRootAuthority
          from shared_engines.common.clocks import SystemClock
          from shared_engines.runtime.capabilities import ZyraCapabilities
          from shared_engines.runtime.combined_api import serve_combined
          from shared_engines.runtime.config import RuntimeConfig
          from shared_engines.runtime.kernel import ZyraKernel
          from shared_engines.storage.database import SQLiteAdapter

          DATA_DIR = os.environ.get(
              "ZYRA_DATA_DIR", "/tmp/zyra-data"
          )
          DB_PATH = os.path.join(DATA_DIR, "zyra.db")


          def main() -> None:
              logging.basicConfig(
                  level=logging.INFO,
                  format=(
                      "%(asctime)s %(name)s "
                      "%(levelname)s %(message)s"
                  ),
              )
              log = logging.getLogger("zyra.main")

              master = os.environ.get(
                  "ZYRA_ROOT_KEY"
              )
              if not master:
                  raise SystemExit(
                      "ZYRA_ROOT_KEY is required"
                      " (64 hex chars)."
                  )
              token = os.environ.get(
                  "ZYRA_API_TOKEN"
              ) or None
              if token is not None and len(
                  token
              ) < 16:
                  raise SystemExit(
                      "ZYRA_API_TOKEN must be at"
                      " least 16 characters"
                  )
              port = int(
                  os.environ.get("ZYRA_PORT")
                  or os.environ.get("PORT")
                  or 8080
              )

              os.makedirs(
                  DATA_DIR, exist_ok=True
              )
              db = SQLiteAdapter(
                  DB_PATH, busy_timeout_ms=10_000
              )
              clock = SystemClock()

              authority = PersistentRootAuthority(
                  data_dir=Path(DATA_DIR),
                  master_key_hex=master,
              )
              signer, status = (
                  authority.load_or_create()
              )
              log.info(
                  "root authority: %s"
                  " fingerprint=%s",
                  status.status.value,
                  status.public_pem_fingerprint,
              )

              config = RuntimeConfig(
                  host="0.0.0.0",
                  port=port,
                  max_body_bytes=5_000_000,
                  api_token=token,
              )
              kernel = ZyraKernel(
                  db=db,
                  clock=clock,
                  signer=signer,
                  config=config,
              )
              root = kernel.bootstrap_root()
              caps = ZyraCapabilities(
                  db,
                  clock,
                  identity=kernel.identity,
                  signer=signer,
              )
              server = serve_combined(
                  kernel,
                  caps,
                  host=config.host,
                  port=config.port,
              )

              log.info(
                  "Zyra Network is LIVE"
              )
              log.info(
                  "root zid=%s", root.zid
              )
              log.info(
                  "combined surface on port"
                  " %s: core API + 14 trust"
                  " capability routes",
                  port,
              )

              try:
                  server.serve_forever()
              except KeyboardInterrupt:
                  pass
              finally:
                  server.server_close()
                  db.close()


          if __name__ == "__main__":
              main()
          PYEOF
          python -m py_compile main.py
          echo "main.py v2 written and compiles"

      - name: Write render.yaml v2 (data dir included)
        run: |
          set -euo pipefail
          cat > render.yaml <<'EOF'
          services:
            - type: web
              name: zyra-network
              runtime: python
              plan: free
              buildCommand: |
                pip install --upgrade pip
                pip install -r requirements.txt
              startCommand: python main.py
              healthCheckPath: /health
              envVars:
                - key: PYTHON_VERSION
                  value: "3.12.4"
                - key: ZYRA_PORT
                  value: "10000"
                - key: ZYRA_DATA_DIR
                  value: "/tmp/zyra-data"
                - key: ZYRA_ROOT_KEY
                  sync: false
                - key: ZYRA_API_TOKEN
                  sync: false
          EOF
          echo "render.yaml v2 written"
          cat render.yaml

      - name: Smoke test (real production boot)
        run: |
          set -euo pipefail
          export ZYRA_ROOT_KEY=$(python -c "import secrets; print(secrets.token_hex(32))")
          export ZYRA_API_TOKEN="zyra-smoke-token-1234567890"
          export ZYRA_PORT=8765
          export ZYRA_DATA_DIR=/tmp/zyra-smoke
          python main.py > /tmp/zyra.log 2>&1 &
          PID=$!
          sleep 5
          if kill -0 "$PID" 2>/dev/null; then
            echo "SMOKE OK: server process alive"
          else
            echo "SMOKE FAIL: server died"
            cat /tmp/zyra.log
            exit 1
          fi
          if grep -q "Zyra Network is LIVE" /tmp/zyra.log; then
            echo "LOG CONFIRMS: LIVE"
          else
            echo "LOG MISSING LIVE MARKER"
            cat /tmp/zyra.log
            kill "$PID" || true
            exit 1
          fi
          if grep -q "root zid=" /tmp/zyra.log; then
            echo "ROOT ZID BOOTSTRAPPED"
          fi
          kill "$PID" || true
          wait "$PID" 2>/dev/null || true
          echo "=== SMOKE COMPLETE ==="

      - name: Commit and push (race-safe)
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "zyra-engines-bot"
          git config user.email "zyra-engines-bot@users.noreply.github.com"
          git pull --rebase --autostash origin "${{ github.ref_name }}" || true
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "zyra: deploy prep - requirements.txt with real deps (was empty), main.py v2 serves core API plus 14 trust capabilities on one port via serve_combined (pattern proven in tests), render.yaml v2 with ZYRA_DATA_DIR and requirements install; production smoke boot passed"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
          echo "=== DEPLOY PREP COMPLETE ==="
