name: zyra-w22-ecosystem-consolidation

"on":
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

concurrency:
  group: zyra-w22-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolchain
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "cryptography>=42,<45" "pytest>=8,<9"

      - name: Consolidate apps (renames + absorption)
        run: |
          set -euo pipefail
          git mv apps/arqueologia_digital apps/ciclo_digital \
            || mv apps/arqueologia_digital apps/ciclo_digital
          git mv apps/pruebas apps/laboratorio \
            || mv apps/pruebas apps/laboratorio
          git mv apps/cerebrotic apps/futuro_os \
            || mv apps/cerebrotic apps/futuro_os
          # Security Command joins AXIS as its penal/security
          # command module (justice: prison records, criminal
          # history; security: face-detection cameras, emotion
          # sensors) - it is absorbed, not deleted.
          mkdir -p apps/axis/modules
          git mv apps/security_command apps/axis/modules/seguridad_comando \
            || mv apps/security_command apps/axis/modules/seguridad_comando
          echo "renames + absorption done"

      - name: Remove absorbed and redundant folders
        run: |
          set -euo pipefail
          rm -rf apps/reciclaje_digital
          rm -rf apps/decisiones_reales
          rm -rf apps/controlador_espacios
          rm -rf apps/governance_portal
          rm -rf apps/rednew
          rm -rf apps/shared_domain
          echo "absorbed folders removed"

      - name: Fix legacy typo templatess -> templates
        run: |
          set -euo pipefail
          find apps -maxdepth 3 -type d -name 'templatess' | while read -r d; do
            parent=$(dirname "$d")
            if [ -d "$parent/templates" ]; then
              rm -rf "$d"
              echo "removed legacy $d (templates/ exists)"
            else
              mv "$d" "$parent/templates"
              echo "renamed $d -> templates/"
            fi
          done
          left=$(find apps -type d -name 'templatess' | wc -l)
          test "$left" -eq 0
          echo "typo cleaned: 0 templatess remain"

      - name: Verify final ecosystem structure
        run: |
          set -euo pipefail
          echo "===== FINAL APPS STRUCTURE ====="
          ls -1 apps/
          expected=$(printf '%s\n' agro axis ciclo_digital futuro_os \
            laboratorio mi_primer_empleo nexo semilla subastas \
            | sort)
          actual=$(ls -1 apps/ | sort)
          if [ "$expected" != "$actual" ]; then
            echo "UNEXPECTED STRUCTURE"
            diff <(echo "$expected") <(echo "$actual") || true
            exit 1
          fi
          echo "structure verified: exactly 9 systems"
          echo ""
          echo "===== AXIS MODULES (seguridad_comando absorbed) ====="
          ls -1 apps/axis/modules/
          echo ""
          echo "===== REAL CODE INVENTORY ====="
          for app in $(ls -1 apps/); do
            real=$(find "apps/$app" -name '*.py' -size +1c \
              ! -name '__init__.py' | wc -l)
            echo "$app: $real .py files with real code"
          done

      - name: Record the ecosystem decision
        run: |
          set -euo pipefail
          mkdir -p docs
          cat > docs/ECOSYSTEM_MAP.md <<'MDEOF'
          # ZYRA Ecosystem — App Consolidation Map

          Decision recorded in W22. The ecosystem is 9 systems
          (7 active + 2 parked), all living on ZYRA Network.

          ## The 9 systems

          | # | System | Scope | Wave |
          |---|---|---|---|
          | 1 | nexo | Business/fiscal core: invoices, automatic accounting, document-photo analysis | 1 |
          | 2 | agro | Farmers/ranchers: verified government aid, planting records, market price alerts | 1 |
          | 3 | semilla | Education pre-k->university, MINED hierarchy, emotional AI, scholarships | 1 |
          | 4 | axis | Health (proactive care) + justice (instant case files, PENAL module: prison/criminal records) + security (police, face-detection cameras, emotion sensors - Security Command absorbed here as modules/seguridad_comando) | 1 |
          | 5 | subastas | Live marketplace + Radar VIP (investment opportunities) + stock recommendations | 1 |
          | 6 | mi_primer_empleo | First-job matching, work history, notifications | 1 |
          | 7 | ciclo_digital | Archeology (recover lost evidence) + Recycling (deleted data -> tokens) | 2 |
          | 8 | laboratorio | Policy/law/tax simulation + 3D design + real decisions | 2 |
          | 9 | futuro_os | Cerebrotic (rescue robots/drones) + Space Control (3D lanes, transit fees) | 3 |

          ## Absorbed / removed folders

          - security_command -> axis/modules/seguridad_comando
            (penal records + police + face/emotion detection; feeds
            and is fed by the justice domain)
          - reciclaje_digital -> ciclo_digital
          - decisiones_reales -> laboratorio
          - controlador_espacios -> futuro_os
          - governance_portal -> ZYRA Network admin surface
            (capabilities API)
          - rednew -> parked (purpose undefined, empty)
          - shared_domain -> recreated when real shared contracts
            exist (it was empty)

          ## Security/justice note

          Face-detection and emotion-sensor features require strict
          governance: only authorized apps write/read, and EVERY
          consultation is audited (the Network enforces this since
          W5). The result is the most TRANSPARENT security system,
          not the most invasive one.

          ## Resilience rule

          Every app consumes the Network over HTTP and keeps its
          own state. If one app is down or in maintenance, the
          others keep working; document verification even works
          offline (Ed25519 + SHA-256, no server needed).

          ## Legacy cleanup

          - `templatess/` typo directories removed (legacy from the
            old repository template).
          - AGRO real code (208 files) is retained as the starting
            point and will be refactored during its build (N1).
          MDEOF
          echo "map recorded"

      - name: Sanity: AGRO code intact + compile check
        run: |
          set -euo pipefail
          real=$(find apps/agro -name '*.py' -size +1c \
            ! -name '__init__.py' | wc -l)
          echo "agro real code files: $real"
          test "$real" -gt 200
          python -m compileall -q apps/agro apps/axis
          echo "agro + axis compile OK"
          find apps/agro apps/axis -name '__pycache__' -type d -prune \
            -exec rm -rf {} +

      - name: Commit and push (race-safe)
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "zyra-engines-bot"
          git config user.email "zyra-engines-bot@users.noreply.github.com"
          git pull --rebase --autostash origin "${{ github.ref_name }}" || true
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "zyra: W22 ecosystem consolidation - 16 apps -> 9 systems; Security Command ABSORBED into axis/modules/seguridad_comando (penal records, police, face/emotion detection for justice+security), absorbed folders removed, templatess typo cleaned, ECOSYSTEM_MAP.md recorded; AGRO real code verified intact"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
          echo "=== W22 COMPLETE: 9-SYSTEM ECOSYSTEM ==="
