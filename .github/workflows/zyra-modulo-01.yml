              def _ext(self) -> Any:
                  link = type(self).link
                  return (
                      LaboratorioLink(
                          getattr(
                              link, "_client"
                          )
                      )
                  )

              def _read_form(
                  self,
              ) -> dict[str, Any]:
                  length_header = self.headers.get(
                      "Content-Length"
                  )
                  if length_header is None:
                      raise ValueError(
                          "Content-Length required"
                      )
                  raw = self.rfile.read(
                      int(length_header)
                  ).decode("utf-8")
                  doc: dict[str, Any] = {}
                  for pair in raw.split("&"):
                      if "=" in pair:
                          key, value = pair.split(
                              "=", 1
                          )
                          doc[key] = value.replace(
                              "+", " "
                          )
                  return doc

              def _read_json(
                  self,
              ) -> dict[str, Any]:
                  length_header = self.headers.get(
                      "Content-Length"
                  )
                  if length_header is None:
                      raise ValueError(
                          "Content-Length required"
                      )
                  raw = self.rfile.read(
                      int(length_header)
                  )
                  parsed: Any = json.loads(
                      raw.decode("utf-8")
                  )
                  if not isinstance(parsed, dict):
                      raise ValueError(
                          "body must be a JSON"
                          " object"
                      )
                  return {
                      str(k): v
                      for k, v in parsed.items()
                  }

              @staticmethod
              def _req(
                  doc: dict[str, Any],
                  key: str,
              ) -> str:
                  value: Any = doc.get(key)
                  if isinstance(
                      value, int
                  ) and not isinstance(
                      value, bool
                  ):
                      value = str(value)
                  if not isinstance(value, str):
                      raise ValueError(
                          f"missing field: {key}"
                      )
                  if not value.strip():
                      raise ValueError(
                          f"missing field: {key}"
                      )
                  return value

              def _api_get(
                  self, s: list[str],
              ) -> None:
                  store = type(self).store
                  if s == ["health"]:
                      self._send(
                          200,
                          {
                              "ok": True,
                              "data": {
                                  "app":
                                  "laboratorio",
                                  "status":
                                  "operational",
                              },
                          },
                      )
                      return
                  if s[:1] == ["scenarios"] and len(
                      s
                  ) == 2:
                      self._send(
                          200,
                          {
                              "ok": True,
                              "data": store.get_scenario(
                                  s[1]
                              ),
                          },
                      )
                      return
                  self._send(
                      404,
                      {
                          "ok": False,
                          "error": {
                              "type":
                              "not_found",
                              "message":
                              "unknown api route",
                          },
                      },
                  )

              def _api_post(
                  self, s: list[str],
              ) -> None:
                  store = type(self).store
                  doc = self._read_json()
                  if s == ["scenarios"]:
                      scenario = (
                          store.create_scenario(
                              scenario_id="SCN-"
                              + _uuid.uuid4().hex[
                                  :10
                              ],
                              owner_zid=doc.get(
                                  "owner_zid"
                              ),
                              scenario_type=self._req(
                                  doc,
                                  "scenario_type",
                              ),
                              title=self._req(
                                  doc, "title"
                              ),
                              description=self._req(
                                  doc,
                                  "description",
                              ),
                              parameters=str(
                                  doc.get(
                                      "parameters",
                                      "{}",
                                  )
                              ),
                          )
                      )
                      self._send(
                          201,
                          {
                              "ok": True,
                              "data": scenario,
                          },
                      )
                      return
                  self._send(
                      404,
                      {
                          "ok": False,
                          "error": {
                              "type":
                              "not_found",
                              "message":
                              "unknown api route",
                          },
                      },
                  )

              def _html(
                  self, status: int, html: str,
              ) -> None:
                  body = html.encode("utf-8")
                  self.send_response(status)
                  self.send_header(
                      "Content-Type",
                      "text/html; charset=utf-8",
                  )
                  self.send_header(
                      "Content-Length",
                      str(len(body)),
                  )
                  self.end_headers()
                  self.wfile.write(body)

              def _send(
                  self,
                  status: int,
                  payload: dict[str, Any],
              ) -> None:
                  body = json.dumps(payload).encode(
                      "utf-8"
                  )
                  self.send_response(status)
                  self.send_header(
                      "Content-Type",
                      "application/json",
                  )
                  self.send_header(
                      "Content-Length",
                      str(len(body)),
                  )
                  self.end_headers()
                  self.wfile.write(body)


          class LabServer(ThreadingHTTPServer):
              daemon_threads = True
              allow_reuse_address = True

              def __init__(
                  self,
                  address: tuple[str, int],
              ) -> None:
                  super().__init__(
                      address, LabApiHandler
                  )

              @property
              def bound_port(self) -> int:
                  return int(
                      self.server_address[1]
                  )


          def serve_laboratorio(
              store: LaboratorioStore,
              client: NetworkClient,
              *,
              host: str = "127.0.0.1",
              port: int = 0,
          ) -> LabServer:
              LabApiHandler.store = store
              LabApiHandler.link = LaboratorioLink(
                  client
              )
              return LabServer((host, port))
          PYEOF
          python -m py_compile apps/laboratorio/server.py
          echo "server written"

