# ============================================================
# ZYRA REV F v11 - parche del nucleo del registro ZID (todo-o-nada)
#
# Corrige los 3 errores reportados desde el telefono:
#
#   1) LA GUIA VERDE NO DETECTABA EL DOCUMENTO: ahora hay busqueda
#      REAL de las 4 esquinas (componentes conectados + cuadrilatero
#      convexo + proporcional a un documento). El contorno verde
#      SIGUE al documento, avisa "acercate / poca luz / no nitido /
#      reflejo", y cuando las esquinas se sostienen quietas hace
#      CAPTURA AUTOMATICA con cuenta atras 3-2-1. Si el documento
#      llena todo el cuadro, entra por nitidez+luz tambien.
#   2) LA SELFIE NO BUSCABA EL ROSTRO: ahora hay motor facial EN
#      VIVO (face-api.js con 68 puntos): detecta tu cara de verdad,
#      mide centro, tamano, inclinacion, giro, ojos abiertos, luz y
#      nitidez; el ovalo se pone verde con progreso circular y hace
#      captura automatica con cuenta atras; luego COMPARA tu selfie
#      con la cara de la foto del documento (umbral 0.60, fail-
#      closed: sin comparacion no hay ZID).
#   3) AL FINAL DECIA "FALTA LA FOTO FRONTAL" Y NO CREABA EL ZID:
#      el envio final ya no re-evalua nada que ya paso. Verifica
#      SOLO las banderas de cada paso, corrigiendo el nombre contra
#      el texto YA leido (sin repetir fotos), y muestra "creando tu
#      ZID". Cambiar el tipo de documento igual al actual ya NO
#      borra lo verificado; si el nombre cambia, se revalida contra
#      el documento fotografiado en vez de reiniciar todo.
#
#   EXTRA contra la mala lectura del OCR ("OST", "ZELAVA", vacio):
#   el OCR ahora hace 3 pases (imagen mejorada gris+contraste+
#   enfoque, recorte superior con PSM bloque, original) y elige el
#   mejor por coincidencia; si aun asi no coincide, muestra lo
#   leido y permite CONFIRMAR corrigiendo solo letras equivocadas
#   (guardarrailes: no se aceptan palabras ajenas al documento).
#   El nucleo viaja en ASCII puro (adios mojibake "leA:").
#
# COMO USAR:
#   1) GitHub > Add file > Upload files y sube ESTE archivo tal cual a
#      .github/workflows/zyra-rev-f.yml (reemplaza el anterior).
#   2) Actions > ZYRA REV F - registro ZID > Run workflow.
#   3) Verde = publicado (Render despliega en 1-2 min). Prueba en el
#      telefono abriendo el registro DE NUEVO (recarga la pagina).
#   4) Si algo falla, pega el Resumen (Summary) del run en el chat.
#
# Si el archivo llega con UN caracter danado, el run lo REPARA solo
# verificando por SHA y publica igual. Si el dano es mayor, no publica
# nada y dice el motivo exacto (regla todo-o-nada).
# ============================================================
