# ============================================================
# ZYRA REV F v14 - parche del nucleo del registro ZID (todo-o-nada)
#
# Corrige lo reportado desde el telefono en las ultimas pruebas:
#
#   1) FOTO POCO NITIDA PARA EL OCR: la captura bajaba a 1024px y el
#      nombre quedaba pequeno ("ZRLAYA", "JOSE ZELAYA" a medias).
#      Ahora el documento se captura a 1600px con mejor JPEG y la
#      imagen que llega al OCR se agranda hasta 2600px, con un pase
#      EXTRA de texto disperso (PSM 11) para los campos sueltos.
#   2) LA GUIA NO AGARRABA EL CUADRO SOBRE TELA DE COLOR: en gris, una
#      tela rosa/roja clara se ve casi igual que la tarjeta y el umbral
#      de brillo no las separa. Ahora hay mascara por SATURACION (la
#      tarjeta es clara y poco saturada; la tela de color brilla) y si
#      esa via no da un cuadrilatero valido, cae al umbral de siempre.
#   3) CON EL CUADRO LLENO OBLIGABA A TOCAR CAPTURAR: ahora tambien
#      captura SOLO con cuenta atras 3-2-1 cuando hay luz y nitidez.
#   4) EL PANEL DE LECTURA ERA UN CALLEJON SIN SALIDA: si el OCR habia
#      saltado una palabra (ej. no leyo ALFONSO), el guardarrail
#      rechazaba tu correccion aunque escribieras tus nombres
#      verdaderos y el panel volvia SIEMPRE. Ahora tu nombre del
#      paso 1 manda: se acepta la correccion que guarde alguna
#      relacion con lo leido y se rechaza solo lo ajeno al documento.
#
#   CONSERVA todo lo de v13: busqueda REAL de las 4 esquinas, motor
#   facial EN VIVO (face-api.js, 68 puntos) con comparacion selfie vs
#   documento (fail-closed), lectura confirmable, envio fail-closed que
#   crea el ZID, anti-bloqueo del codigo legado que dice "Falta la foto
#   frontal (paso 2)" y boton "i" de diagnostico en vivo.
#
# COMO USAR:
#   1) GitHub > Add file > Upload files y sube ESTE archivo tal cual a
#      .github/workflows/zyra-rev-f.yml (reemplaza el anterior).
#   2) Actions > ZYRA REV F - registro ZID > Run workflow.
#   3) Verde = publicado (Render despliega en 1-2 min). Prueba en el
#      telefono abriendo el registro DE NUEVO (recarga la pagina).
#   4) Si algo falla, pega el Resumen (Summary) del run en el chat.
#
# Si el archivo llega con UN caracter danado, el run lo REPARA solo
# verificando por SHA y publica igual. Si el dano es mayor, no publica
# nada y dice el motivo exacto (regla todo-o-nada).
# ============================================================
