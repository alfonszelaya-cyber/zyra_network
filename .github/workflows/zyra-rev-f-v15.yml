# ============================================================
# ZYRA REV F v15 - parche del nucleo del registro ZID (todo-o-nada)
#
# Corrige lo reportado desde el telefono el 9/11 (con capturas):
#
#   1) LA FOTO DEL DOCUMENTO SALIA CON TODO EL FONDO: ahora la captura
#      SE RECORTE al cuadro de la guia: si hay 4 esquinas, recorta el
#      documento con margen del 4%; si solo hay caja aproximada, recorta
#      esa caja; y si nada detecto, recorta el marco central. La foto
#      que se guarda y se envia es SOLO EL DOCUMENTO (como el ejemplo
#      enviado), y el OCR recibe el documento llenando la imagen
#      completa: lee mucho mejor aun con poca luz.
#   2) LA SELFIE ERA DE MEDIO CUERPO Y NO RECONOCIA LA CARA: ahora se
#      detecta tu cara y se recorta SOLO EL ROSTRO (foto de cara, no
#      medio cuerpo) con margen de cabeza y hombros, y la comparacion
#      usa la mayor resolucion (512). El ovalo es mas permisible: tu
#      cara vale desde 30% del ovalo, centrado y giro tolerantes; y si
#      estas lejos te lo dice CLARO antes de capturar.
#   3) LECTURA FUERTE CON POCA LUZ: si la foto sale oscura se ACLARA con
#      gamma extra antes del OCR, y los umbrales de luz/nitidez para
#      detectar y capturar bajaron (luz 48, nitidez 34; mascara
#      anti-tela mas permisible). La guia agarra con menos luz.
#   4) LA SELFIE NUNCA TE REGRESA AL PASO 2: antes, al agotar 3 intentos
#      te devolvia al paso 2 y perdias el avance (el loop de 1 mes).
#      Ahora: 5 intentos y al agotarse SIGUES en el paso 4 con todo
#      intacto; solo repites la selfie cuando quieras.
#   5) SI FALLA LA COMPARACION te lo dice con la distancia y puedes
#      reintentar sin castigo: tus fotos del documento se conservan.
#
#   CONSERVA todo lo de v14 y v13: busqueda REAL de las 4 esquinas con
#   mascara anti-tela, auto-captura con cuenta atras (esquinas o cuadro
#   lleno), motor facial EN VIVO (face-api.js, 68 puntos), OCR
#   multi-pase con PSM 11 y panel de lectura sin callejon, envio
#   fail-closed que crea el ZID, anti-bloqueo del codigo legado que
#   dice "Falta la foto frontal (paso 2)" y boton "i" de diagnostico.
#
#   VERIFICACION RAPIDA de que v15 esta vivo en el telefono: el titulo
#   de la pestana termina en "REV F v15" y el boton "i" (abajo a la
#   derecha) dice "nucleo: REV F v15 activo". Si no lo dice, el run no
#   se ejecuto o Render aun no despliega.
#
# COMO USAR:
#   1) GitHub > Add file > Upload files y sube ESTE archivo tal cual a
#      .github/workflows/zyra-rev-f.yml (reemplaza el anterior).
#   2) Actions > ZYRA REV F - registro ZID > Run workflow.
#   3) Verde = publicado (Render despliega en 1-2 min). Prueba en el
#      telefono abriendo el registro DE NUEVO (recarga la pagina).
#   4) Si algo falla, pega el Resumen (Summary) del run en el chat.
#
# Si el archivo llega con UN caracter danado, el run lo REPARA solo
# verificando por SHA y publica igual. Si el dano es mayor, no publica
# nada y dice el motivo exacto (regla todo-o-nada).
# ============================================================
