# ============================================================
# ZYRA REV F v16 - parche del nucleo del registro ZID (todo-o-nada)
#
# Corrige lo reportado el 9-10/11 con captura: "sigue teniendo
# problemas para reconocer nombres" y "pase todos los filtros, llegue
# a crear ZID, le di OK y me tiro de nuevo al registro a empezar de
# nuevo". ESAS DOS COSAS ESTABAN ENCADENADAS y ahora quedan asi:
#
#   1) EL MOTOR DE NOMBRES AHORA SI IDENTIFICA TU NOMBRE:
#      - basta que UNA de tus 2 palabras este bien leida en el
#        documento (antes, con MRZ presente, exigia TODAS);
#      - tolera las confusiones tipicas del OCR (O/0/Q/D, 1/I/L/T,
#        5/S/Z, 8/B, 6/G, 2/Z, V/U, R/L, M/N/H, P/F);
#      - el MRZ parcial del reverso (ej. leyo "MIRA JOSE ALFONSO" sin
#        tu apellido) YA NO te manda al paso 1;
#      - si aun asi difiere, el aviso es AMBAR y no rojo, y puedes
#        seguir (tu nombre confirmado en el paso 2 manda).
#   2) EL REVERSO YA NO VALIDA EL NOMBRE (el nombre se cierra en el
#      paso 2 con el frente y su panel de lectura confirmable).
#   3) NADIE TE REGRESA AL PASO 1 A EMPEZAR DE NUEVO:
#      - el boton final de crear ZID ya NO re-valida el nombre (era el
#        rebote exacto que reportaste);
#      - guardia anti-patada: si el codigo legado te tira hacia atras
#        sin que hayas tocado Volver, el salto se cancela y vuelves a
#        tu paso con todo intacto;
#      - editar tu nombre nunca te mueve de paso.
#   4) RESPALDO AUTOMATICO EN TU TELEFONO (localStorage): nombre,
#      tipo, fotos y paso. Si la pagina se recarga o el servidor
#      devuelve el formulario, al volver SIGUES donde ibas con tus
#      fotos. Se borra a las 24 horas o al crear el ZID.
#   5) REENVIO PROTEGIDO: si el servidor ya devolvio el formulario una
#      vez, el siguiente envio va por fetch sin recargar la pagina;
#      si insiste, te quedas en el paso 5 con TODO y la respuesta
#      cruda queda visible en el panel "i".
#   6) CORRECCION GRAVE heredada: el barrido de mensajes rojos podia
#      BORRAR EL FORMULARIO del paso 5 (con su boton de crear el ZID)
#      justo cuando todo estaba listo. Ahora los contenedores con
#      formulario/inputs/botones nunca se tocan.
#
#   CONSERVA todo lo de v13+v14+v15: 4 esquinas con mascara anti-tela,
#   foto del documento recortada al cuadro, auto-captura, motor facial
#   EN VIVO, selfie de rostro (no medio cuerpo), lectura fuerte con
#   poca luz, OCR multi-pase con panel de lectura confirmable, envio
#   fail-closed, anti-bloqueo legado y boton "i" de diagnostico.
#
#   VERIFICACION RAPIDA de que v16 esta vivo en el telefono: el titulo
#   de la pestana termina en "REV F v16" y el boton "i" (abajo a la
#   derecha) dice "nucleo: REV F v16 activo". Si no lo dice, el run no
#   se ejecuto o Render aun no despliega.
#
# COMO USAR:
#   1) GitHub > Add file > Upload files y sube ESTE archivo tal cual a
#      .github/workflows/zyra-rev-f.yml (reemplaza el anterior).
#   2) Actions > ZYRA REV F - registro ZID > Run workflow.
#   3) Verde = publicado (Render despliega en 1-2 min). Prueba en el
#      telefono abriendo el registro DE NUEVO (recarga la pagina).
#   4) Si algo falla, pega el Resumen (Summary) del run en el chat.
#
# Si el archivo llega con UN caracter danado, el run lo REPARA solo
# verificando por SHA y publica igual. Si el dano es mayor, no publica
# nada y dice el motivo exacto (regla todo-o-nada).
# ============================================================
