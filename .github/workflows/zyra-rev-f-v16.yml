    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Diagnostico previo (solo lectura)
        run: |
          echo "== superapp.py en el repo (todas las copias) =="
          (git ls-files | grep -i "superapp.py$" || true)
          for f in $(git ls-files | grep -i "superapp.py$" || true); do
            echo "-- $f: $(wc -c < "$f") bytes | BEGIN=$(grep -c "ZYRA-V6-BEGIN" "$f" || true) END=$(grep -c "ZYRA-V6-END" "$f" || true)"
          done
          if [ -f superapp.py ]; then sha256sum superapp.py; fi

      - name: Parchear superapp.py (todo o nada)
        run: |
          python3 - <<'PYEOF'
          import base64, gzip, hashlib, os, re, shutil, sys, traceback, py_compile
          from pathlib import Path

          B = '/*ZYRA-V6-BEGIN*/'
          E = '/*ZYRA-V6-END*/'
          SHA_GZ = '8deeedc74bc44d3fa0c63cb04840e51c10f75d74462a4cef168cc82c1d3f337e'
          LARGO_GZ = 44676
          SHA_JS = 'abe5436030a242e8ef0d194513823f99bbb23452064c7b3fbc529fe15fc87505'
          LARGO_JS = 109424
          LARGO_PLANO = 145900

          RES = []

          def say(s):
              s = str(s)
              RES.append(s)
              print(s, flush=True)
              try:
                  p = os.environ.get('GITHUB_STEP_SUMMARY')
                  if p:
                      d = os.path.dirname(p)
                      if d and not os.path.isdir(d):
                          os.makedirs(d, exist_ok=True)
                      with open(p, 'a', encoding='utf-8') as f:
                          f.write(s.rstrip() + '\n')
              except Exception:
                  pass

          def fail(msg):
              say('')
              say('ERROR: ' + msg)
              say('')
              say('NO SE PUBLICO NADA (regla todo-o-nada). Pega este Resumen completo en el chat.')
              sys.exit(1)

          ALFA64 = b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/='

          def repair_core(s):
              # Repara UN solo caracter danado del nucleo, guiado por el SHA:
              # solo acepta un candidato cuyo SHA256 coincida EXACTAMENTE con SHA_GZ.
              # Si el dano es mayor, no inventa nada y aborta.
              if not re.fullmatch(r'[A-Za-z0-9+/=]*', s):
                  return None, 'el nucleo tiene caracteres que no son base64'
              objetivo = bytes.fromhex(SHA_GZ)
              sb = s.encode('ascii')
              n = len(sb)
              if n == LARGO_GZ - 1:
                  for p in range(n + 1):
                      pre, suf = sb[:p], sb[p:]
                      for c in ALFA64:
                          cand = pre + bytes([c]) + suf
                          if hashlib.sha256(cand).digest() == objetivo:
                              return cand.decode('ascii'), 'faltaba 1 caracter en la posicion ' + str(p) + ' (reconstruido y verificado por SHA)'
                  return None, 'falta 1 caracter pero ninguna letra lo reconstruye (dano mayor)'
              if n == LARGO_GZ + 1:
                  for p in range(n):
                      cand = sb[:p] + sb[p + 1:]
                      if hashlib.sha256(cand).digest() == objetivo:
                          return cand.decode('ascii'), 'sobraba 1 caracter en la posicion ' + str(p) + '(eliminado y verificado por SHA)'
                  return None, 'sobra 1 caracter pero ninguna eliminacion lo reconstruye (dano mayor)'
              if n == LARGO_GZ:
                  for p in range(n):
                      pre, suf = sb[:p], sb[p + 1:]
                      for c in ALFA64:
                          cand = pre + bytes([c]) + suf
                          if hashlib.sha256(cand).digest() == objetivo:
                              return cand.decode('ascii'), 'habia 1 caracter equivocado en la posicion ' + str(p) + ' (corregido y verificado por SHA)'
                  return None, 'el largo es correcto pero el dano es de mas de 1 caracter'
              return None, 'el largo es correcto pero el dano es de mas de 1 caracter'

          def main():
              say('## ZYRA REV F v16 - parche del nucleo de registro ZID (todo-o-nada)')
              say('')
              say('### 0) Integridad del nucleo recibido')
              gz = re.sub(r'\s+', '', os.environ.get('NUC', ''))
              say('- Nucleo comprimido recibido: ' + str(len(gz)) + ' chars (esperado ' + str(LARGO_GZ) + ')')
              integro = False
              try:
                  integro = (len(gz) == LARGO_GZ and hashlib.sha256(gz.encode('ascii')).hexdigest() == SHA_GZ)
              except Exception:
                  integro = False
              if not integro:
                  say('- No coincide con el nucleo original; intento de reparacion automatica (1 caracter, ~10 seg)...')
                  fija, como = repair_core(gz)
                  if fija is None:
                      fail('EL YAML LLEGO DANADO Y NO SE PUDO REPARAR (' + como + '). Solucion: sube el archivo .yml ENTERO con "Add file > Upload files"; no lo abras, no lo edites y no lo copies/pegues.')
                  say('- REPARADO: ' + como)
                  gz = fija
              try:
                  js = gzip.decompress(base64.b64decode(gz)).decode('utf-8')
              except Exception as e:
                  fail('No pude decodificar el nucleo (%r): el YAML llego cortado. Sube el .yml con Upload files.' % e)
              if len(js) != LARGO_JS or hashlib.sha256(js.encode('utf-8')).hexdigest() != SHA_JS:
                  fail('El nucleo decodificado no coincide con lo esperado.')
              for req in ('ZYRA-REVF', 'function detectarLado', 'function simNombres', 'function mrzNombres', 'function verificar', 'detectarDocBox', 'detectarDocQuad', 'quadEstable', 'buscarCaraViva', 'evaluaCara', 'ocrMulti', 'ocrFrente', 'abrirConfirmacionLectura', 'edicionAceptable', 'function nombreCoincide', 'mejorarImagen', 'function todoOkParaCrear', 'function limpiaLegado', 'function preemptEnvio', 'function panelDiag', 'function barreMensajes', 'zyDiag16', "psm:'11'", 'resultadoDeMascara', 'function capturarVideoDoc', 'function recorteRostro', 'function cajaDeQuad', 'rostroRecortado', 'function respalda', 'function rescatar', 'function enviarPorFetch', 'zyRebotes16', 'zyRespaldoF16', 'zyUltimaRespuesta16', 'EST.pasoMax=n', 'function botonIrPaso1', 'guardia anti-patada', 'CONF_OCR'):
                  if req not in js:
                      fail('Falta en el nucleo: ' + req)
              if any(ord(c) > 127 for c in js):
                  fail('El nucleo tiene caracteres no-ASCII: el navegador los rompe (mojibake).')
              say('- Integridad del nucleo: OK (SHA ' + SHA_JS[:16] + '..., ASCII puro sin mojibake)')
              say('- Contenido v16: motor de nombres que SI identifica tu nombre (1 palabra bien leida basta, confusiones OCR toleradas, MRZ parcial sin castigo) + el reverso ya no valida el nombre + nadie te regresa al paso 1 (guardia anti-patada) + respaldo automatico en tu telefono + reenvio protegido tras rebote + barrido de mensajes rojos que ya no borra el formulario + todo lo de v15 (foto recortada al cuadro, selfie de rostro, lectura con poca luz, ovalo permisible, envio fail-closed, anti-bloqueo legado, diagnostico en vivo)')

              say('')
              say('### 1) Localizar superapp.py (tolera copias multiples)')
              cands = sorted(str(p) for p in Path('.').rglob('superapp.py') if '.git' not in p.parts)
              say('- Copias de superapp.py en el repo: ' + (', '.join(cands) if cands else 'NINGUNA'))
              if not cands:
                  fail('No encontre superapp.py en el repositorio.')
              marcadas = []
              for c in cands:
                  try:
                      t = Path(c).read_text(encoding='utf-8')
                  except Exception as e:
                      say('- aviso: no pude leer ' + c + ' (' + str(e)[:80] + ')')
                      continue
                  if (B in t) and (E in t):
                      marcadas.append((c, t))
              if len(marcadas) == 0:
                  fail('Ningun superapp.py tiene los marcadores ' + B + ' ... ' + E + '. Pega el Resumen del inspector.')
              if len(marcadas) > 1:
                  fail('Varias copias tienen marcadores: ' + ', '.join(c for c, _t in marcadas) + '. Pega este Resumen en el chat y lo ajusto.')
              ruta, src = marcadas[0]
              say('- Archivo elegido: ' + ruta)

              say('')
              say('### 2) Verificaciones del archivo (antes de tocar nada)')
              if src.count(B) != 1 or src.count(E) != 1:
                  fail('Los marcadores no son unicos: BEGIN=%d END=%d' % (src.count(B), src.count(E)))
              i = src.index(B)
              j = src.index(E)
              if j <= i:
                  fail('Los marcadores estan en orden incorrecto.')
              old = src[i + len(B):j]
              pre = src[:i + len(B)]
              post = src[j:]
              say('- Linea del bloque marcado: ' + str(src[:i].count('\n') + 1))
              m = re.fullmatch(r"\s*eval\(atob\((['\"])([A-Za-z0-9+/=]*)\1\)\)\s*", old, re.S)
              if m:
                  oldc = m.group(2)
                  estilo = 'comillas simples' if m.group(1) == "'" else 'comillas dobles'
                  say('- Formato detectado: eval(atob(...)) con ' + estilo + '. Nucleo anterior: ' + str(len(oldc)) + ' chars base64')
                  if len(oldc) < 100:
                      fail('El contenido actual entre marcadores parece vacio (%d chars).' % len(oldc))
              else:
                  viejo = re.sub(r'\s+', '', old)
                  if re.fullmatch(r'[A-Za-z0-9+/=]*', viejo) and len(viejo) >= 100:
                      oldc = viejo
                      say('- Formato detectado: base64 puro entre marcadores (' + str(len(viejo)) + ' chars).')
                  else:
                      say('- Contenido inesperado entre marcadores (' + str(len(old)) + ' chars), empieza con: ' + repr(old[:60]))
                      fail('No reconozco el contenido entre los marcadores; aborto para no romper nada. Pega este Resumen en el chat.')
              try:
                  py_compile.compile(str(ruta), cfile='/tmp/zyra_base.pyc', doraise=True)
              except Exception as e:
                  fail('El superapp.py actual no compila: ' + str(e)[:200])
              say('- py_compile del archivo actual: OK')

              plano = base64.b64encode(js.encode('utf-8')).decode('ascii')
              if len(plano) != LARGO_PLANO:
                  fail('El nucleo re-codificado mide ' + str(len(plano)) + ' y debe medir ' + str(LARGO_PLANO) + '.')
              ya = False
              try:
                  viejo_js = base64.b64decode(oldc)
                  ya = hashlib.sha256(viejo_js).hexdigest() == SHA_JS
              except Exception:
                  ya = False
              if oldc == plano or ya:
                  say('')
                  say('RESULTADO: REV F v16 YA ESTABA APLICADA en ' + ruta + '. No se toca nada (run idempotente).')
                  sys.exit(0)

              say('')
              say('### 3) Aplicar el parche (solo el bloque marcado; resto byte a byte)')
              if m:
                  inner = 'eval(atob(' + m.group(1) + plano + m.group(1) + '))'
              else:
                  inner = plano
              nuevo = pre + inner + post
              if not (nuevo.startswith(pre) and nuevo.endswith(post)):
                  fail('Fallo la conservacion fuera del bloque.')
              tmp = Path('/tmp/zyra_superapp_new.py')
              tmp.write_text(nuevo, encoding='utf-8')
              try:
                  py_compile.compile(str(tmp), cfile='/tmp/zyra_new.pyc', doraise=True)
              except Exception as e:
                  fail('El archivo parcheado no compila: ' + str(e)[:200])
              shutil.copyfile(str(tmp), str(ruta))
              say('- Conservacion fuera del bloque: OK (byte a byte)')
              say('- py_compile del archivo parcheado: OK')

              say('')
              say('### 4) Resultado')
              for l in (
                  '- Archivo parcheado: `' + ruta + '`',
                  '- Nucleo nuevo: ' + str(len(plano)) + ' chars base64 / ' + str(len(js)) + ' chars JS',
                  '- SHA256 del JS nuevo: `' + SHA_JS + '`',
                  '- Resultado: PATCH_OK',
              ):
                  say(l)
              say('')
              say('PATCH_OK')

          def start():
              try:
                  main()
              except SystemExit:
                  raise
              except Exception:
                  try:
                      say('')
                      say('ERROR INESPERADO. Traza completa:')
                      say(traceback.format_exc())
                      say('NO SE PUBLICO NADA (regla todo-o-nada).')
                  except Exception:
                      pass
                  sys.exit(1)

          start()
          PYEOF

