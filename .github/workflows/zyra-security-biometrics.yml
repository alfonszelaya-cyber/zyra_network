name: ZYRA Security Biometrics

on:
  push:
    branches:
      - main
    paths:
      - "shared_engines/security/**"
      - ".github/workflows/zyra-security-biometrics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  biometrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install cryptography

      - name: Run biometrics tests
        run: python -m shared_engines.security.biometrics -v

      - name: Result
        if: always()
        run: echo "Biometrics validation finished"
