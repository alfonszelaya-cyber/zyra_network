# ZYRA Security Biometrics (REP) — additive workflow.
# Does NOT modify zyra-modulo-01.yml or any existing file.
# Validates the security biometrics structure and runs the
# anti-fraud test suite on every push affecting security.
name: ZYRA Security Biometrics

on:
  push:
    branches: [main]
    paths:
      - 'shared_engines/security/**'
      - '.github/workflows/zyra-security-biometrics.yml'
  workflow_dispatch:

jobs:
  biometrics-security:
    name: Biometrics module — structure + anti-fraud tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify biometrics module is present
        run: |
          test -f shared_engines/security/biometrics.py || {
            echo "::error::shared_engines/security/biometrics.py is missing"
            exit 1
          }
          echo "biometrics.py found:"
          wc -l shared_engines/security/biometrics.py

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install cryptography

      - name: Run biometrics test suite (8 tests)
        run: python -m shared_engines.security.biometrics -v

      - name: Integration smoke test (file-backed SQLite)
        run: |
          python - <<'PY'
          import os, tempfile
          from shared_engines.storage.database import SQLiteAdapter
          from shared_engines.common.clocks import SystemClock
          from shared_engines.security.biometrics import (
              BiometricsEngine, TemplateCipher,
              DeterministicTestProvider, BiometricsPolicy,
              CASE_APPROVED, CASE_REJECTED,
          )

          with tempfile.TemporaryDirectory() as tmp:
              db = SQLiteAdapter(os.path.join(tmp, "smoke.db"))
              engine = BiometricsEngine(
                  db=db,
                  clock=SystemClock(),
                  audit=lambda **kw: None,
                  provider=DeterministicTestProvider(),
                  cipher=TemplateCipher(master_key_hex="ab" * 32),
                  policy=BiometricsPolicy(require_liveness=False),
              )
              case = engine.submit_case(
                  display_name="Smoke User",
                  actor="ci",
                  doc_image=b"doc",
                  selfie_image=b"doc",
              )
              assert case.status == CASE_APPROVED, case.status
              fraud = engine.submit_case(
                  display_name="Impostor",
                  actor="ci",
                  doc_image=b"fake-doc",
                  selfie_image=b"doc",
              )
              assert fraud.status == CASE_REJECTED, fraud.status
              assert fraud.result.duplicate_of is not None
              print("SMOKE OK: enrollment approved, duplicate face with fake document REJECTED")
          PY

      - name: Summary
        if: always()
        run: |
          echo "## ZYRA Security Biometrics" >> $GITHUB_STEP_SUMMARY
          echo "Security validation finished." >> $GITHUB_STEP_SUMMARY
          echo "- Anti-fraud 1:N duplicate detection: tested" >> $GITHUB_STEP_SUMMARY
          echo "- Template sealing (AES-256-GCM): tested" >> $GITHUB_STEP_SUMMARY
          echo "- Persistence (file-backed SQLite): tested" >> $GITHUB_STEP_SUMMARY
