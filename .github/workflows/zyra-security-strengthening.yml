name: ZYRA Security Strengthening

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  security:
    name: Security Strengthening
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify security target files are new
        shell: bash
        run: |
          set -euo pipefail

          files=(
            "shared_engines/identity_proofing/__init__.py"
            "shared_engines/identity_proofing/contracts.py"
            "shared_engines/identity_proofing/engine.py"
            "shared_engines/security/service_boundary.py"
            "shared_engines/security/tests/test_security_strengthening.py"
          )

          for file in "${files[@]}"; do
            if [ -e "$file" ]; then
              echo "ERROR: File already exists: $file"
              echo "Nothing will be overwritten."
              exit 1
            fi
          done

      - name: Create Identity Proofing
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p shared_engines/identity_proofing

          cat > shared_engines/identity_proofing/__init__.py <<'PY'
          from .contracts import (
              AssuranceLevel,
              BiometricKind,
              DocumentCheck,
              DocumentStatus,
              ProofingDecision,
              ProofingRequest,
              ProofingResult,
          )

          from .engine import IdentityProofingEngine

          __all__ = [
              "AssuranceLevel",
              "BiometricKind",
              "DocumentCheck",
              "DocumentStatus",
              "ProofingDecision",
              "ProofingRequest",
              "ProofingResult",
              "IdentityProofingEngine",
          ]
          PY

          cat > shared_engines/identity_proofing/contracts.py <<'PY'
          from __future__ import annotations

          from dataclasses import dataclass, field
          from enum import Enum
          from typing import Optional


          class AssuranceLevel(str, Enum):
              UNVERIFIED = "unverified"
              BASIC = "basic"
              VERIFIED = "verified"
              HIGH = "high"


          class BiometricKind(str, Enum):
              FACE = "face"
              IRIS = "iris"


          class DocumentStatus(str, Enum):
              NOT_CHECKED = "not_checked"
              AUTHENTIC = "authentic"
              INVALID = "invalid"
              REJECTED = "rejected"


          class ProofingDecision(str, Enum):
              REJECT = "reject"
              REVIEW = "review"
              ACCEPT = "accept"


          @dataclass(frozen=True)
          class DocumentCheck:
              document_type: str
              issuer: str
              document_fingerprint: str
              authentic: bool = False
              attributes_verified: bool = False
              issuer_verified: bool = False
              tamper_detected: bool = False


          @dataclass(frozen=True)
          class ProofingRequest:
              subject_zid: str
              document: DocumentCheck
              biometric_kind: Optional[BiometricKind] = None
              biometric_match: bool = False
              liveness_passed: bool = False
              duplicate_identity_detected: bool = False
              source_reference: Optional[str] = None


          @dataclass(frozen=True)
          class ProofingResult:
              decision: ProofingDecision
              assurance: AssuranceLevel
              document_status: DocumentStatus
              reasons: tuple[str, ...] = field(default_factory=tuple)
              evidence_digest: str = ""
          PY

          cat > shared_engines/identity_proofing/engine.py <<'PY'
          from __future__ import annotations

          import hashlib
          from dataclasses import asdict

          from .contracts import (
              AssuranceLevel,
              DocumentStatus,
              ProofingDecision,
              ProofingRequest,
              ProofingResult,
          )


          class IdentityProofingEngine:
              VERSION = "1.0.0"

              def evaluate(
                  self,
                  request: ProofingRequest,
              ) -> ProofingResult:

                  if not request.subject_zid.strip():
                      return self._reject(
                          request,
                          DocumentStatus.INVALID,
                          "missing_subject_zid",
                      )

                  document = request.document

                  if not document.document_type.strip():
                      return self._reject(
                          request,
                          DocumentStatus.INVALID,
                          "missing_document_type",
                      )

                  if not document.issuer.strip():
                      return self._reject(
                          request,
                          DocumentStatus.INVALID,
                          "missing_document_issuer",
                      )

                  if not document.document_fingerprint.strip():
                      return self._reject(
                          request,
                          DocumentStatus.INVALID,
                          "missing_document_fingerprint",
                      )

                  if document.tamper_detected:
                      return self._reject(
                          request,
                          DocumentStatus.REJECTED,
                          "document_tampering_detected",
                      )

                  if not document.authentic:
                      return self._reject(
                          request,
                          DocumentStatus.INVALID,
                          "document_authenticity_not_confirmed",
                      )

                  if not document.issuer_verified:
                      return self._reject(
                          request,
                          DocumentStatus.INVALID,
                          "document_issuer_not_verified",
                      )

                  if not document.attributes_verified:
                      return self._reject(
                          request,
                          DocumentStatus.INVALID,
                          "document_attributes_not_verified",
                      )

                  if request.duplicate_identity_detected:
                      return self._reject(
                          request,
                          DocumentStatus.REJECTED,
                          "duplicate_identity_detected",
                      )

                  if request.biometric_kind is None:
                      return self._result(
                          request,
                          ProofingDecision.REVIEW,
                          AssuranceLevel.BASIC,
                          DocumentStatus.AUTHENTIC,
                          ("biometric_binding_not_present",),
                      )

                  if not request.liveness_passed:
                      return self._reject(
                          request,
                          DocumentStatus.REJECTED,
                          "liveness_check_failed",
                      )

                  if not request.biometric_match:
                      return self._reject(
                          request,
                          DocumentStatus.REJECTED,
                          "biometric_match_failed",
                      )

                  return self._result(
                      request,
                      ProofingDecision.ACCEPT,
                      AssuranceLevel.HIGH,
                      DocumentStatus.AUTHENTIC,
                      ("identity_proofing_completed",),
                  )

              def _reject(
                  self,
                  request: ProofingRequest,
                  document_status: DocumentStatus,
                  reason: str,
              ) -> ProofingResult:

                  return self._result(
                      request,
                      ProofingDecision.REJECT,
                      AssuranceLevel.UNVERIFIED,
                      document_status,
                      (reason,),
                  )

              def _result(
                  self,
                  request: ProofingRequest,
                  decision: ProofingDecision,
                  assurance: AssuranceLevel,
                  document_status: DocumentStatus,
                  reasons: tuple[str, ...],
              ) -> ProofingResult:

                  payload = {
                      "version": self.VERSION,
                      "request": asdict(request),
                      "decision": decision.value,
                      "assurance": assurance.value,
                      "document_status": document_status.value,
                      "reasons": reasons,
                  }

                  digest = hashlib.sha256(
                      repr(payload).encode("utf-8")
                  ).hexdigest()

                  return ProofingResult(
                      decision=decision,
                      assurance=assurance,
                      document_status=document_status,
                      reasons=reasons,
                      evidence_digest=digest,
                  )
          PY

      - name: Create Service Boundary
        shell: bash
        run: |
          set -euo pipefail

          cat > shared_engines/security/service_boundary.py <<'PY'
          from __future__ import annotations

          import hashlib
          import hmac
          import secrets
          import time
          from dataclasses import dataclass


          @dataclass(frozen=True)
          class ServiceCredential:
              service_id: str
              audience: str
              issued_at: int
              expires_at: int
              nonce: str
              signature: str


          class ServiceBoundary:
              VERSION = "1"

              def __init__(
                  self,
                  service_id: str,
                  secret: bytes,
              ):
                  if not service_id.strip():
                      raise ValueError(
                          "service_id is required"
                      )

                  if len(secret) < 32:
                      raise ValueError(
                          "service secret must contain at least 32 bytes"
                      )

                  self.service_id = service_id
                  self._secret = bytes(secret)

              def issue(
                  self,
                  audience: str,
                  ttl_seconds: int = 60,
                  now: int | None = None,
              ) -> ServiceCredential:

                  if not audience.strip():
                      raise ValueError(
                          "audience is required"
                      )

                  if not 1 <= ttl_seconds <= 300:
                      raise ValueError(
                          "ttl_seconds must be between 1 and 300"
                      )

                  issued_at = (
                      int(time.time())
                      if now is None
                      else int(now)
                  )

                  expires_at = issued_at + ttl_seconds
                  nonce = secrets.token_urlsafe(32)

                  signature = self._sign(
                      self.service_id,
                      audience,
                      issued_at,
                      expires_at,
                      nonce,
                  )

                  return ServiceCredential(
                      service_id=self.service_id,
                      audience=audience,
                      issued_at=issued_at,
                      expires_at=expires_at,
                      nonce=nonce,
                      signature=signature,
                  )

              def verify(
                  self,
                  credential: ServiceCredential,
                  expected_audience: str,
                  now: int | None = None,
              ) -> bool:

                  if credential.service_id != self.service_id:
                      return False

                  if credential.audience != expected_audience:
                      return False

                  current = (
                      int(time.time())
                      if now is None
                      else int(now)
                  )

                  if credential.issued_at > current:
                      return False

                  if credential.expires_at < current:
                      return False

                  expected = self._sign(
                      credential.service_id,
                      credential.audience,
                      credential.issued_at,
                      credential.expires_at,
                      credential.nonce,
                  )

                  return hmac.compare_digest(
                      credential.signature,
                      expected,
                  )

              def _sign(
                  self,
                  service_id: str,
                  audience: str,
                  issued_at: int,
                  expires_at: int,
                  nonce: str,
              ) -> str:

                  message = "|".join(
                      (
                          self.VERSION,
                          service_id,
                          audience,
                          str(issued_at),
                          str(expires_at),
                          nonce,
                      )
                  ).encode("utf-8")

                  return hmac.new(
                      self._secret,
                      message,
                      hashlib.sha256,
                  ).hexdigest()
          PY

      - name: Create Security Tests
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p shared_engines/security/tests

          cat > shared_engines/security/tests/test_security_strengthening.py <<'PY'
          from shared_engines.identity_proofing import (
              AssuranceLevel,
              BiometricKind,
              DocumentCheck,
              DocumentStatus,
              IdentityProofingEngine,
              ProofingDecision,
              ProofingRequest,
          )

          from shared_engines.security.service_boundary import (
              ServiceBoundary,
          )


          def document():
              return DocumentCheck(
                  document_type="national_id",
                  issuer="authorized_issuer",
                  document_fingerprint="DOC-123",
                  authentic=True,
                  attributes_verified=True,
                  issuer_verified=True,
                  tamper_detected=False,
              )


          def test_high_assurance_identity():
              result = IdentityProofingEngine().evaluate(
                  ProofingRequest(
                      subject_zid="ZID-123",
                      document=document(),
                      biometric_kind=BiometricKind.FACE,
                      biometric_match=True,
                      liveness_passed=True,
                  )
              )

              assert result.decision is ProofingDecision.ACCEPT
              assert result.assurance is AssuranceLevel.HIGH
              assert (
                  result.document_status
                  is DocumentStatus.AUTHENTIC
              )
              assert result.evidence_digest


          def test_fake_document_rejected():
              bad = DocumentCheck(
                  document_type="national_id",
                  issuer="fake",
                  document_fingerprint="FAKE",
                  authentic=False,
                  attributes_verified=False,
                  issuer_verified=False,
                  tamper_detected=True,
              )

              result = IdentityProofingEngine().evaluate(
                  ProofingRequest(
                      subject_zid="ZID-123",
                      document=bad,
                  )
              )

              assert result.decision is ProofingDecision.REJECT


          def test_duplicate_identity_rejected():
              result = IdentityProofingEngine().evaluate(
                  ProofingRequest(
                      subject_zid="ZID-123",
                      document=document(),
                      biometric_kind=BiometricKind.FACE,
                      biometric_match=True,
                      liveness_passed=True,
                      duplicate_identity_detected=True,
                  )
              )

              assert result.decision is ProofingDecision.REJECT


          def test_no_biometric_cannot_be_high():
              result = IdentityProofingEngine().evaluate(
                  ProofingRequest(
                      subject_zid="ZID-123",
                      document=document(),
                  )
              )

              assert result.decision is ProofingDecision.REVIEW
              assert result.assurance is AssuranceLevel.BASIC


          def test_service_boundary():
              boundary = ServiceBoundary(
                  service_id="nexo",
                  secret=b"x" * 32,
              )

              credential = boundary.issue(
                  audience="zyra",
                  ttl_seconds=60,
                  now=1000,
              )

              assert boundary.verify(
                  credential,
                  "zyra",
                  now=1001,
              )


          def test_wrong_audience_rejected():
              boundary = ServiceBoundary(
                  service_id="nexo",
                  secret=b"x" * 32,
              )

              credential = boundary.issue(
                  audience="zyra",
                  ttl_seconds=60,
                  now=1000,
              )

              assert not boundary.verify(
                  credential,
                  "axis",
                  now=1001,
              )


          def test_expired_credential_rejected():
              boundary = ServiceBoundary(
                  service_id="nexo",
                  secret=b"x" * 32,
              )

              credential = boundary.issue(
                  audience="zyra",
                  ttl_seconds=10,
                  now=1000,
              )

              assert not boundary.verify(
                  credential,
                  "zyra",
                  now=1011,
              )


          def test_tampered_credential_rejected():
              boundary = ServiceBoundary(
                  service_id="nexo",
                  secret=b"x" * 32,
              )

              credential = boundary.issue(
                  audience="zyra",
                  ttl_seconds=60,
                  now=1000,
              )

              tampered = type(credential)(
                  service_id=credential.service_id,
                  audience="axis",
                  issued_at=credential.issued_at,
                  expires_at=credential.expires_at,
                  nonce=credential.nonce,
                  signature=credential.signature,
              )

              assert not boundary.verify(
                  tampered,
                  "axis",
                  now=1001,
              )
          PY

      - name: Validate new security code
        shell: bash
        run: |
          set -euo pipefail

          python -m compileall -q \
            shared_engines/identity_proofing \
            shared_engines/security/service_boundary.py \
            shared_engines/security/tests/test_security_strengthening.py

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=8,<9"

      - name: Execute security tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail

          python -m pytest -q \
            shared_engines/security/tests/test_security_strengthening.py

      - name: Verify only security files were added
        shell: bash
        run: |
          set -euo pipefail

          git status --short

          git diff --name-only --exit-code -- \
            . ':!shared_engines/identity_proofing' \
            ':!shared_engines/security/service_boundary.py' \
            ':!shared_engines/security/tests/test_security_strengthening.py' \
            || {
              echo "ERROR: an existing file was modified."
              exit 1
            }

      - name: Commit security strengthening
        shell: bash
        run: |
          set -euo pipefail

          git add \
            shared_engines/identity_proofing/__init__.py \
            shared_engines/identity_proofing/contracts.py \
            shared_engines/identity_proofing/engine.py \
            shared_engines/security/service_boundary.py \
            shared_engines/security/tests/test_security_strengthening.py

          git commit \
            -m "security: add identity proofing and service boundary"

          git push
