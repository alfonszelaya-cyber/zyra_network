<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{titulo}}</title>
<style>
:root{--fondo:#0B1220;--sup:#111A2E;--borde:#1E293B;--texto:#E2E8F0;--suave:#94A3B8;--pri:#2563EB;--pri-h:#1D4ED8;--ok:#059669;--radio:16px;--radio-b:12px}
*{box-sizing:border-box;margin:0;padding:0}
body.lab{background:var(--fondo);color:var(--texto);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;display:flex;min-height:100vh}
aside{width:250px;background:var(--sup);border-right:1px solid var(--borde);padding:20px 14px;flex-shrink:0}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.logo img{width:34px;height:34px;border-radius:8px}
.logo b{font-size:15px;letter-spacing:.4px}
.grupo{margin-bottom:16px}
.grupo-titulo{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--suave);padding:6px 10px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radio-b);color:var(--texto);text-decoration:none;font-size:14px}
.nav-item:hover{background:rgba(37,99,235,.12)}
.nav-item.activo{background:var(--pri);color:#fff}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
main{flex:1;padding:26px 32px;max-width:1200px}
header.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
header.top .rol{font-size:12px;color:var(--suave);border:1px solid var(--borde);padding:5px 12px;border-radius:999px}
.tarjeta{background:var(--sup);border:1px solid var(--borde);border-radius:var(--radio);padding:20px;margin-bottom:18px}
.tarjeta h1{font-size:22px;margin-bottom:8px}
.tarjeta h2{font-size:16px;margin-bottom:12px;font-weight:600}
.acciones{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0}
.btn{font:inherit;font-size:14px;font-weight:600;padding:11px 20px;border-radius:var(--radio-b);border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn-primary{background:var(--pri);color:#fff}
.btn-primary:hover{background:var(--pri-h)}
.btn-ghost{background:transparent;color:var(--suave);border-color:var(--borde);cursor:not-allowed}
.btn-gen{font-size:12px;padding:6px 12px}
.badge{font-size:10px;background:var(--borde);border-radius:6px;padding:2px 6px;margin-left:6px}
.estado{display:inline-block;font-size:12px;color:var(--suave);border:1px solid var(--borde);border-radius:999px;padding:5px 12px;margin-bottom:10px}
.estado.ok{color:#34D399;border-color:var(--ok)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
.tab{font-size:13px;color:var(--suave);text-decoration:none;padding:7px 14px;border-radius:999px;border:1px solid var(--borde)}
.tab.activo{background:var(--pri);color:#fff;border-color:var(--pri)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--suave);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.6px;padding:8px 10px;border-bottom:1px solid var(--borde)}
td{padding:10px;border-bottom:1px solid var(--borde)}
.pill{font-size:12px;background:rgba(37,99,235,.15);color:#93C5FD;border-radius:999px;padding:3px 10px}
.ok{font-size:12px;background:rgba(5,150,105,.2);color:#34D399;border-radius:999px;padding:3px 10px}
.link{color:#93C5FD;text-decoration:none}
.link:hover{text-decoration:underline}
.vacio{color:var(--suave);text-align:center;padding:18px}
.ayuda{color:var(--suave);font-size:13px;line-height:1.5;margin-bottom:4px}
form.lab-form{display:grid;gap:12px;max-width:520px}
form.lab-form input,form.lab-form select,form.lab-form textarea{font:inherit;font-size:14px;background:var(--fondo);color:var(--texto);border:1px solid var(--borde);border-radius:var(--radio-b);padding:10px 12px;width:100%}
form.lab-form textarea{resize:vertical;min-height:120px}
.err{color:#F87171;font-size:13px;min-height:18px}
@media (max-width:820px){aside{width:64px}.nav-item span,.grupo-titulo,.logo b{display:none}.logo{justify-content:center}}
</style>
</head>
<body class="lab" data-zid="{{zid}}" data-roles="{{roles}}">
<aside>
  <div class="logo"><img src="/laboratorio/ui/assets/logo.svg" alt="ZYRA LAB"><b>ZYRA LABORATORIO</b></div>
  {{nav!raw}}
</aside>
<main>
  <header class="top"><span>Acceso por ZYRA SuperApp</span><span class="rol">{{rol_nombre}} · {{zid}}</span></header>
  {{contenido!raw}}
</main>
<script>
function labHeaders(){return {"Content-Type":"application/json","X-ZYRA-ZID":document.body.dataset.zid,"X-ZYRA-ROLES":document.body.dataset.roles}}
function labParseObjetos(txt){return txt.split("\n").map(function(l){return l.trim()}).filter(Boolean).map(function(l){const p=l.split("|").map(function(s){return s.trim()});const capa=p[p.length-1];const esCapa=(capa==="fondo"||capa==="medio"||capa==="frente");function base(o){if(esCapa){o.capa=capa}return o}if(p[0]==="rect"){return base({forma:"rect",color:p[1]||"#2563EB",x:parseFloat(p[2])||0,y:parseFloat(p[3])||0,w:parseFloat(p[4])||80,h:parseFloat(p[5])||40})}if(p[0]==="circle"){return base({forma:"circle",color:p[1]||"#059669",cx:parseFloat(p[2])||100,cy:parseFloat(p[3])||100,r:parseFloat(p[4])||30})}if(p[0]==="texto"){return base({forma:"texto",color:p[1]||"#E2E8F0",x:parseFloat(p[2])||20,y:parseFloat(p[3])||40,contenido:(p[4]||"")})}return null}).filter(Boolean)}
async function labEnviar(ev){ev.preventDefault();const f=ev.target;const cuerpo={titulo:f.titulo.value,descripcion:f.descripcion.value,tipo:f.tipo.value};const r=await fetch("/laboratorio/api/v1/projects",{method:"POST",headers:labHeaders(),body:JSON.stringify(cuerpo)});const j=await r.json().catch(function(){return {}});if(r.status===201&&j.ok){location.reload()}else{document.getElementById("lab-err").textContent=(j.error&&j.error.mensaje)||("HTTP "+r.status)}}
async function labCrearDesdeDocumento(ev){ev.preventDefault();const f=ev.target;const cuerpo={documento:f.documento.value};if(f.titulo_doc.value){cuerpo.titulo=f.titulo_doc.value}if(f.tipo_doc.value){cuerpo.tipo=f.tipo_doc.value}const r=await fetch("/laboratorio/api/v1/documents/create-project",{method:"POST",headers:labHeaders(),body:JSON.stringify(cuerpo)});const j=await r.json().catch(function(){return {}});if(r.status===201&&j.ok){location.reload()}else{document.getElementById("lab-err-doc").textContent=(j.error&&j.error.mensaje)||("HTTP "+r.status)}}
async function labCapturarEntrada(ev){ev.preventDefault();const f=ev.target;const cuerpo={titulo:f.titulo.value,tipo:f.tipo.value,contenido:f.contenido.value};const r=await fetch("/laboratorio/api/v1/projects/"+f.proyecto.value+"/inputs",{method:"POST",headers:labHeaders(),body:JSON.stringify(cuerpo)});const j=await r.json().catch(function(){return {}});if(r.status===201&&j.ok){location.reload()}else{document.getElementById("lab-err-entrada").textContent=(j.error&&j.error.mensaje)||("HTTP "+r.status)}}
async function labCrearBlueprint(ev){ev.preventDefault();const f=ev.target;const lineas=f.componentes.value.split("\n").map(function(l){return l.trim()}).filter(Boolean).map(function(l){const p=l.split("|");return {nombre:(p[0]||"").trim(),tipo:(p[1]||"general").trim(),requisitos:(p[2]||"").trim()}});const cuerpo={nombre:f.nombre.value,tipo:f.tipo.value,componentes:lineas};const r=await fetch("/laboratorio/api/v1/projects/"+f.proyecto.value+"/designs",{method:"POST",headers:labHeaders(),body:JSON.stringify(cuerpo)});const j=await r.json().catch(function(){return {}});if(r.status===201&&j.ok){location.reload()}else{document.getElementById("lab-err-blueprint").textContent=(j.error&&j.error.mensaje)||("HTTP "+r.status)}}
async function labCrearEscena(ev){ev.preventDefault();const f=ev.target;const cuerpo={nombre:f.nombre.value,ancho:parseInt(f.ancho.value)||800,alto:parseInt(f.alto.value)||600,objetos:labParseObjetos(f.objetos.value)};const r=await fetch("/laboratorio/api/v1/projects/"+f.proyecto.value+"/scenes",{method:"POST",headers:labHeaders(),body:JSON.stringify(cuerpo)});const j=await r.json().catch(function(){return {}});if(r.status===201&&j.ok){location.reload()}else{document.getElementById("lab-err-escena").textContent=(j.error&&j.error.mensaje)||("HTTP "+r.status)}}
async function labCrearActivo(ev){ev.preventDefault();const f=ev.target;const cuerpo={nombre:f.nombre.value,tipo:f.tipo.value,contenido:f.contenido.value,etiquetas:f.etiquetas.value.split(",").map(function(s){return s.trim()}).filter(Boolean)};const r=await fetch("/laboratorio/api/v1/assets",{method:"POST",headers:labHeaders(),body:JSON.stringify(cuerpo)});const j=await r.json().catch(function(){return {}});if(r.status===201&&j.ok){location.reload()}else{document.getElementById("lab-err-activo").textContent=(j.error&&j.error.mensaje)||("HTTP "+r.status)}}
async function labCrearTimeline(ev){ev.preventDefault();const f=ev.target;const cuerpo={duracion_s:parseFloat(f.duracion.value)||10,fps:parseInt(f.fps.value)||30,pistas:[{objetivo:"escena",propiedad:"opacidad",keyframes:[{t:0,valor:"1"},{t:(parseFloat(f.duracion.value)||10)/2,valor:"1"},{t:parseFloat(f.duracion.value)||10,valor:"1"}]}]};const r=await fetch("/laboratorio/api/v1/scenes/"+f.escena.value+"/timeline",{method:"POST",headers:labHeaders(),body:JSON.stringify(cuerpo)});const j=await r.json().catch(function(){return {}});if(r.status===201&&j.ok){location.reload()}else{document.getElementById("lab-err-timeline").textContent=(j.error&&j.error.mensaje)||("HTTP "+r.status)}}
async function labCrearLuz(ev){ev.preventDefault();const f=ev.target;const pasos=[];[f.pasos,f.pasos2].forEach(function(inp){const v=inp.value.trim();if(!v){return}const p=v.split("|").map(function(s){return s.trim()});if(p.length>=3){pasos.push({t:parseFloat(p[0])||0,color:p[1],intensidad:parseFloat(p[2])||1})}});pasos.sort(function(a,b){return a.t-b.t});const cuerpo={pasos:pasos,ambientar_fondo:true};const r=await fetch("/laboratorio/api/v1/scenes/"+f.escena.value+"/lighting",{method:"POST",headers:labHeaders(),body:JSON.stringify(cuerpo)});const j=await r.json().catch(function(){return {}});if(r.status===201&&j.ok){location.reload()}else{document.getElementById("lab-err-luz").textContent=(j.error&&j.error.mensaje)||("HTTP "+r.status)}}
async function labCrearInteraccion(ev){ev.preventDefault();const f=ev.target;const cuerpo={titulo:f.titulo.value,x:parseFloat(f.x.value)||0,y:parseFloat(f.y.value)||0,w:parseFloat(f.w.value)||100,h:parseFloat(f.h.value)||100,accion:f.accion.value};const r=await fetch("/laboratorio/api/v1/scenes/"+f.escena.value+"/interactions",{method:"POST",headers:labHeaders(),body:JSON.stringify(cuerpo)});const j=await r.json().catch(function(){return {}});if(r.status===201&&j.ok){location.reload()}else{document.getElementById("lab-err-interaccion").textContent=(j.error&&j.error.mensaje)||("HTTP "+r.status)}}
async function labSimularEvolucion(ev){ev.preventDefault();const f=ev.target;const opt=f.escenario.selectedOptions[0];if(!opt||!opt.value){return}const cuerpo={escenario_id:opt.value,horizonte_anios:parseInt(f.horizonte.value)||5,crecimiento_pct:parseFloat(f.crecimiento.value)||0};const r=await fetch("/laboratorio/api/v1/projects/"+opt.dataset.proyecto+"/simulate",{method:"POST",headers:labHeaders(),body:JSON.stringify(cuerpo)});const j=await r.json().catch(function(){return {}});if(r.status===201&&j.ok){location.reload()}else{document.getElementById("lab-err-simular").textContent=(j.error&&j.error.mensaje)||("HTTP "+r.status)}}
async function labComparar(ev){ev.preventDefault();const f=ev.target;if(!f.proyecto.value){return}const r=await fetch("/laboratorio/api/v1/projects/"+f.proyecto.value+"/compare",{method:"POST",headers:labHeaders()});const j=await r.json().catch(function(){return {}});if(r.status===201&&j.ok){location.reload()}else{document.getElementById("lab-err-comparar").textContent=(j.error&&j.error.mensaje)||("HTTP "+r.status)}}
async function labOptimizar(ev){ev.preventDefault();const f=ev.target;if(!f.escenario.value){return}const r=await fetch("/laboratorio/api/v1/scenarios/"+f.escenario.value+"/optimize",{method:"POST",headers:labHeaders()});const j=await r.json().catch(function(){return {}});if(r.status===201&&j.ok){location.reload()}else{document.getElementById("lab-err-optimizar").textContent=(j.error&&j.error.mensaje)||("HTTP "+r.status)}}
async function labRenderizar(ev){ev.preventDefault();const f=ev.target;if(!f.escena.value){return}const cuerpo={quality:f.calidad.value};const r=await fetch("/laboratorio/api/v1/scenes/"+f.escena.value+"/render",{method:"POST",headers:labHeaders(),body:JSON.stringify(cuerpo)});const j=await r.json().catch(function(){return {}});if(r.status===201&&j.ok){location.reload()}else{document.getElementById("lab-err-render").textContent=(j.error&&j.error.mensaje)||("HTTP "+r.status)}}
async function labCrearPresentacion(ev){ev.preventDefault();const f=ev.target;const cuerpo={titulo:f.titulo.value,pasos:[{escena_id:f.escena.value,duracion_s:parseFloat(f.duracion.value)||5,transicion:"desvanecer",narracion:f.narracion.value}]};const r=await fetch("/laboratorio/api/v1/projects/"+f.proyecto.value+"/presentations",{method:"POST",headers:labHeaders(),body:JSON.stringify(cuerpo)});const j=await r.json().catch(function(){return {}});if(r.status===201&&j.ok){location.reload()}else{document.getElementById("lab-err-presentacion").textContent=(j.error&&j.error.mensaje)||("HTTP "+r.status)}}
async function labSellar(ev){ev.preventDefault();const f=ev.target;if(!f.presentacion.value){return}const r=await fetch("/laboratorio/api/v1/presentations/"+f.presentacion.value+"/seal",{method:"POST",headers:labHeaders()});const j=await r.json().catch(function(){return {}});if(r.status===200&&j.ok){location.reload()}else{document.getElementById("lab-err-sellar").textContent=(j.error&&j.error.mensaje)||("HTTP "+r.status)}}
async function labExportar(ev){ev.preventDefault();const f=ev.target;const cuerpo={tipo:f.tipo.value,destino:f.destino.value};const r=await fetch("/laboratorio/api/v1/projects/"+f.proyecto.value+"/exports",{method:"POST",headers:labHeaders(),body:JSON.stringify(cuerpo)});const j=await r.json().catch(function(){return {}});if(r.status===201&&j.ok){location.reload()}else{document.getElementById("lab-err-exportar").textContent=(j.error&&j.error.mensaje)||("HTTP "+r.status)}}
document.addEventListener("submit",function(e){
  if(!e.target||!e.target.id){return}
  const mapa={"form-proyecto":labEnviar,"form-documento":labCrearDesdeDocumento,"form-entrada":labCapturarEntrada,"form-blueprint":labCrearBlueprint,"form-escena":labCrearEscena,"form-activo":labCrearActivo,"form-timeline":labCrearTimeline,"form-luz":labCrearLuz,"form-interaccion":labCrearInteraccion,"form-simular":labSimularEvolucion,"form-comparar":labComparar,"form-optimizar":labOptimizar,"form-render":labRenderizar,"form-presentacion":labCrearPresentacion,"form-sellar":labSellar,"form-exportar":labExportar};
  if(mapa[e.target.id]){mapa[e.target.id](e)}
});
document.addEventListener("click",function(e){
  const ap=e.target.closest("button[data-aplicar]");
  if(ap){fetch("/laboratorio/api/v1/optimizations/"+ap.dataset.aplicar+"/apply",{method:"POST",headers:labHeaders(),body:JSON.stringify({tipo_destino:"C"})}).then(function(r){return r.json()}).then(function(j){if(j.ok&&j.datos){location.reload()}else{const st=document.getElementById("lab-status");if(st){st.textContent=(j.error&&j.error.mensaje)||("HTTP error")}}}).catch(function(){});return}
  const g=e.target.closest("button[data-generar]");
  if(g){const td=g.closest("td");const sel=td?td.querySelector("select.sel-gen"):null;const formato=sel?sel.value:"imagen";fetch("/laboratorio/api/v1/scenes/"+g.dataset.generar+"/generate",{method:"POST",headers:labHeaders(),body:JSON.stringify({formato:formato})}).then(function(r){return r.json()}).then(function(j){if(j.ok&&j.datos){location.reload()}else{const st=document.getElementById("lab-status");if(st){st.textContent=(j.error&&j.error.mensaje)||("HTTP error")}}}).catch(function(){});return}
  const b=e.target.closest("button[data-accion]");
  if(!b){return}
  fetch("/laboratorio",{headers:labHeaders()}).then(function(r){return r.json()}).then(function(j){const estado=document.getElementById("lab-status");if(estado){estado.textContent="Accion: "+b.dataset.accion+" — sistema activo, "+(j.datos&&j.datos.rutas?j.datos.rutas.length:0)+" rutas registradas"}}).catch(function(){})
});
function labAlternarModo(modo){const a=document.getElementById("modo-form");const b=document.getElementById("modo-doc");if(!a||!b){return}a.style.display=modo==="form"?"block":"none";b.style.display=modo==="doc"?"block":"none"}
</script>
</body>
</html>
