<div id="modo-activo" style="margin-top:6px">
  <form id="form-activo" class="lab-form">
    <p class="ayuda">{{ayuda_activo}}</p>
    <input name="nombre" placeholder="Nombre del activo" maxlength="200" required>
    <select name="tipo" required>
      <option value="texto">texto</option>
      <option value="svg">svg</option>
      <option value="html">html</option>
      <option value="json">json</option>
      <option value="imagen">imagen</option>
    </select>
    <input name="etiquetas" placeholder="Etiquetas separadas por coma: zyra, presentacion">
    <textarea name="contenido" rows="6" placeholder="Contenido del activo" required></textarea>
    <div class="err" id="lab-err-activo"></div>
    <button class="btn btn-primary" type="submit">{{btn_guardar_activo}}</button>
  </form>
</div>
<section class="tarjeta" style="margin-top:14px">
  <h2>Activos guardados (sellados con SHA-256)</h2>
  <table>
    <thead><tr><th>Nombre</th><th>Tipo</th><th>Tamano</th><th>Etiquetas</th><th>Hash</th></tr></thead>
    <tbody>
    {{filas!raw}}
    </tbody>
  </table>
</section>
