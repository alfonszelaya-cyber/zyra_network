<div id="modo-entrada" style="margin-top:6px">
  <form id="form-entrada" class="lab-form">
    <p class="ayuda">{{ayuda_entrada}}</p>
    <select name="proyecto" required>{{opciones_proyectos!raw}}</select>
    <input name="titulo" placeholder="Titulo de la entrada" maxlength="200" required>
    <select name="tipo">{{opciones_tipos!raw}}</select>
    <textarea name="contenido" rows="7" placeholder="{{placeholder_entrada}}" required></textarea>
    <div class="err" id="lab-err-entrada"></div>
    <button class="btn btn-primary" type="submit">{{btn_capturar}}</button>
  </form>
</div>
<section class="tarjeta" style="margin-top:14px">
  <h2>Entradas capturadas (datos reales)</h2>
  <table>
    <thead><tr><th>Titulo</th><th>Tipo</th><th>Contenido</th><th>Accion</th></tr></thead>
    <tbody>
    {{filas!raw}}
    </tbody>
  </table>
</section>
