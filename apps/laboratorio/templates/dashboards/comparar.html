<section class="tarjeta">
  <h2>Comparar escenarios evaluados</h2>
  <form id="form-comparar" class="lab-form">
    <p class="ayuda">{{ayuda_comparar}}</p>
    <select name="proyecto" required>{{opciones_proyectos!raw}}</select>
    <div class="err" id="lab-err-comparar"></div>
    <button class="btn btn-primary" type="submit">{{btn_comparar}}</button>
  </form>
</section>
<section class="tarjeta">
  <h2>Comparaciones con veredicto (datos reales)</h2>
  <table>
    <thead><tr><th>Ganador</th><th>Brecha</th><th>Participantes</th><th>Informe</th></tr></thead>
    <tbody>{{filas!raw}}</tbody>
  </table>
</section>
