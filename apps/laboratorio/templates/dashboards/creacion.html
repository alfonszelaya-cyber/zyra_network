<div id="modo-escena" style="margin-top:6px">
  <form id="form-escena" class="lab-form">
    <p class="ayuda">{{ayuda_escena}}</p>
    <select name="proyecto" required>{{opciones_proyectos!raw}}</select>
    <input name="nombre" placeholder="Nombre de la escena" maxlength="200" required>
    <div style="display:flex;gap:10px">
      <input name="ancho" type="number" value="800" min="16" max="4096" title="Ancho">
      <input name="alto" type="number" value="600" min="16" max="4096" title="Alto">
    </div>
    <textarea name="objetos" rows="5" placeholder="{{placeholder_objetos}}" required></textarea>
    <div class="err" id="lab-err-escena"></div>
    <button class="btn btn-primary" type="submit">{{btn_crear_escena}}</button>
  </form>
</div>
<section class="tarjeta" style="margin-top:14px">
  <h2>Escenas creadas (datos reales)</h2>
  <table>
    <thead><tr><th>Nombre</th><th>Dimensiones</th><th>Objetos</th><th>Generar</th></tr></thead>
    <tbody>
    {{filas_escenas!raw}}
    </tbody>
  </table>
</section>
<section class="tarjeta">
  <h2>Artefactos generados (reales y descargables)</h2>
  <table>
    <thead><tr><th>Nombre</th><th>Formato</th><th>Tamano</th><th>Accion</th></tr></thead>
    <tbody>
    {{filas_artefactos!raw}}
    </tbody>
  </table>
</section>
