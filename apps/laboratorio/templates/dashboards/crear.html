<div class="acciones">
  <button class="btn btn-primary" onclick="labAlternarModo('form')">{{btn_nuevo}}</button>
  <button class="btn btn-ghost" style="color:var(--texto);cursor:pointer" onclick="labAlternarModo('doc')">{{btn_documento}}</button>
  <a class="btn btn-ghost" style="text-decoration:none;color:var(--texto);cursor:pointer" href="/laboratorio/ui/simular">{{btn_simular}}</a>
</div>
<div id="modo-form" style="display:none;margin-top:14px">
  <form id="form-proyecto" class="lab-form">
    <input name="titulo" placeholder="Titulo del proyecto" maxlength="200" required>
    <textarea name="descripcion" placeholder="Descripcion" rows="3" maxlength="2000"></textarea>
    <select name="tipo" required>{{opciones_tipo!raw}}</select>
    <div class="err" id="lab-err"></div>
    <button class="btn btn-primary" type="submit">Crear proyecto</button>
  </form>
</div>
<div id="modo-doc" style="display:none;margin-top:14px">
  <form id="form-documento" class="lab-form">
    <p class="ayuda">{{ayuda_doc}}</p>
    <input name="titulo_doc" placeholder="{{titulo_opcional}}" maxlength="200">
    <select name="tipo_doc"><option value="">{{tipo_auto}}</option>{{opciones_tipo!raw}}</select>
    <textarea name="documento" rows="9" placeholder="{{placeholder_doc}}" required></textarea>
    <div class="err" id="lab-err-doc"></div>
    <button class="btn btn-primary" type="submit">{{btn_crear_doc}}</button>
  </form>
</div>
