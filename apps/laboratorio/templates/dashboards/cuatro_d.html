<p class="ayuda">{{ayuda_4d}}</p>
<div style="display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">
  <section class="tarjeta" style="margin:0">
    <h2>Tiempo</h2>
    <form id="form-timeline" class="lab-form">
      <select name="escena" required>{{opciones_escenas!raw}}</select>
      <div style="display:flex;gap:10px">
        <input name="duracion" type="number" value="10" step="0.1" min="0.1" max="3600" title="Duracion (s)">
        <input name="fps" type="number" value="30" min="1" max="120" title="FPS">
      </div>
      <div class="err" id="lab-err-timeline"></div>
      <button class="btn btn-primary" type="submit">{{btn_timeline}}</button>
    </form>
    <table style="margin-top:10px">
      <thead><tr><th>Escena</th><th>Linea</th><th>Pistas</th></tr></thead>
      <tbody>{{filas_timelines!raw}}</tbody>
    </table>
  </section>
  <section class="tarjeta" style="margin:0">
    <h2>Luz</h2>
    <p class="ayuda">{{ayuda_luz}}</p>
    <form id="form-luz" class="lab-form">
      <select name="escena" required>{{opciones_escenas!raw}}</select>
      <input name="pasos" placeholder="0|#22D3EE|0.8" required>
      <input name="pasos2" placeholder="5|#F59E0B|0.5">
      <div class="err" id="lab-err-luz"></div>
      <button class="btn btn-primary" type="submit">{{btn_luz}}</button>
    </form>
    <table style="margin-top:10px">
      <thead><tr><th>Escena</th><th>Pasos</th><th>Color</th></tr></thead>
      <tbody>{{filas_luces!raw}}</tbody>
    </table>
  </section>
  <section class="tarjeta" style="margin:0">
    <h2>Interaccion</h2>
    <p class="ayuda">{{ayuda_interaccion}}</p>
    <form id="form-interaccion" class="lab-form">
      <select name="escena" required>{{opciones_escenas!raw}}</select>
      <input name="titulo" placeholder="Titulo de la zona" maxlength="200" required>
      <div style="display:flex;gap:8px">
        <input name="x" type="number" value="0" title="X">
        <input name="y" type="number" value="0" title="Y">
        <input name="w" type="number" value="100" title="Ancho">
        <input name="h" type="number" value="100" title="Alto">
      </div>
      <select name="accion">
        <option value="clic">clic</option>
        <option value="seleccion">seleccion</option>
        <option value="zona">zona</option>
        <option value="formulario">formulario</option>
        <option value="camara">camara</option>
      </select>
      <div class="err" id="lab-err-interaccion"></div>
      <button class="btn btn-primary" type="submit">{{btn_interaccion}}</button>
    </form>
    <table style="margin-top:10px">
      <thead><tr><th>Escena</th><th>Zona</th><th>Accion</th><th>Area</th></tr></thead>
      <tbody>{{filas_interacciones!raw}}</tbody>
    </table>
  </section>
</div>
