<div id="modo-blueprint" style="margin-top:6px">
  <form id="form-blueprint" class="lab-form">
    <p class="ayuda">{{ayuda_blueprint}}</p>
    <select name="proyecto" required>{{opciones_proyectos!raw}}</select>
    <input name="nombre" placeholder="Nombre del blueprint" maxlength="200" required>
    <select name="tipo">{{opciones_tipo!raw}}</select>
    <textarea name="componentes" rows="5" placeholder="{{placeholder_componentes}}" required></textarea>
    <div class="err" id="lab-err-blueprint"></div>
    <button class="btn btn-primary" type="submit">{{btn_disenar}}</button>
  </form>
</div>
<section class="tarjeta" style="margin-top:14px">
  <h2>Blueprints creados (datos reales)</h2>
  <table>
    <thead><tr><th>Nombre</th><th>Tipo</th><th>Componentes</th><th>Detalle</th></tr></thead>
    <tbody>
    {{filas!raw}}
    </tbody>
  </table>
</section>
