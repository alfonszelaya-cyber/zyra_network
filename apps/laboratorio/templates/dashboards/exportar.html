<section class="tarjeta">
  <h2>Exportar proyecto</h2>
  <form id="form-exportar" class="lab-form">
    <p class="ayuda">{{ayuda_exportar}}</p>
    <select name="proyecto" required>{{opciones_proyectos!raw}}</select>
    <select name="tipo" required>
      <option value="bundle_verificable">Bundle verificable (ZIP con manifiesto)</option>
      <option value="envio_zyra">Enviar a otra app ZYRA</option>
    </select>
    <select name="destino">
      <option value="">- solo para envio ZYRA -</option>
      <option value="nexo">NEXO</option>
      <option value="agro">AGRO</option>
      <option value="semilla">SEMILLA</option>
      <option value="mpe">MPE</option>
      <option value="axis">AXIS</option>
      <option value="subastas">SUBASTAS</option>
      <option value="ciclo">CICLO-DIGITAL</option>
      <option value="govdata">GOV-DATA</option>
      <option value="superapp">SUPERAPP</option>
    </select>
    <div class="err" id="lab-err-exportar"></div>
    <button class="btn btn-primary" type="submit">{{btn_exportar}}</button>
  </form>
</section>
<section class="tarjeta">
  <h2>Exportaciones (datos reales)</h2>
  <table>
    <thead><tr><th>Tipo</th><th>Destino</th><th>Contenido</th><th>Hash</th></tr></thead>
    <tbody>{{filas!raw}}</tbody>
  </table>
</section>
