<section class="tarjeta">
  <h2>Sugerir optimizacion</h2>
  <form id="form-optimizar" class="lab-form">
    <p class="ayuda">{{ayuda_optimizar}}</p>
    <select name="escenario" required>{{opciones_escenarios!raw}}</select>
    <div class="err" id="lab-err-optimizar"></div>
    <button class="btn btn-primary" type="submit">{{btn_optimizar}}</button>
  </form>
</section>
<section class="tarjeta">
  <h2>Propuestas (datos reales)</h2>
  <table>
    <thead><tr><th>Escenario</th><th>Proyeccion</th><th>Acciones</th><th>Estado</th><th></th></tr></thead>
    <tbody>{{filas!raw}}</tbody>
  </table>
</section>
