<section class="tarjeta">
  <h2>Crear presentacion con pasos reales</h2>
  <form id="form-presentacion" class="lab-form">
    <p class="ayuda">{{ayuda_presentar}}</p>
    <select name="proyecto" required>{{opciones_proyectos!raw}}</select>
    <input name="titulo" placeholder="Titulo de la presentacion" maxlength="200" required>
    <div style="display:flex;gap:10px">
      <select name="escena" required>{{opciones_pasos!raw}}</select>
      <input name="duracion" type="number" value="5" min="1" max="300" title="Duracion del paso (s)">
    </div>
    <input name="narracion" placeholder="Narracion del paso (opcional)" maxlength="300">
    <div class="err" id="lab-err-presentacion"></div>
    <button class="btn btn-primary" type="submit">{{btn_crear_presentacion}}</button>
  </form>
</section>
<section class="tarjeta">
  <h2>Presentaciones (datos reales)</h2>
  <form id="form-sellar" class="lab-form">
    <select name="presentacion" required>{{opciones_presentaciones!raw}}</select>
    <div class="err" id="lab-err-sellar"></div>
    <button class="btn btn-primary" type="submit">{{btn_sellar}}</button>
  </form>
  <table style="margin-top:10px">
    <thead><tr><th>Titulo</th><th>Contenido</th><th>Estado</th><th>Reproducir</th></tr></thead>
    <tbody>{{filas!raw}}</tbody>
  </table>
</section>
