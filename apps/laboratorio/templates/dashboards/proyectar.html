<section class="tarjeta">
  <h2>Registrar superficie</h2>
  <form id="form-superficie" class="lab-form">
    <input name="nombre" placeholder="Nombre: Pared del salon" maxlength="200" required>
    <select name="tipo">{{opciones_tipos!raw}}</select>
    <div class="err" id="lab-err-superficie"></div>
    <button class="btn btn-primary" type="submit">{{btn_registrar}}</button>
  </form>
</section>
<section class="tarjeta">
  <h2>Calibrar con 4 esquinas (homografia real)</h2>
  <form id="form-calibrar" class="lab-form">
    <p class="ayuda">{{ayuda_calibrar}}</p>
    <input name="corners" placeholder="0,0 640,0 640,360 0,360" required>
    <div class="err" id="lab-err-calibrar"></div>
    <button class="btn btn-primary" type="submit">{{btn_calibrar}}</button>
  </form>
</section>
<section class="tarjeta">
  <h2>Proyectar escena (frame warpeado real)</h2>
  <form id="form-proyectar" class="lab-form">
    <p class="ayuda">{{ayuda_proyectar}}</p>
    <select name="escena" required>{{opciones_escenas!raw}}</select>
    <select name="superficie" required>{{opciones_superficies!raw}}</select>
    <div class="err" id="lab-err-proyectar"></div>
    <button class="btn btn-primary" type="submit">{{btn_proyectar}}</button>
  </form>
  <div style="margin-top:12px"><img id="lab-proy-img" style="max-width:100%;border-radius:12px;border:1px solid var(--borde);display:none" alt="frame proyectado"></div>
</section>
<section class="tarjeta">
  <h2>Mis superficies (datos reales)</h2>
  <table>
    <thead><tr><th>Nombre</th><th>Tipo</th><th>Estado</th></tr></thead>
    <tbody>{{filas!raw}}</tbody>
  </table>
</section>
