<section class="tarjeta">
  <h2>Renderizar escena (escalera fotoreal real)</h2>
  <form id="form-render" class="lab-form">
    <p class="ayuda">{{ayuda_renderizar}}</p>
    <select name="escena" required>{{opciones_escenas!raw}}</select>
    <select name="calidad" required>
      <option value="borrador">Borrador (SVG)</option>
      <option value="alta">Alta (PNG 1080p + profundidad)</option>
      <option value="3d">3D (perspectiva + profundidad)</option>
      <option value="fotorreal">Fotorreal (4K iluminado + profundidad)</option>
    </select>
    <div class="err" id="lab-err-render"></div>
    <button class="btn btn-primary" type="submit">{{btn_renderizar}}</button>
  </form>
</section>
<section class="tarjeta">
  <h2>Renders terminados (PNG y SVG reales)</h2>
  <table>
    <thead><tr><th>Escena</th><th>Calidad</th><th>Resolucion</th><th>Profundidad</th><th>Descargar</th></tr></thead>
    <tbody>{{filas_renders!raw}}</tbody>
  </table>
</section>
