<section class="tarjeta">
  <h2>Registrar destino de salida</h2>
  <form id="form-display" class="lab-form">
    <p class="ayuda">{{ayuda_salidas}}</p>
    <input name="nombre" placeholder="Nombre: Proyector principal" maxlength="200" required>
    <select name="kind" required>{{opciones_kinds!raw}}</select>
    <div class="err" id="lab-err-display"></div>
    <button class="btn btn-primary" type="submit">{{btn_registrar_salida}}</button>
  </form>
</section>
<section class="tarjeta">
  <h2>Salidas registradas (estado honesto)</h2>
  <table>
    <thead><tr><th>Nombre</th><th>Tipo</th><th>Estado</th><th>Motivo</th><th></th></tr></thead>
    <tbody>{{filas!raw}}</tbody>
  </table>
  <div style="margin-top:12px"><img id="lab-test-img" style="max-width:100%;border-radius:12px;border:1px solid var(--borde);display:none" alt="patron de prueba"></div>
</section>
