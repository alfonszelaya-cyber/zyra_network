<section class="tarjeta">
  <h2>Evolucion temporal real</h2>
  <form id="form-simular" class="lab-form">
    <p class="ayuda">{{ayuda_simular}}</p>
    <select name="escenario" required>{{opciones_escenarios!raw}}</select>
    <div style="display:flex;gap:10px">
      <input name="horizonte" type="number" value="5" min="1" max="30" title="Horizonte (anios)">
      <input name="crecimiento" type="number" value="10" step="1" min="-50" max="200" title="Crecimiento anual %">
    </div>
    <div class="err" id="lab-err-simular"></div>
    <button class="btn btn-primary" type="submit">{{btn_simular_evolucion}}</button>
  </form>
</section>
<section class="tarjeta">
  <h2>Simulaciones ejecutadas (datos reales)</h2>
  <table>
    <thead><tr><th>Escenario</th><th>Horizonte</th><th>Metricas</th><th>Puntaje final</th></tr></thead>
    <tbody>{{filas_simulaciones!raw}}</tbody>
  </table>
</section>
