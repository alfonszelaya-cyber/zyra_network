version: '3.8'

services:
  zyra_network_node:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: zyra_network_core
    restart: always
    environment:
      - NODE_ENV=production
      - NETWORK_PORT=8000
      - LOG_LEVEL=INFO
    ports:
      - "8000:8000"
    networks:
      - zyra_internal_net
    resources:
      limits:
        cpus: '2.0'
        memory: 2048M
      reservations:
        cpus: '0.25'
        memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  zyra_internal_net:
    driver: bridge
