version: '3.8'

services:
  zyra_network_node:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: zyra_network_core
    restart: always
    environment:
      - NODE_ENV=production
      - NETWORK_PORT=8000
      - LOG_LEVEL=INFO
      - ZYRA_DATA_DIR=/data/zyra
      - ZYRA_ROOT_KEY=${ZYRA_ROOT_KEY}
      - ZYRA_API_TOKEN=${ZYRA_API_TOKEN}
      - ZYRA_BIOMETRICS_PROVIDER=${ZYRA_BIOMETRICS_PROVIDER:-fail-closed}
      - ZYRA_BIOMETRICS_MODELS_DIR=/data/models
    volumes:
      - zyra_data:/data/zyra
      - zyra_models:/data/models
    ports:
      - "8000:8000"
    networks:
      - zyra_internal_net
    resources:
      limits:
        cpus: '2.0'
        memory: 2048M
      reservations:
        cpus: '0.25'
        memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  zyra_data:
    name: zyra_data
  zyra_models:
    name: zyra_models

networks:
  zyra_internal_net:
    driver: bridge
