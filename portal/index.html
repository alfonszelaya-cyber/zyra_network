<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#0a0e27"><title>ZYRA</title><style>body{font-family:system-ui,sans-serif;margin:0;min-height:100vh;background:radial-gradient(circle at 20% 10%,#141a3d 0%,#0a0e27 55%);color:#e6edf3;display:flex;flex-direction:column;align-items:center;padding:40px 20px;box-sizing:border-box} .logo{width:84px;height:84px;border-radius:22px;background:linear-gradient(135deg,#8b5cf6,#3b82f6,#ec4899);display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:800;color:#fff;box-shadow:0 8px 30px rgba(139,92,246,0.45)} h1{margin:18px 0 4px;font-size:34px;letter-spacing:6px} .tag{color:#8b949e;margin:0 0 26px;text-align:center;max-width:420px} .estado{font-size:14px;margin:0 0 20px;padding:6px 14px;border-radius:99px;border:1px solid #238636;color:#3fb950} .menu{width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px} .opcion{display:flex;flex-direction:column;gap:2px;text-decoration:none;background:#11162b;border:1px solid #242c4f;border-radius:14px;padding:16px 18px} .opcion:hover{border-color:#8b5cf6} .opcion b{font-size:17px} .opcion span{font-size:13px;color:#8b949e} #btn-instalar{display:none;width:100%;max-width:420px;margin-top:12px;padding:14px;border-radius:14px;border:none;background:#238636;color:#fff;font-size:16px;font-weight:700} #banner-act{display:none;width:100%;max-width:420px;margin-top:16px;background:#1f2a44;border:1px solid #8b5cf6;border-radius:14px;padding:14px;text-align:center} #banner-act button{margin-top:8px;padding:10px 22px;border-radius:10px;border:none;background:linear-gradient(90deg,#8b5cf6,#ec4899);color:#fff;font-weight:700} .pie{margin-top:30px;color:#4a5370;font-size:12px;letter-spacing:2px}</style></head><body><div class="logo">Z</div><h1>ZYRA</h1><p class="tag">Red de confianza digital. Tu identidad, verificada y tuya.</p>__ESTADO__<div class="menu"><a class="opcion" href="/registro"><b>Registro</b><span>Crea tu ZID unico con biometria</span></a><a class="opcion" href="/entrar"><b>Entrar</b><span>Si ya estas registrado</span></a><a class="opcion" href="/verificar"><b>Verificar</b><span>Confirma la autenticidad de un documento</span></a></div><button id="btn-instalar" onclick="instalarApp()">Instalar app</button><div id="banner-act"><div>Nueva version disponible</div><button onclick="aplicarActualizacion()">Actualizar</button></div><p class="pie">JAZA GLOBAL SYSTEMS</p><script>var _zp=null;window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();_zp=e;document.getElementById('btn-instalar').style.display='block';});function instalarApp(){if(_zp){_zp.prompt();_zp=null;}}if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js');}fetch('/version').then(function(r){return r.text();}).then(function(v){v=v.trim();var g=localStorage.getItem("zyra_ver");if(g&&g!==v){document.getElementById("banner-act").style.display="block";}if(!g){localStorage.setItem("zyra_ver",v);}});function aplicarActualizacion(){fetch("/version").then(function(r){return r.text();}).then(function(v){localStorage.setItem("zyra_ver",v.trim());location.reload();});}</script></body></html>
