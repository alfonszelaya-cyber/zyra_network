<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Registro - ZYRA</title><style>body{font-family:system-ui,sans-serif;margin:0;min-height:100vh;background:#0a0e27;color:#e6edf3;display:flex;flex-direction:column;align-items:center;padding:28px 14px;box-sizing:border-box} .caja{max-width:480px;width:100%;background:#11162b;border:1px solid #242c4f;border-radius:16px;padding:24px 20px;box-sizing:border-box} h1{margin:0 0 6px;font-size:21px;text-align:center} p{color:#8b949e;font-size:13px;line-height:1.5;margin:6px 0;text-align:center} label{display:block;font-size:13px;color:#8b949e;margin:10px 0 4px} input{width:100%;padding:12px;border-radius:10px;border:1px solid #30363d;background:#0d1117;color:#e6edf3;box-sizing:border-box;font-size:15px} video{width:100%;border-radius:12px;background:#000;margin-top:6px} button{width:100%;margin-top:10px;padding:13px;border-radius:12px;border:none;background:linear-gradient(90deg,#8b5cf6,#3b82f6,#ec4899);color:#fff;font-size:15px;font-weight:700} .mini{background:#1f2a44;font-size:14px} .hecho{outline:2px solid #238636;opacity:.85} a{color:#8b5cf6;text-decoration:none} #resp{margin-top:12px;text-align:center;font-size:14px;word-break:break-all} .zid{color:#3fb950;font-weight:800;font-size:20px}</style></head><body><div class="caja"><h1>Registro de ciudadanos</h1><p>Un solo registro para toda la vida. La Red verifica tu identidad con biometria y crea tu <b>ZID unico e inmutable</b>.</p><form id="f" onsubmit="return enviar(event)"><label>Nombre completo</label><input id="nombre" required><label>1) Foto del documento (DUI o pasaporte)</label><input id="doc" type="file" accept="image/*" capture="environment" required><label>2) Selfie en vivo</label><video id="cam" autoplay playsinline></video><button type="button" class="mini" id="bcam" onclick="abrirCam()">Abrir camara</button><button type="button" class="mini" id="bself" onclick="tomarSelfie()">Capturar selfie</button><label>3) Crea tu clave de acceso</label><input id="clave" type="password" minlength="8" required><label>Repite la clave</label><input id="clave2" type="password" minlength="8" required><div id="resp"></div><button type="submit">Crear mi ZID</button></form><p style="margin-top:14px"><a href="/">Volver</a> | <a href="/entrar">Ya tengo ZID</a></p></div><script>function abrirCam(){navigator.mediaDevices.getUserMedia({video:{facingMode:"user"}}).then(function(s){document.getElementById("cam").srcObject=s;});}function capturar(v){var c=document.createElement("canvas");c.width=v.videoWidth||640;c.height=v.videoHeight||480;c.getContext("2d").drawImage(v,0,0);return c.toDataURL("image/jpeg",0.85).split(",")[1];}function tomarSelfie(){var v=document.getElementById("cam");if(!v.srcObject){alert("Abre la camara primero");return;}var b=capturar(v);var bt=document.getElementById("bself");bt.dataset.selfie=b;bt.classList.add("hecho");bt.textContent="Selfie capturada";}document.getElementById("doc").addEventListener("change",function(){var f=document.getElementById("doc");if(!f.files[0])return;var r=new FileReader();r.onload=function(){f.dataset.b64=r.result.split(",")[1];f.classList.add("hecho");};r.readAsDataURL(f.files[0]);});async function enviar(ev){ev.preventDefault();var R=document.getElementById("resp");var c1=document.getElementById("clave").value,c2=document.getElementById("clave2").value;if(c1!==c2){R.innerHTML="<p style='color:#f85149'>Las claves no coinciden.</p>";return false;}var db=document.getElementById("doc").dataset.b64,sb=document.getElementById("bself").dataset.selfie;if(!db){R.innerHTML="<p>Falta la foto del documento.</p>";return false;}if(!sb){R.innerHTML="<p>Falta la selfie en vivo.</p>";return false;}R.innerHTML="<p>Enviando a la Red... verificando biometria...</p>";var r=await fetch("/registro/nuevo",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({nombre:document.getElementById("nombre").value,clave:c1,doc_image_b64:db,selfie_image_b64:sb})});var j=await r.json();if(j.ok&&j.zid){R.innerHTML="<p>La Red creo tu identidad:</p><p class='zid'>"+j.zid+"</p><p>Guarda tu ZID y tu clave.</p><p><a href='/entrar'>Entrar con mi ZID</a></p>";}else{R.innerHTML="<p style='color:#f85149'>"+(j.error||"La Red no completo el registro")+"</p>";}return false;}</script></body></html>
