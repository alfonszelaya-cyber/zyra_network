<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Registro - ZYRA</title><style>body{font-family:system-ui,sans-serif;margin:0;min-height:100vh;background:#0a0e27;color:#e6edf3;display:flex;flex-direction:column;align-items:center;padding:24px 14px;box-sizing:border-box} .caja{max-width:480px;width:100%;background:#11162b;border:1px solid #242c4f;border-radius:16px;padding:22px 18px;box-sizing:border-box} h1{margin:0 0 6px;font-size:20px;text-align:center} p{color:#8b949e;font-size:13px;line-height:1.4;margin:5px 0;text-align:center} label{display:block;font-size:13px;color:#8b949e;margin:10px 0 4px} input,select{width:100%;padding:11px;border-radius:10px;border:1px solid #30363d;background:#0d1117;color:#e6edf3;box-sizing:border-box;font-size:15px} video{width:100%;border-radius:12px;background:#000;margin-top:6px} img.prev{width:100%;border-radius:12px;margin-top:6px;max-height:200px;object-fit:contain} button{width:100%;margin-top:10px;padding:13px;border-radius:12px;border:none;background:linear-gradient(90deg,#8b5cf6,#3b82f6,#ec4899);color:#fff;font-size:15px;font-weight:700} .mini{background:#1f2a44;font-size:13px;padding:10px} .ok{outline:2px solid #238636 !important;opacity:.9} a{color:#8b5cf6;text-decoration:none} #resp{margin-top:12px;text-align:center;font-size:14px;word-break:break-all} .zid{color:#3fb950;font-weight:800;font-size:20px} .debug{color:#f0b429;font-size:11px;text-align:center}</style></head><body><div class="caja"><h1>Registro de ciudadanos</h1><p>Un solo registro para toda la vida. La Red crea tu <b>ZID unico e inmutable</b>.</p><form id="f" onsubmit="return enviar(event)"><label>Nombre completo</label><input id="nombre" required><label>Tipo de documento</label><select id="tipo" onchange="cambiarTipo()"><option value="dui">DUI (2 lados)</option><option value="pasaporte">Pasaporte (1 cara)</option></select><label id="l1">1) Documento: lado frontal</label><input id="docFrente" type="file" accept="image/*" capture="environment" required onchange="prevDoc(this,'pFrente')"><img id="pFrente" class="prev" style="display:none"><label id="l2">2) Documento: lado de atras (solo DUI)</label><input id="docAtras" type="file" accept="image/*" capture="environment" onchange="prevDoc(this,'pAtras')"><img id="pAtras" class="prev" style="display:none"><label>3) Selfie en vivo</label><video id="cam" autoplay playsinline muted></video><button type="button" class="mini" id="bcam" onclick="abrirCam()">Abrir camara</button><button type="button" class="mini" id="bself" onclick="tomarSelfie()">Capturar selfie</button><img id="pSelfie" class="prev" style="display:none"><label>4) Crea tu clave de acceso</label><input id="clave" type="password" minlength="8" required><label>Repite la clave</label><input id="clave2" type="password" minlength="8" required><div id="resp"></div><button type="submit">Crear mi ZID</button></form><p style="margin-top:14px"><a href="/">Volver</a> | <a href="/entrar">Ya tengo ZID</a></p></div><script>function cambiarTipo(){var t=document.getElementById("tipo").value;var la=document.getElementById("l2"),da=document.getElementById("docAtras");if(t==="pasaporte"){la.style.display="none";da.required=false;da.style.display="none";da.value="";document.getElementById("pAtras").style.display="none";}else{la.style.display="block";da.style.display="block";da.required=true;}}function prevDoc(input,imgId){if(!input.files[0])return;var r=new FileReader();r.onload=function(e){var img=document.getElementById(imgId);img.src=e.target.result;img.style.display="block";input.dataset.b64=e.target.result.split(",")[1];input.classList.add("ok");};r.readAsDataURL(input.files[0]);}function abrirCam(){var v=document.getElementById("cam");navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:640}}}).then(function(s){v.srcObject=s;v.play();document.getElementById("bcam").textContent="Camara activa";}).catch(function(e){alert("Error camara: "+e.message);});}function tomarSelfie(){var v=document.getElementById("cam");var R=document.getElementById("resp");if(!v.srcObject||v.readyState<2){R.innerHTML="<p style='color:#f0b429'>Abre la camara primero y espera 2 segundos.</p>";return;}if(v.videoWidth===0){R.innerHTML="<p style='color:#f0b429'>Camara cargando... intenta de nuevo.</p>";return;}var c=document.createElement("canvas");c.width=v.videoWidth;c.height=v.videoHeight;c.getContext("2d").drawImage(v,0,0);var b=c.toDataURL("image/jpeg",0.85).split(",")[1];var bt=document.getElementById("bself");bt.dataset.selfie=b;bt.classList.add("ok");bt.textContent="Selfie capturada";var p=document.getElementById("pSelfie");p.src="data:image/jpeg;base64,"+b;p.style.display="block";R.innerHTML="<p style='color:#3fb950'>Selfie OK.</p>";}async function enviar(ev){ev.preventDefault();var R=document.getElementById("resp");var c1=document.getElementById("clave").value,c2=document.getElementById("clave2").value;if(c1!==c2){R.innerHTML="<p style='color:#f85149'>Las claves no coinciden.</p>";return false;}var df=document.getElementById("docFrente").dataset.b64;var da=document.getElementById("docAtras").dataset.b64||"";var sb=document.getElementById("bself").dataset.selfie;if(!df){R.innerHTML="<p>Falta el documento.</p>";return false;}if(!sb){R.innerHTML="<p>Falta la selfie.</p>";return false;}var tipo=document.getElementById("tipo").value;if(tipo==="dui"&&!da){R.innerHTML="<p>Falta el reverso del DUI.</p>";return false;}R.innerHTML="<p>Enviando a la Red...</p>";var r=await fetch("/registro/nuevo",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({nombre:document.getElementById("nombre").value,clave:c1,doc_image_b64:df,doc_back_b64:da,selfie_image_b64:sb,doc_type:tipo})});var j=await r.json();if(j.ok&&j.zid){R.innerHTML="<p>La Red creo tu identidad:</p><p class='zid'>"+j.zid+"</p><p>Guarda tu ZID y tu clave.</p><p><a href='/entrar'>Entrar</a></p>";}else{R.innerHTML="<p style='color:#f85149'>"+(j.error||"Error")+"</p>";}return false;}</script></body></html>
