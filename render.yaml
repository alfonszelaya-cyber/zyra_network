services:
  - type: web
    name: zyra-network
    runtime: python
    plan: free
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: ZYRA_PORT
        value: "10000"
      - key: ZYRA_DATA_DIR
        value: "/opt/render/project/src/data"
      - key: ZYRA_ROOT_KEY
        sync: false
      - key: ZYRA_API_TOKEN
        sync: false

  - type: web
    name: zyra-superapp
    runtime: python
    plan: free
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: python superapp.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: SUPERAPP_DATA_DIR
        value: "/opt/render/project/src/data"
      - key: ZYRA_HOST
        fromService:
          name: zyra-network
          type: web
          property: host
