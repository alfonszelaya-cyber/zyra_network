services:
  - type: web
    name: zyra-network
    runtime: python
    plan: free
    buildCommand: |
      pip install --upgrade pip
      pip install "cryptography>=42,<45"
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: ZYRA_PORT
        value: "10000"
      - key: ZYRA_API_TOKEN
        sync: false
